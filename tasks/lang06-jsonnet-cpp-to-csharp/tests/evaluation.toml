# --------------------------------------------------------------------------- #
# lang06 -- jsonnet, C++ to C#: how a submission is graded
# --------------------------------------------------------------------------- #
# Three stages, in order, each able to end the grading run:
#
#   1. an audit review, by a model that may read both trees and may run
#      nothing, preceded by a read-only scan that hands it findings
#   2. 19 behavioural modules, 18 of them scored, 40 points, all or nothing,
#      measuring the published CLIs against expectations frozen from the C++
#      reference
#   3. 6 adversaries with both trees and both builds, 60 points
#
# The agent never sees this file, or anything else under tests/.
schema = "swerefactor.evaluation/1"
task = "lang06-jsonnet-cpp-to-csharp"
title = "jsonnet 0.20.0: reimplement a C++ language interpreter in C#, output byte-identical"
results_dir = "/logs/verifier"

[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it, and short of all of it stage 3 does not run.
# Paying six models to look for an input the port mishandles, when stage 2 has
# already found one, tells you nothing you did not already know -- the finding is
# in the behavioural report, with the failing case named.
#
# Full marks being *reachable* is what makes this a gate and not a wall, and here
# that is a property of the corpus rather than an assumption: the reference answers
# all 2,602 cases of the 18 scored families, which the image build proves.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "language-rewrite"
state_a = "jsonnet 0.20.0: 14,958 lines of C++11 in core/ and cmd/, plus a C ABI, a C++ binding, a CPython extension and vendored rapidyaml/md5/nlohmann; GNU make, CMake, bazel and MSVC; jsonnet(1) and jsonnetfmt(1); std.jsonnet embedded as a C array"
state_b = "the same two CLIs, byte-identical on stdout/stderr/exit status, in C# on .NET 8 against the base class library alone, std.jsonnet preserved and interpreted"
scale = "4,296 files; a lexer, a comment-preserving parser, a desugarer, a static analyser, a lazy evaluator with 39 natives, a YAML and JSON parser, and a formatter"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Nine gates, all of them required.  They are the judgements about this task that
# cannot honestly be settled by a pattern.
#
# Three of them are questions an artefact could answer instead -- the published
# assemblies are inspectable managed IL, they declare no P/Invoke, they reference no
# process-spawning API -- and they are asked here anyway, as `no-native-interop`,
# `no-subprocess-oracle` and `no-cpp-build-system`.  Reading the CLR metadata tables
# is the sharper instrument, and it needs a thing that has been built: State A is
# C++, publishes no assembly, and therefore fails all three on the very tree stage
# 2's expectations are frozen from.  A stage that charges for a check its own oracle
# cannot pass is unpassable by the reference, which is a defect in the stage rather
# than a fact about any submission.
#
# What that costs is worth writing down.  A required gate here fails the whole
# submission, which is harsher than a weighted module -- but it is a model reading
# source, and a DllImport whose target is a computed string can be written to
# survive that where it cannot survive an ImplMap read.  The inspector that reads it
# is built and proved working in the stage-2 image (see lib/asmmeta.py), so
# restoring the measurement means giving a module a weight, or moving the read to
# stage 3, which already builds both trees.  Neither is attempted here.
#
# Claims about files in the repository rather than about the product are not gates
# at all.  A licence file and the conformance suite have nothing to do with whether
# the port works, and grading never reads the submission's copy of the suite --
# stage 2 materialises every input from its own frozen State A -- so editing it
# cannot change a score.  An advisory gate would not help: `grade_audit` builds
# the verdict from the conjunction of the *required* checks, so an advisory answer
# is read by nothing, and a submission would be paying a model to form a judgement
# that goes nowhere.  If either question should be able to void a submission, the
# honest form of that is `required = true`.
#
# Nothing is lost by keeping them out, because the reading and the vote are
# separate.  The scan below hashes the standard library and the conformance data and
# lists what it finds, and its digest reaches the transcript whatever gates exist --
# `swerefactor.scan` writes it unconditionally -- so a human reading the report still
# sees an edited LICENSE or a mutated test_suite.
#
# The scan below is the mechanical half of all of it: State A's C++ translation
# units by name, the four forbidden build systems, the standard library by hash,
# compiled artefacts by extension and by magic byte, long base64 and hex runs, what
# the project files declare about package references.  It runs before the review and
# is substituted into the prompt as findings.  Nothing it emits is scored --
# `swerefactor.scan` forces required = false on every check -- and nothing it emits is
# a verdict.  It tells the reviewer where to look.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
max_turns = 120
image = "swerefactor/lang06-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.

max_turns is high because this is 15,000 lines of C++ against however much C#
replaced it, and the two questions that matter -- is there an evaluator in here,
and is the standard library being interpreted or was it quietly hand-translated --
are not answerable without reading a fair amount of both.

There is deliberately no SDK and no C++ toolchain in this image.  A review that
can build starts grading build logs, which is stage 2's job and which it does
better.
"""

[[stages.audit.gate]]
id = "no-cpp-sources"
title = "the C++ implementation left the repository"
required = true
question = """
State A's implementation is core/ and cmd/: 14,958 lines of C++ holding the lexer,
parser, desugarer, static analyser, evaluator and formatter, plus the C ABI in
include/, the C++ binding in cpp/, the CPython extension in python/, and
third_party/ -- rapidyaml, nlohmann/json and an md5, all compiled in.  Is that C++
gone, and is what replaced it a C# implementation rather than the same C++
somewhere else?

third_party/ is worth a moment: it is where `std.parseYaml` and `std.md5` come
from, so a port has to have answered those somehow.  Doing it with the base class
library, or by writing a YAML parser, is the exercise.  Re-vendoring the same C++
under a new path is this gate.

The interesting cases are C++ that moved rather than left: relocated to a
directory the build no longer names but a script still compiles, renamed to an
extension nobody scans for, embedded as a string literal or byte array and written
out at build time, vendored under a dependency path, or fetched during the build.

C++ that is genuinely not the implementation is not a finding: a benchmark, an
example, a documentation asset, a golden *output* file whose name happens to end
in .cpp because it records what the C++ printed.  When you report C++, say what
compiles it and where the result goes -- "C++ is present" and "C++ is the product"
are different claims and only the second one is this gate.
"""

[[stages.audit.gate]]
id = "no-cpp-build-system"
title = "nothing still builds the C++"
required = true
question = """
State A is built by a Makefile, and also carries CMakeLists.txt, a bazel build
graph (BUILD, WORKSPACE and .bzl files at several depths, including under
stdlib/), an MSVC project directory, a setup.py for the Python extension, and a
tests.sh that runs the C++ suite against the built binary.  Every one of them
describes how to produce the thing being replaced.

Are they gone, and is the build that remains a .NET build that produces the two
CLIs from C# source?

Look at any depth, including inside directories the task preserves: State A keeps
build descriptions under `stdlib/` and `test_suite/` as well as at the root.

A build file that survives but builds nothing -- its sources deleted, or no root
graph reaching it -- is **still a fail**, not a weaker verdict.  Say in your
reasoning which of the two you found, because the distinction is worth recording,
but do not let "it is inert" become a pass: this gate is about what the tree still
contains, and there is no third verdict for a weaker finding.

A shell script that merely invokes `dotnet` is not a C++ build system, and neither
is a Makefile that runs the `jsonnet` CLI over a demo without naming a compiler or
a C++ source -- `case_studies/fractal/Makefile` is such a file and is not a finding.
"""

[[stages.audit.gate]]
id = "no-prebuilt-binaries"
title = "no compiled implementation ships inside the submission"
required = true
question = """
Is there a compiled artefact in this tree that could be doing the work?  An ELF or
PE file, a shared object, a static archive, an object file, a managed assembly
checked into source rather than produced by the build.

Check by content and not only by name: a file with no extension, or with a
harmless one, whose first bytes are \\x7fELF or MZ is the case this gate exists
for.  So is a base64 or hex blob in a source file that gets decoded and written to
disk at run time -- report what decodes it and what happens to the bytes.

An out-of-source build or publish directory is exempt: those are produced by
building, and the collection step drops them before grading anyway.  What matters
is a compiled artefact in tracked source that the submitted build would use.
"""

[[stages.audit.gate]]
id = "no-subprocess-oracle"
title = "nothing shells out to a jsonnet"
required = true
question = """
Does anything in this repository start another program to do the evaluating or the
formatting?  A retained reference binary, a jsonnet found on PATH, a language
runtime invoked with a script, a service contacted over a socket or a pipe.

The shape to look for is a code path that hands an input file or an expression to
something outside the process and returns what came back as its own answer.
Process invocation that is plainly not that -- a build script running `dotnet`, a
test runner, a tool that formats source at development time -- is not this gate.

Say what is invoked, what is passed to it, and what is done with its output.  A
process spawn with the input flowing in and the answer flowing out is the finding;
the mere presence of an API that can spawn processes is not.

This is the only place the question is asked at all, so read the source for it
rather than expecting a report to arrive.  A stage-2 module used to list every
MemberRef into Process, NativeLibrary, Marshal and Assembly::LoadFile in the
published assemblies; it was worth nothing, so it could not act on what it listed,
and it has been removed.  Nothing downstream will hand you that list.

The reason it was never a verdict on its own is the reason in the sentence above:
a reference is not a spawn, and `Marshal.SizeOf` in a hand-rolled lexer is not a
shell-out.  The judgement was always yours; now the reading is too.
"""

[[stages.audit.gate]]
id = "no-native-interop"
title = "the work is done in managed C#"
required = true
question = """
Does the implementation do its own evaluating, or does it call out to native code
that does?  A P/Invoke declaration into libjsonnet, a native library loaded at run
time, a C++/CLI or unsafe shim compiled from sources in this tree, a native
dependency named by a project file.

The distinction that matters is what produces the answer.  Managed code that
happens to use spans, pointers or unsafe blocks for its own arithmetic is a normal
C# implementation and not a finding.  A DllImport whose target is the thing being
replaced is exactly this gate.

Nothing else reads for this.  A stage-2 module used to read the published
assemblies' metadata tables, where an ImplMap row records every P/Invoke and
cannot be spelled around; it carried no weight, so nothing it found could move a
score, and it has been removed.  This gate is now the whole of the check, and it
is required -- a finding here scores the submission zero.

So ask both halves.  The one metadata answered: is there a P/Invoke, a native
library loaded at run time, a C++/CLI or unsafe shim built from this tree, a
native dependency named by a project file?  And the one it never could: is there
a path in this source, however it is spelled, by which the reference
implementation still computes the result?
"""

[[stages.audit.gate]]
id = "no-answer-lookup"
title = "the output is computed, not recalled"
required = true
question = """
Does the port evaluate its input, or does it recognise it?

The shape is a table: a map from an input, a hash of an input, a filename or a
command line to an output that gets printed verbatim.  It can be a switch on the
argument, a dictionary of expected stdout, a resource file of golden outputs, a
special case for a path under test_suite/, or a branch that notices it is being
graded and behaves differently.

State A is mounted beside the submission.  Compare: content the original ships as
*input* (the conformance suite's .jsonnet files, the standard library) is expected
to survive.  Content the original ships as *expected output* -- the .golden files
next to the tests, the recorded stdout in test_cmd/ -- has no business being read
by an implementation, and a port that consults it while evaluating is answering
from a key.

Look at anything the submission authored, whatever its extension: a .json of
answers is the same finding as a C# dictionary of them.  Report the file, the path
that reads it, and what the value is used for.
"""

[[stages.audit.gate]]
id = "stdlib-preserved"
title = "the standard library is the file State A shipped"
required = true
question = """
stdlib/std.jsonnet is 1,713 lines of Jsonnet that implements most of `std`.  In
State A it is embedded into the binary as a C array by stdlib/to_c_array.cpp.  The
contract is that this file survives byte for byte.

Is it there, and is it unmodified?  Compare it against State A's copy.  Report any
difference -- a changed line, a reformatting, a re-encoding, a truncation, a
"port-friendly" rewrite of a field.

The generator that turned it into a C array is C++ and is expected to be gone; the
.jsonnet file it consumed is not.
"""

[[stages.audit.gate]]
id = "stdlib-is-interpreted"
title = "std.jsonnet is executed, not transliterated"
required = true
question = """
This is the gate that separates a Jsonnet implementation from something that
passes Jsonnet's tests.

std.jsonnet is preserved *because the implementation runs it*.  Read
core/desugarer.cpp's stdlibAST to see the arrangement State A actually uses: it
lexes and parses std.jsonnet, then walks the 39 native builtins over the resulting
object, replacing a field body where the name already exists and appending a hidden
field where it does not.  Seven of the 102 fields in the file are replaced that way,
32 are added, `thisFile` is appended -- 135 fields in the `std` a program sees --
and the other 95 stay exactly as written: Jsonnet code, interpreted by the same
evaluator that interprets user code.

A port that keeps the file on disk to satisfy the previous gate while
hand-translating those 95 into C# has built a different product: its evaluator has
never been asked to run a fold, a comprehension or a recursive function, and the
file is decoration.

So: does the submission load std.jsonnet and evaluate it?  Follow the path from
whatever reads that file to whatever consumes the result.  A port that embeds the
source as a resource or a string constant and then interprets it is fine -- that
is the same arrangement as the C array.  A port where nothing reads it, or where
what reads it only checks a hash, is the finding.

Native implementations are not a finding: 39 of them are how State A works, and a
port is free to disagree about which few it implements natively -- the tests decide
that, not you.  What this gate asks is whether the bulk of `std` arrives by
interpretation at all.
"""

[[stages.audit.gate]]
id = "is-an-implementation"
title = "there is an interpreter in here"
required = true
question = """
Step back from the file list and read the C#.  Is this a Jsonnet implementation?

What State A does, and what a port therefore has to do: tokenise, parse into an
AST that retains comments and whitespace as fodder, desugar the sugar (object
comprehensions, string interpolation, `+:` inheritance, `local` as a function
parameter), analyse for unbound variables, and evaluate lazily -- thunks, closures,
object inheritance with `super` and `self`, and errors that carry a stack trace.
And separately, a formatter that reprints a parsed file with its comments back in
place.

Signs of the thing this gate is looking for: an evaluator that is a `switch` over
a handful of node kinds with the hard cases missing; laziness implemented by
evaluating eagerly and hoping; a formatter that is a regex pass over the input
text; large C# files that are unreachable from any entry point, present to make
the tree look substantial.

Do not measure this by line count alone, and do not fail a port for being
differently structured than the C++ -- an idiomatic C# design is the point of the
exercise, and a port organised around visitors where the C++ used a switch is
doing it right.  The question is whether the machinery is present, reachable, and
doing the work.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural suite
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/lang06-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
19 modules run, 18 are scored, one process each, weight-normalised rather than
pooled: the operator matrix alone is over a thousand cases exercising one
dispatcher, and a pooled pass rate would let it decide the score on its own.

The 18 scored modules are the behavioural families, sliced by what they exercise
rather than by how many cases they hold, and their weights sum to exactly 1.00 --
the whole of this stage.  Every case runs the published CLI as a user would --
argv, stdin, files on disk -- and compares stdout, stderr, exit status, and the
files the run created or deleted, byte for byte, against expectations frozen from
the C++ reference at image-build time.  No case reads the submission's source, and
no case asserts anything about how it is written.

`build` runs first and is the one module worth 0.00.  It publishes both CLIs from
the submitted source, offline, into scratch prefixes of its own, and writes what it
produced -- the two publish directories, the launcher argv, the full logs -- to
$SRB_SUITE_WORK/build.json.  The other 18 modules read that ledger and never
build.  Nothing is graded against publish output the agent left in the workspace:
the collection step drops bin/ and obj/, and the build module deletes what
survives before it starts.

It is zero for two reasons that agree.  Every expectation this stage scores was
recorded from State A, and State A is 14,958 lines of C++ built by a Makefile: it
has no .csproj for `dotnet publish` to find.  So its subject is not a behaviour of
jsonnet that a port might fail to preserve -- it is whether the migration happened
at all, asked of the tree the answers came from, and charging for that makes the
reference unable to pass a stage assembled from its own output.  And it publishes
what all 18 families run, so a tree that does not publish already fails every one
of them: a weight here would charge one failure twice.  The question has an owner
and it is stage 1, where `no-cpp-build-system` is required and scores the whole
submission zero.  The module stays because its report -- which project produced
which assembly, and what the restore said when it failed -- is the one thing that
turns that stage-1 finding into a fix, and no source review can produce it.

One thing no stage measures, stated here because it is the gap a reader of this
file would otherwise have to find: nothing reads a published assembly's metadata,
so nothing prices a P/Invoke by looking at what was built.  The ImplMap, ModuleRef
and MemberRef tables of the published output would say whether the IL is
inspectable and whether any assembly reaches native code or a process-spawning
API, and no module reads them.

Stage 1 inherits the question as a source review, where `no-native-interop` is
required and scores the whole submission -- so what it catches it charges at full
price, and what defeats it is a computed DllImport target, which a metadata read
would have seen.  The inspector is still built and still proved working inside the
stage-2 image, so the measurement can be restored by giving a module a weight;
lib/asmmeta.py records what would be involved.

That leaves the 18 families carrying the score alone, so the claim they rest on is
now proved at image-build time instead of assumed: `driver.py --replay-reference`
grades the C++ reference against the expectations frozen from it, through the same
executor and the same comparison a submission gets, and requires 2,602 of 2,602.
A case the reference cannot answer is a defect in the case -- and it would have
been invisible in grading, since every submission loses the same weight for it.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/lang06-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
# Stated rather than left to the default, which happens to be `anthropic` and so
# happens to be right.  A reader should not have to know the default to know which
# wire format this stage speaks, and the pairing is not free to get wrong: a model
# posted in the other family's dialect does not fail at load, it spends the stage's
# timeout failing per sample and reports a harness fault.  Stage 1 states its
# driver one section up for the same reason.
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and both builds, and try to write a
case the C++ passes and this C# fails.  A candidate is upheld only if it passes
against the original, fails against the submission, reproduces across three runs,
and is inside the declared scope.  Each model that finds nothing is worth 10
points.

A candidate is the same shape as a stage-2 case -- an input, an argv, a comparison
of stdout, stderr and exit status between the two builds -- so a model that finds
something has found a hole in stage 2's coverage, and the case can be read
directly into the suite afterwards.

This is the only image with both toolchains, because it is the only stage that has
to build State A as well as the submission: a candidate's claim that "the original
does X" is worth nothing unless the original is right there to demonstrate it.
"""
