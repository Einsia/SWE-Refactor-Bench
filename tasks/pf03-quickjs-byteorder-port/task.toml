# =============================================================================
# pf03 -- QuickJS 2020-11-08: little-endian x86-64 to big-endian s390x.
#
# State A is an interpreter that only ever ran on one byte order.  cutils.h
# undefines WORDS_BIGENDIAN unconditionally, so every place in the engine that
# asks "is this machine big-endian?" is answered `no` at compile time on every
# machine.  Nothing about that fails to compile on s390x; it produces an
# interpreter that gives wrong answers -- DataView's default byte order comes out
# inverted, the bytecode container is written with a version byte that lies about
# its layout, and the Makefile bootstraps repl.c through a qjsc it built for the
# host rather than for the target.
#
# State B is the same sources building three ways from one tree: x86-64 (the
# reference, whose behaviour must not move), s390x big-endian LP64, and armhf
# little-endian ILP32.  The third target is the control -- it separates "byte
# order" from "word size", and a submission that fixed only the 64-bit
# assumptions would pass it and still fail s390x.
#
# What the grader is:  tests/evaluation.toml, three stages.
#   1. an agentic audit review -- prose gates, read-only, pass/fail
#   2. twelve rule-based behavioural modules -- 40 points, all of them or none,
#      and all of them to go on
#   3. six verification rounds -- 60 points, 10 each
# score.py is the entry point and delegates to the shared harness.
# =============================================================================

schema_version = "1.4"

# --------------------------------------------------------------------------- #
# What is collected from the agent's container as the submission
# --------------------------------------------------------------------------- #
# The exclusions are build output only.  Every one of them is a file the
# Makefile writes; none is a delivered source.  Two need saying out loud:
#
#   repl.c / qjscalc.c    generated by qjsc from repl.js / qjscalc.js during the
#                         build.  They are excluded because they are output --
#                         and because a stale one, generated for the wrong byte
#                         order, is precisely the failure this task is about.
#                         The graded builds regenerate them from the .js files.
#
#   hello.c / test_fib.c  the same, for the examples -- and the two this list
#                         forgot.  They are qjsc output by the same kind of rule
#                         (`hello.c: $(QJSC) $(HELLO_SRCS)`), they are absent
#                         from State A, and the delivered-state scan's own
#                         GENERATED_SOURCES already names all six.  The omission
#                         cost a whole run to find: an agent has to build in-tree
#                         to test a byte-order port at all, so these two were
#                         collected, the scan reported "generated source(s)
#                         delivered rather than generated", and two of three
#                         reviewers read that as the very arrangement the
#                         `port_is_genuine` gate exists to reject -- on a
#                         submission whose port was real, and against a gate that
#                         fails a whole run on its own.  A third reader was all
#                         that stood between it and a zero, and the same reading
#                         would land the other way just as easily.  This list and
#                         GENERATED_SOURCES have to stay mirrors of each other; a
#                         name in one and not the other charges the submission for
#                         the collector.
#
#   test262_errors.txt    NOT excluded.  Upstream ships it as a delivered file
#   test262o_errors.txt   (the expected-failure lists), so it is part of State A.
[[artifacts]]
source = "/workspace/repo"
exclude = [
    ".obj",
    "*.o",
    "*.a",
    "*.d",
    "*.so",
    "*.lo",
    "*.obj",
    "qjs",
    "qjsc",
    "qjscalc",
    "host-qjsc",
    "qjs32",
    "qjs32_s",
    "qjs-debug",
    "run-test262",
    "unicode_gen",
    "repl.c",
    "qjscalc.c",
    "out.c",
    "hello.c",
    "test_fib.c",
    "hello",
    "hello_module",
    "test_fib",
    "libunicode-table.h.new",
    "test262",
    "test262o",
    "test262_report.txt",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
]

[task]
name = "swerefactor/pf03-quickjs-byteorder-port"
description = "Port the QuickJS 2020-11-08 interpreter off its little-endian x86-64 assumption so that one source tree builds and behaves correctly on big-endian s390x and on 32-bit little-endian armhf, with x86-64 behaviour unchanged: byte-order detection, the bytecode container and its version byte, DataView, typed-array storage, Atomics, the bignum layer, and the qjsc bootstrap that embeds compiled JavaScript into C."
authors = []
keywords = [
    "swe-refactor",
    "platform-port",
    "byte-order",
    "endianness",
    "c",
    "quickjs",
    "cross-compilation",
    "s390x",
    "offline",
]

[metadata]
category = "platform-rewrite"
difficulty = "frontier"
license = "MIT"
upstream = "https://bellard.org/quickjs/"
upstream_version = "2020-11-08"
source_repository = "https://bellard.org/quickjs/"
source_version = "2020-11-08"
state_a = "QuickJS 2020-11-08 as upstream ships it: 85k lines of C in which cutils.h:32 undefines WORDS_BIGENDIAN unconditionally, the bytecode reader trusts host layout, typed-array storage is read back through pointers of a different width, and the Makefile's repl.c bootstrap runs a host qjsc"
state_b = "the same sources building three ways -- x86-64, s390x big-endian LP64, armhf little-endian ILP32 -- with byte order derived from the compilation target, the bytecode container self-describing, and every ECMAScript-defined answer identical on all three"
scale = "85k lines of C across 25 translation units, a 53.8k-line interpreter, an 8.5k-line bignum layer, 176 bytecode read/write sites, 22 JavaScript files, a 469-line Makefile"
tags = [
    "whole-repository",
    "platform-rewrite",
    "endianness",
    "cross-compilation",
    "qemu-user",
    "bytecode-format",
    "offline",
    "anti-cheat-gated",
]

# --------------------------------------------------------------------------- #
# The agent's container
# --------------------------------------------------------------------------- #
# Six hours.  The port is not a patch: the byte-order decision has to be made
# once and then followed through the serialiser, the typed-array layer and the
# build, and none of it can be verified by compiling -- it all has to be run,
# on two emulated machines.
[agent]
harness = "codex-cli 0.146.0"
timeout_sec = 21600.0
network_mode = "no-network"
user = "root"

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/workspace/repo"

[environment.env]
# TZ and the locale are pinned because Date and toLocaleString are observable and
# a submission developed under a different timezone would diverge from the
# reference for a reason that has nothing to do with byte order.
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
MAKEFLAGS = "-j4"

# --------------------------------------------------------------------------- #
# The verifier's container
# --------------------------------------------------------------------------- #
# The timeout covers the whole ladder, whose own budgets in tests/evaluation.toml
# are 5400 + 14400 + 54000 = 73800s.  The margin above that is for building three
# images and for the ladder's own overhead, and it is a ceiling rather than an
# expectation: most submissions never reach stage 3, because stage 1 zeroed them
# or stage 2 came in short of full marks.
#
# Stage 2's own 4h is larger than most tasks' because two of its three targets
# execute under qemu-user, and stage 1 is an hour and a half of reading with no
# compiler in the image at all.  `separate` because the stages have deliberately
# different capabilities -- stage 1 has none of the toolchain, stage 2 has the
# cross compilers and the emulators, stage 3 has the native toolchain and neither
# cross compiler.
#
# Stage 3's budget is deliberately not 6 * 3600: an adversary that concludes
# early returns early, and the hour is a limit on one round rather than a quota to
# be spent.
[verifier]
timeout_sec = 79200.0
environment_mode = "separate"
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 7200.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
MAKEFLAGS = "-j4"
SRB_INFRA = "/opt/swerefactor"
SRB_RESULTS = "/logs/verifier"

# There is deliberately no solution/ tree and no [solution.env].  A benchmark that
# ships the answer beside the question measures whichever of the two a harness
# happens to reach first.
