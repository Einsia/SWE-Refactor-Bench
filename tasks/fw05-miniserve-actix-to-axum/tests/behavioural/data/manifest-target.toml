
# ---------------------------------------------------------------------------
# State B target stack: the manifest this image's cargo registry was VENDORED
# from, at image build time, spliced for that purpose into State A's own
# [dependencies] -- actix lines and all -- so that one resolve produced a
# superset closure covering both frameworks.
#
# It is a description of what the registry contains. It is NOT a [dependencies]
# block to copy: because it was resolved alongside State A, several crates appear
# here twice under different keys. The four `-full` keys are `{ package = ... }`
# aliases of crates declared elsewhere in the same table, present only so cargo
# vendors their complete feature sets; `rustls-new`, `rustls-pemfile-new` and
# `base64-new` let the new majors resolve beside the old ones State A pinned. A
# manifest carrying both keys of any pair resolves and locks without complaint and
# then fails at build with "depends on crate ... multiple times with different
# names". Take one declaration per crate. The single alias meant for a
# submission's own manifest is `http1`, for the reason given at its line.
#
# Every version is exact. Two reasons: the vendored closure has to be
# byte-reproducible across image rebuilds, and the toolchain is Rust 1.77.2
# (the era of miniserve 0.27.1, and the last that compiles the pinned
# time-0.3.34). Anything resolving to a 2025-era release drags in crates that
# declare `edition2024`, which cargo 1.77 cannot parse at all.
# ---------------------------------------------------------------------------
axum = { version = "=0.7.9", features = ["multipart", "http2", "macros", "tokio"] }
axum-extra = { version = "=0.9.6", features = ["typed-header"] }
axum-server = { version = "=0.7.1", features = ["tls-rustls-no-provider"] }
tower = { version = "=0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "=0.6.2", features = ["fs", "compression-br", "compression-gzip", "compression-zstd", "compression-deflate", "auth", "validate-request", "trace", "set-header", "normalize-path", "map-response-body"] }
hyper = { version = "=1.5.2", features = ["full"] }
hyper-util = { version = "=0.1.10", features = ["full"] }
http1 = { package = "http", version = "=1.2.0" }
http-body = "=1.0.1"
http-body-util = "=0.1.2"
tokio-util = { version = "=0.7.13", features = ["full"] }
tokio-stream = { version = "=0.1.17", features = ["fs", "io-util", "net", "sync", "time"] }
futures-util = { version = "=0.3.31", features = ["io", "sink", "async-await-macro"] }

# The closure has to be a superset by FEATURES as well as by name: an optional
# dependency of a crate that is present but feature-gated off is still absent
# from the registry, and the submission's own feature choices are not known in
# advance. tokio in particular reaches for mio/socket2/signal-hook-registry only
# under net/rt-multi-thread/signal, none of which miniserve's `fs` enables.
tokio-full = { package = "tokio", version = "=1.36.0", features = ["full"] }
# tower's own "full" is not usable here: it enables `balance`/`load`/`hedge`,
# which pull hdrhistogram 7.6 (edition2024). Those are load-balancer features a
# single-process file server has no use for; everything a middleware stack needs
# is listed explicitly.
tower-full = { package = "tower", version = "=0.5.2", features = [
    "util", "timeout", "limit", "buffer", "retry", "load-shed",
    "filter", "steer", "make", "spawn-ready", "reconnect", "discover",
] }
tower-http-full = { package = "tower-http", version = "=0.6.2", features = ["full"] }
hyper-util-full = { package = "hyper-util", version = "=0.1.10", features = ["full"] }
httpdate = "=1.0.3"
urlencoding = "=2.1.3"
serde_urlencoded = "=0.7.1"
serde_json = "=1.0.140"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "env-filter"] }
headers = "=0.4.0"
mime_guess = "=2.0.5"
rustls-new = { package = "rustls", version = "=0.23.20", features = ["ring", "std", "logging", "tls12"], default-features = false }
rustls-pemfile-new = { package = "rustls-pemfile", version = "=2.2.0" }
rustls-pki-types = "=1.10.1"
tokio-rustls = { version = "=0.26.1", features = ["ring"], default-features = false }
multer = "=3.1.0"
base64-new = { package = "base64", version = "=0.22.1" }
async-compression = { version = "=0.4.18", features = ["tokio", "brotli", "gzip", "zstd", "deflate"] }
pin-project-lite = "=0.2.15"
bytes = "=1.9.0"
tower-layer = "=0.3.3"
tower-service = "=0.3.3"
sync_wrapper = "=1.0.2"
matchit = "=0.7.3"

# Transitive pins. `fastrand` and `jobserver` reach for getrandom 0.4, and
# rustls reaches for zeroize 1.9; all three of those are edition2024. Every
# consumer in the graph accepts a semver-compatible older release, so these pins
# unify the graph rather than duplicating it.
fastrand = "=2.1.1"
jobserver = "=0.1.32"
zeroize = "=1.8.1"
