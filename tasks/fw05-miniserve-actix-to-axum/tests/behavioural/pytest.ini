; Shared by the thirteen pytest modules in this suite, and passed explicitly with
; -c so a module's rootdir can be its own directory without losing these settings.
; Discovery would find this file by walking up from the module directory, which
; works right up until someone runs a module from somewhere else.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; No `timeout` setting, and no pytest-timeout: every blocking path in this suite
; already carries its own deadline (SRB_REQUEST_TIMEOUT, SRB_READY_TIMEOUT,
; subprocess timeout, wait(timeout=10)), and the comparison modules do no I/O --
; they read one JSON recording that the `build` module already produced.
; requirements-suite.txt says the same thing at more length.

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=15

; --strict-markers with an empty marker list is the point: this suite has no
; custom markers, and a typo'd one should be an error rather than a silently
; inert decorator.  In particular `srb_skip_ok` is NOT registered here.  It is
; the infra plugin's licence for a check that may legitimately find nothing to
; assert, and no check in this suite has that licence: a module parametrised over
; an axis it has no cases on collects empty, and an empty collection scores as a
; miss.  lib/battery.py's self_check enforces the correspondence between the
; axes a module has cases on and the batteries it imports, at image-build time,
; so the licence is never needed.  Leaving the marker unregistered means an
; attempt to reach for it fails loudly here instead of quietly costing score.

filterwarnings =
    default
