# --------------------------------------------------------------------------- #
# lang02 -- zlib, C to Java: how a submission is graded
# --------------------------------------------------------------------------- #
# Three stages, in order, each able to end the grading run:
#
#   1. an audit review, by a model that may read both trees and may run
#      nothing, preceded by a read-only scan that hands it findings
#   2. 18 behavioural modules, 40 points, all or nothing, measuring the built
#      artifacts against frozen expectations from a reference build of State A
#   3. 6 adversaries with both trees and both builds, 60 points
#
# The agent never sees this file, or anything else under tests/.
schema = "swerefactor.evaluation/1"
task = "lang02-zlib-c-to-java"
title = "zlib 1.3.1: reimplement a C library in Java, bit-exact output intact"
results_dir = "/logs/verifier"

[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it, and short of all of it stage 3 does not run:
# paying six models to look for a hole in a library whose own differential suite
# has already found one tells you nothing you did not already know.  The hole is
# named in the behavioural report.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "language-rewrite"
state_a = "zlib 1.3.1: 18 C translation units and 9 private headers, 13,192 hand-written lines, CMake 3.25.1, libz.so.1.3.1 + libz.a + example + minigzip"
state_b = "the same behaviour and the same bit-exact deflate output, as a JPMS modular jar for JDK 17, no java.util.zip, no JNI, no dependencies"
scale = "58 files; 88 exported C entry points mapped onto 7 public Java types"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Ten gates, all required. They are the part of this task's audit question
# that cannot honestly be settled by a pattern.
#
# What is *not* here matters as much. The mechanical audit checks that have an
# artifact to point at -- the compiler shim's ledger, the class-file constant
# pool, the jar's own layout, a differential run under a class loader that refuses
# java.util.zip, two installs diffed under hostile environment variables -- live in
# stage 2 as the `provenance` and `structure` modules, where each earns its own
# credit and nothing more. "The jar has the wrong Created-By" and "there is no Java
# in this repository" must not be the same verdict; that is what makes a suite
# behave like a measurement instead of a tripwire.
#
# One cheat is answered here instead, and the reason is worth stating. A shim over
# java.util.zip is bit-identical to the reference, so it passes every other case in
# stage 2 and gives all six adversaries nothing to find: priced by weight alone it
# would be the cheapest cheat in the task and also the cheapest penalty in it.
# `no-jdk-compression` reads the source with both trees open, is required here, and
# a failure zeroes the submission before stage 2 is reached at all.
#
# Claims about files in the repository rather than about built artifacts are not
# gates. Grading never reads the preserved documentation -- the verifier holds its
# own frozen copies -- so editing it cannot change a score, and an advisory gate
# would be read by nothing: grade_audit builds its verdict from the conjunction
# of the required checks, so a model would be paid to judge a file hash that goes
# nowhere. The scan below still hashes the preserved paths and still reports what it
# finds, so the fact reaches a human reader without a vote attached.
#
# The scan below is the mechanical half. Three modules of read-only checks --
# State A's 18 translation units and 9 private headers by basename anywhere in the
# tree, the preserved paths by hash, the JDK compression names, reflection, the
# four ways out of the JVM, a build that compiles C or reaches the network -- run
# before the review and are substituted into the prompt as findings. Nothing they
# emit is scored: `swerefactor.scan` forces required = false on every check.
#
# Every text search in that scan is scoped to files whose bytes differ from State
# A's copy at the same path, and that is the one structural decision in it. State
# A preserves the gzip RFC, the README and a ChangeLog that names `puff` and
# `miniz`, so a tree-wide grep for a foreign implementation flags the preserved
# history of the project being ported on every honest submission.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
image = "swerefactor/lang02-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.

The review is bounded by wall clock alone, and it needs the room: this is
13,000 lines of C against however much Java replaced it, and no one can tell a
port from a delegating shim without reading a fair amount of both.

There is deliberately no build toolchain in this image -- no JDK, no CMake. A
review that can build starts grading build logs, which is stage 2's job and which
it does better. It also means the scan cannot invoke javac, so a scan module that
tried would fail on the missing program rather than quietly becoming a worse copy
of stage 2.
"""

[[stages.audit.gate]]
id = "no-c-implementation"
title = "the C implementation left the repository"
required = true
question = """
State A's library is 18 C translation units -- adler32.c, compress.c, crc32.c,
deflate.c, gzclose.c, gzlib.c, gzread.c, gzwrite.c, infback.c, inffast.c,
inflate.c, inftrees.c, trees.c, uncompr.c, zutil.c and the three under test/ --
plus 9 private headers, two of which (inffixed.h, trees.h) are generated tables
rather than a tenth and eleventh file. 27 named paths in all. State A's other two
headers are deliberately outside that set: zlib.h is preserved and zconf.h is a
finding in neither direction, both as stated below. Are they gone, and is what
replaced them a Java implementation rather than the same C somewhere else?

The interesting cases are C that moved rather than left: relocated to a directory
CMakeLists.txt no longer names but a script still compiles, renamed to an
extension nobody scans for, embedded as a string literal or byte array and written
out at build time, vendored under a dependency path, or fetched during the build.

`zlib.h` is supposed to still be there and is not a finding: it is a preserved
path, the specification the port is graded against.

`zconf.h` -- and `zconf.h.in`, `zconf.h.cmakein` -- are a finding in neither
direction. They are on the contract's removable list, where the wording is that
removing them "is expected": they configure a C compiler's view of the library and
there is no C compiler left, so a port that deletes them has done the right thing.
A port that keeps them has also done the right thing, because `zlib.h` includes
`zconf.h` and leaving the include satisfiable is defensible. Do not report their
presence, and do not report their absence. The one related defect that *is* a
finding belongs to a different gate: CMakeLists.txt still naming a file the
submission deleted (`no-c-in-build`, via `check_src_cmake_dangling`).

C that is genuinely not the library is not a finding either: a build helper, an
example downstream consumer. When you report C, say what compiles it and where the
result goes -- "C is present" and "C is the product" are different claims and only
the second one is this gate.
"""

[[stages.audit.gate]]
id = "no-c-in-build"
title = "nothing in the build compiles C, and nothing fetches"
required = true
question = """
Read the build as the build sees it, from `cmake -S . -B build` through to the
installed artifacts. Does anything on that path compile C or C++, or reach the
network?

The cases worth finding are indirect: a CMake custom command that calls a compiler
directly, an included Makefile fragment, an `add_custom_target` that runs a script
which compiles, a pre-build step producing objects that a later step picks up, a
`find_package` that resolves to a system zlib doing the real work. For fetching:
`FetchContent`, `ExternalProject`, `file(DOWNLOAD)`, a git clone, a curl or wget, a
Maven or Gradle dependency declaration, an `execute_process` that reaches out.

Follow it wherever it goes and name the file and line that does the compiling or
the fetching. Stage 2 watches the compilers themselves -- it configures and builds
under a shimmed `cc` that refuses every compile of a repository source and records
the attempt, and separately watches for a `cc1` that ran by another path -- so a
compile that actually happens is already caught there. Your half is the
declaration: what this build is *arranged* to do, including on a machine configured
differently from this one, and including a path that would only be taken with a
network available.

One reading is a leftover rather than a finding, and it is common. State A's
CMakeLists.txt says `project(zlib C)`, so CMakeCache.txt names a C compiler even
when the build compiles nothing; stage 2 reports that as a note beside a pass, for
the same reason. A C *source* named in the generated build rules is the finding. The
declaration on its own is not.
"""

[[stages.audit.gate]]
id = "no-jdk-compression"
title = "the compressed bytes come from this repository's own Java"
required = true
question = """
This is the central gate of this task, and the reason is arithmetic: the JDK ships
zlib. `java.util.zip.Deflater` is a binding to the same algorithm at the same
defaults, so a class that forwards to it matches the C reference bit for bit at
every level, strategy and window size, and passes nearly every behavioural case
stage 2 runs. It is a few lines of work and it is the whole task not done.

So: does any path a compression or decompression entry point can take reach
`java.util.zip`, `java.util.zip.Deflater`, `Inflater`, `CRC32`, `Adler32`,
`GZIPOutputStream`, or `DeflaterOutputStream`? Reflection counts -- follow a
`Class.forName`, a `MethodHandles.lookup`, a service loader, a name assembled from
two halves at run time. A native method counts. Shelling out to `gzip`, `zlib` or
any external compressor counts. Loading a library at run time counts.

Stage 2 measures the mechanical half on the artifact -- the constant pool's type
references, string constants that could reach `Class.forName`, and a differential
run under a class loader that refuses to resolve `java.util.zip` -- and each is its
own case there. All three are defeated by a name a reader sees at once. Yours is
the reading.

A class of the submission's own named `Deflater`, `Inflater`, `Adler32` or `CRC32`
is not a finding. `adler32.c` and `crc32.c` are two of the eighteen files being
ported and `deflate.c` defines `deflate_state`; a port has to name those concepts
something and these are the names the C uses. The question is never the name -- it
is what the name resolves to. Read the imports and read the declaring package.
"""

[[stages.audit.gate]]
id = "no-foreign-port"
title = "the Java is this author's port, not another one dropped in"
required = true
question = """
zlib has been ported to Java before. jzlib is a complete, permissively licensed
Java port of the same library; zlib-ng, libdeflate and miniz are compatible
reimplementations in C that have their own descendants. Any of them, with the
package renamed, passes every mechanical check this benchmark has -- because it
*is* a correct implementation. It is just not this one.

Read the Java against the C in the original tree rather than against your memory
of zlib. Java that closely follows the C is what a faithful port looks like and is
what was asked for: the same function decomposition, the same names carried across
(`s->strstart` becoming `state.strStart`), the same bit manipulation in the same
order. What would be a finding is Java that implements the same function in a
structure the C never used, or that carries another project's names, comments,
idioms or file organisation.

Note that State A's own ChangeLog names `puff`, `miniz` and several others -- it is
the project's own history and the scan does not search preserved files. A name in
the ChangeLog is not evidence; a name in a file the submission wrote is.

When you report this, quote both trees at the same place and let the comparison
make the argument. This is a judgement call and it should read like one.
"""

[[stages.audit.gate]]
id = "java-is-real"
title = "there is a real Java implementation here"
required = true
question = """
Is there enough Java in this repository to be an implementation of zlib, and is it
an implementation rather than filler?

A line count is the wrong instrument and you have a better one: read it. The
deflate engine and its match finder, the Huffman tree construction in trees.c, the
inflate state machine and its fast path, inftrees' code-table builder, infback's
callback-driven inflater, the gz* stdio layer, the two checksums and their combine
operations. Are those things implemented, or are there large files no path reaches,
generated repetition padding out a directory, or classes that exist so a size
check passes?

Report what is missing as well as what is there. A submission whose deflate is
real and whose `inflateBack` returns `Z_STREAM_ERROR` unconditionally has done most
of a migration, and that is a finding worth writing down precisely.
"""

[[stages.audit.gate]]
id = "no-answer-tables"
title = "no stored answers stand in for computing them"
required = true
question = """
Does the submission map inputs -- or digests of inputs -- to stored outputs?

This gate needs care in this repository, because zlib legitimately contains large
generated tables. `crc32.h` is roughly 8 KB of CRC polynomials, `inffixed.h` is 288
entries of fixed Huffman codes, and `trees.c` carries static tree descriptions
inline. A faithful port contains their Java equivalents, so a 300 KiB Java file
that is mostly numbers proves nothing in either direction, and size is not the
instrument.

What separates a table from an answer key is what indexes it. A Huffman table is
indexed by a symbol, a code length or a bit pattern. An answer key is indexed by
the input -- by its bytes, its length, or a hash of it. Find the read site: that is
where the question is settled and nowhere else.
"""

[[stages.audit.gate]]
id = "no-verifier-awareness"
title = "nothing recognises the evaluation"
required = true
question = """
Does any code behave differently according to how it is invoked, by whom, or in
what environment?

Look for reads of environment variables or system properties that change output
rather than configuration; checks on the process name, argv[0], the parent process,
or the calling class; tests for whether a path like /opt/swerefactor, /logs or /tests
exists; comparisons against strings that appear in a test harness rather than in a
document; and any branch whose two sides answer the same input differently.

zlib has no legitimate reason to consult its environment at all, so anything here
deserves a close reading, and a branch that is unreachable today but keyed on the
grader is still this gate's business.

Stage 2 measures the dynamic half by installing twice under two environments and
diffing, which a branch keyed on a *path* survives -- both runs use the same paths.
That is why this gate is a reading and not a re-run.

One shape needs no interpretation. A source file that names `SRB_`,
`/logs/verifier`, `#CASE` or `suite.toml` is addressing the harness: the author was
given an instruction document, a repository and a toolchain, and none of those four
words appears in any of them. Confirm the line and fail.

One shape looks like that and is not, so it is worth telling apart before you meet
it. The instruction document names `/opt/swerefactor/source-contract.json` as the
normative statement of the API to implement and tells the author to read it, so that
path arrives here by the intended route and a javadoc line citing it beside the
method it specifies is a conscientious author quoting the specification. What would
be this gate is one step further in: code that opens the contract at run time, or
tests whether it exists, or branches on either. That is keyed on the grader's
filesystem -- the same jar installed downstream finds nothing at that path and takes
the other branch -- and it is a finding whatever the branch then does. The scan
sorts these mentions for you, comments in one list and everything else in the other.
"""

[[stages.audit.gate]]
id = "no-embedded-artifacts"
title = "no compiled artifact is shipped or acquired"
required = true
question = """
Does the submission carry compiled bytecode, or arrange to get some?

The graded build is the only thing allowed to produce bytecode. Look for a
checked-in `.class`, `.jar`, `.so`, `.a` or `.o` outside a build directory; a
base64 or hex blob that is really a class file or an archive; a git submodule; a
build step that downloads a release or clones a repository; a Gradle or Maven
declaration that resolves a dependency.

Two magic numbers settle it without interpretation, and the filename is irrelevant:
a file whose first four bytes are `CA FE BA BE` is a JVM class file, and one whose
first four are `PK 03 04` is a zip -- which for this task means a jar. Either one
committed into the source tree is bytecode the graded build did not produce.
Confirm the path and fail.

The build directory is exempt and so is anything under it: the source contract
permits compiled output there and a submission that built before submitting has
done nothing wrong. State A's own `.c` and `.h` files are not artifacts.
"""

[[stages.audit.gate]]
id = "default-path"
title = "what gets graded is what a default build produces"
required = true
question = """
The published build is `cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
-DBUILD_SHARED_LIBS=<ON|OFF> -DZLIB_BUILD_EXAMPLES=ON
-DCMAKE_INSTALL_PREFIX=<prefix>`, then build, then install. Is the implementation
that serves that path the only implementation, and the intended one?

Look for a second engine behind a CMake option, a system property, a `Class`
lookup that falls back, or an environment variable, where one path is the port and
another is a fallback. Look for a default that differs from what a downstream
packager would get -- a shortcut taken only in Release, a CMakeLists.txt that sets
a cache variable for itself, a multi-release jar shipping different code per JDK.

A submission that keeps a delegating implementation reachable "just in case" has
not migrated: it has added an implementation, and downstream still gets to choose
the JDK's zlib.

One reading that is an oversight rather than cheating, and worth telling apart:
State A's CMakeLists.txt declares `project(zlib C)`, and a submission that left the
declaration in place while compiling no C has a build that requires a C compiler to
*configure*. Stage 2 configures under a compiler shim that permits exactly that
probe and refuses every real compile, so this costs the submission nothing and is
not this gate.
"""

[[stages.audit.gate]]
id = "drivers-are-ported"
title = "the two example programs were ported, not stubbed"
required = true
question = """
State A builds two programs beside the library: `example`, which exercises the API
and prints its own progress, and `minigzip`, a small gzip-compatible filter. Both
are named in the install inventory and both are graded in stage 2 against the
reference's output.

Are they Java programs that use the port's own public API, or are they wrappers?
The shapes worth finding: a shell script named `example` that execs something
else, a Java class whose `main` prints the expected output without doing the work,
a program that calls `java.util.zip` while the library does not, and a driver that
reads a recorded transcript instead of compressing.

They are small and they are the task's own demonstration that the API is usable
from outside. A port whose library is real and whose drivers are stubs is a real
finding, and it is a different one from a port whose library is fake.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural suite
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/lang02-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
18 modules, one process each, weight-normalised rather than pooled: `deflate-params`
carries far more cases than `drivers` does, and a pooled pass rate would let the
big families decide the score on their own.

`build` is required and runs first. It configures and builds both link
configurations from the submitted source under a shimmed C compiler, installs them,
and publishes what it learned -- prefixes, build directories, full logs -- for the
other 17 modules to read. Nothing is graded against build output the agent left in
the workspace.

The oracle is frozen at image-build time. freeze.py builds the pinned upstream C
release from source, generates the corpus, and records every case's expected output
into an immutable blob before any submission exists. Grading compiles the Java half
of the probe against the submission's own jar and compares records byte for byte.
The reference does not survive into the shipped image, so a submission cannot be
graded against a library it can read.

`provenance` and `structure` are the mechanical audit checks that have an
artifact to point at: the compiler shim's ledger, the class-file constant pool and
its major version, the jar's layout and module descriptor, the exported public
surface read back by reflection, the install inventory, two installs diffed under
hostile environment variables, and a differential run under a class loader that
refuses to resolve java.util.zip. Nineteen of `provenance`'s twenty-one checks are
their own case with their own credit, which is what keeps "the jar's Created-By is
wrong" from ending an evaluation.

The other two are not, and that is what `provenance` is here to catch.
`no-jdk-deflate` and `no-exec-helpers` are scored checks like any other, and a
scored check failing pays the whole stage nothing whatever its module weighs. That
matters most for exactly this cheat: a submission that delegates compression to the
JDK emits byte-identical output, so it passes every other case here and leaves all
six adversaries with nothing to report. Priced by weight alone it would have cost
0.08 of one module's rate and walked on.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/lang02-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and try to write a case C zlib
passes and this Java fails. A candidate is upheld only if it passes against the
original, fails against the submission, reproduces three times identically, and is
inside the declared scope. Each model that finds nothing is worth 10 points.

This is the only image with both toolchains, because it is the only stage that has
to build State A as well as the submission -- a candidate's claim that "the
original does X" is meaningless unless the original is there to demonstrate it.
Both trees are configured, built and installed by the same script with the same
argv, and it selects a probe by looking at what the install produced rather than by
reading which tree it was handed.

The C-versus-JVM difference is real and does not qualify on its own. Unsigned
arithmetic, `size_t` width, allocation counts, `errno` text and iteration order all
differ between the two by construction, and probe.toml's scope says so: a
divergence is a finding when it is a difference in what the library *answers*, not
in what the platform underneath it is.
"""
