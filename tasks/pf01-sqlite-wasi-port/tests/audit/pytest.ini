; Shared by every scan module; passed explicitly with -c so a module's rootdir can
; be its own directory without losing these settings.
;
; No `timeout` plugin here, unlike a suite that waits on sockets: a scan opens files
; and hashes them, so the module timeout in scan.toml is the only clock that matters
; and a per-test one would be a dependency for nothing.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate
    ; `swerefactor.pytest_module` registers this one itself, and it is declared here
    ; too because `--strict-markers` is on and the image's build-time collect check
    ; runs these modules *without* that plugin.  Without this line the check would
    ; fail on an unknown marker, which is a build failure for the right reason
    ; reported in a way that would take an hour to read.
    srb_skip_ok: a skip of this check is neutral rather than a miss

filterwarnings =
    default
