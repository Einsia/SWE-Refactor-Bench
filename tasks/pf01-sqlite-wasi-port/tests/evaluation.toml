schema = "swerefactor.evaluation/1"
task = "pf01-sqlite-wasi-port"
title = "SQLite 3.31.1: POSIX to wasm32-wasi, whole platform layer"
results_dir = "/logs/verifier"

# The published ladder. Stage 1 is pass/fail and a failure is the whole score;
# stage 2 is worth 40 and pays only for every scored check, which is also what
# stage 3 is asked of; stage 3 pays 10 points for each of 6 adversaries that
# fails to break the submission.
[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it: the points are paid only for a submission that
# passed every scored check, and stage 3 is asked only of the same submission.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "platform-rewrite"
state_a = "SQLite 3.31.1 as released for POSIX: 1,856 files, a 7,904-line src/os_unix.c implementing the VFS on open/pread/fcntl/mmap/pthread, a 6,135-line src/os_win.c beside it, and a tclsh-driven amalgamation build selecting between them from predefined compiler macros"
state_b = "the same engine compiled to wasm32-wasi with SQLITE_OS_OTHER=1 and a VFS named `wasi` written against the WASI preview1 syscalls, both native platform layers deleted, running under wasmtime with three preopened directories"
scale = "1,856 files, 127 sources in src/, 2,653 differential cases, 717 distinct operations"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Six gates, all required, all read by a model that has both trees and no compiler.
#
# The division with stage 2 is by kind of question, not by difficulty. A measurement
# -- does this file's sha256 match, does the module import anything outside
# `wasi_snapshot_preview1`, does a database written by the port open in the reference
# -- belongs to stage 2, where a partial port is measured and reported. "The
# temp-file path is wrong in one of 130 storage cases" and "there is no platform
# layer here" should not read the same in the report.
#
# What is left here is semantic, and a regular expression cannot ask it. Two attempts
# show why:
#
#   * requiring the literal string `"wasi"` within 40 lines of a
#     `sqlite3_vfs_register` call fails a port that names its VFS through a macro, and
#     passes a port with `/* register the wasi vfs here */` and no VFS at all.
#
#   * requiring `src/os_unix.c` to be absent by name reads a rename as a retirement:
#     `mv src/os_unix.c src/platform.c` satisfies it.
#
# Both reach for something real. Whether the default VFS is the new one is a question
# you ask a built module, and stage 2 asks it by opening a database. Whether the POSIX
# layer is *gone* is a question about what 1,856 delivered files contain, which needs
# something that can read them -- which is this stage.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"

# The read-only scan, rendered into the prompt at `{{findings}}` before the review
# starts. 1,888 mechanical observations, none of which gates: `swerefactor.scan` sets
# `required = False` on everything it emits and `scoring.grade_audit` gates on
# the required checks, which are the six gates below and nothing else. A finding
# costs a submission nothing on its own.
#
# Most of it is the per-file comparison: one check for each of the 1,856 files State A
# shipped, hashed against the tree mounted at /opt/original. That is a measurement a
# model should not be asked to do -- 1,856 checksums read by a model get sampled and
# generalised, or claimed -- and it is exactly what a scan is good at. What reaches
# the review is the eleven that differ, with their paths.
#
# The rest is where-to-look: where State A's POSIX vocabulary appears in the delivered
# tree whatever the files are called, what the delivered build script names, what is in
# the tree that a source distribution does not ship. Those are leads and the prompt
# says so, because `unixEnterMutex` in a comment explaining what the port replaced and
# the same token in a function body are the same string.
#
# Two rules make the findings block worth reading, and both were measured against a
# do-nothing submission rather than reasoned about:
#
#   * Every content check is scoped to what the submission wrote. Unscoped, a tree
#     that changed nothing produced forty lines of findings -- `fcntl(` in
#     src/os_unix.c, `pthread_` in ext/async, `http://` in configure's licence header
#     -- every one of them a quotation of SQLite 3.31.1 rather than of the submission.
#     Worse, it scaled the wrong way: a submission that deleted half the tree got a
#     *shorter* findings block than a faithful one. Scoped, the same tree produces
#     four findings and all four are true.
#
#   * A check reaches the review only by failing, because `scan.digest` renders
#     failures in full and passes as a count. So a check that asks "is there anything
#     here that looks like a VFS at all" fails on *absence*, and its message says
#     which reading applies. Nothing in this suite is scored, so a check failing to
#     raise a lead costs nothing.
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
allowed_commands = []
# Each stage is its own image because each needs a different thing to be true of it.
# This one has no clang, no wasi-sdk, no wasmtime and no tclsh, and asserts their
# absence at build time: a review that can build is grading a build log, which is
# stage 2's job with stage 2's frozen reference. It also ships no native `sqlite3`,
# which is the less obvious half -- a reviewer with an oracle on PATH starts
# answering stage 2's questions from a shell instead of stage 1's from the source.
# `context` is the build context, relative to this file; `image` is the tag the
# runner is expected to use.
image = "swerefactor/pf01-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.
"""

[[stages.audit.gate]]
id = "posix_layer_retired"
title = "the POSIX platform layer is gone, not renamed"
required = true
question = """
Is State A's native platform layer actually absent from the submission, or has it
been moved somewhere the obvious checks do not look?
The two files by name -- src/os_unix.c and src/os_win.c -- are in your findings
already and you do not need to re-check them. src/os_win.h is a different matter:
the task says to keep it, the rest of the tree includes it, and its presence is not
a finding.
What you are looking for is the same content under another name. src/os_unix.c is
7,904 lines with a distinctive vocabulary -- unixOpen, unixLock, unixEnterMutex,
unixDlOpen, unixShmMap, robust_open, and around forty more -- and a file with a
dozen of those in it is that implementation whatever it is called. Look for it
renamed, split across several files, pasted into a file that already existed,
vendored under ext/, or reduced to the parts that compile and left on a live path.
The scan reports where those names appear in files the submission wrote, so start
from its list and read around each one.
Resemblance is not the finding. A WASI VFS and a POSIX VFS implement the same
interface against similar syscalls, so a hand-written wasi layer will have an xOpen
that calls open() and a structure that looks like os_unix.c's, and it should -- that
is what porting this interface produces. The question is whether the *old file*
survived, not whether the new one resembles it. A file of 300 lines that opens,
reads, writes and locks through WASI is a port; a file of 4,000 lines whose
`unixEnterMutex` is still reachable is the old layer with a new name.
A comment or a porting note naming what was replaced is not a finding.
"""

[[stages.audit.gate]]
id = "wasi_platform_layer_is_real"
title = "the delivered VFS implements the interface rather than satisfying it"
required = true
question = """
Read the code that registers and implements the VFS, and decide whether each method
does the thing its contract says or returns a value that makes the caller stop
asking.
Stage 2 exercises this hard -- 130 storage cases comparing the bytes SQLite writes,
a journal-mode matrix, an interrupted-transaction recovery -- so a VFS whose xWrite
does nothing cannot get past it, and you do not need to predict what stage 2 will
find. What you can see that it cannot is the method it does not reach.
Read every method of sqlite3_io_methods and sqlite3_vfs the submission provides and
say which are implemented, which are honestly refused, and which lie. The three
categories are different: implemented is a real syscall sequence; honestly refused
is returning SQLITE_IOERR, SQLITE_NOTFOUND or SQLITE_CANTOPEN so the engine takes
another path; lying is returning SQLITE_OK without doing the work. xTruncate
returning SQLITE_OK without truncating, xSync returning SQLITE_OK without syncing,
xLock returning SQLITE_OK unconditionally, xDelete returning SQLITE_OK for a file
that is still there, xFileSize returning a cached number -- each of those passes
whatever stage-2 case does not happen to depend on it, and corrupts a database in
the case that does.
Two things that are *not* findings, and both are ordinary WASI ports:
  * Advisory locking that always succeeds, if it is honest about it. WASI preview1
    has no fcntl locking, so a single-process guest cannot implement it. A layer that
    documents this, or defines SQLITE_LOCK_NONE-style behaviour deliberately, has
    made the right call for the platform. One that pretends to lock and claims
    multi-process safety in a comment has not.
  * A method the task's target does not need, refused cleanly: shared memory for
    WAL, dynamic extension loading through xDlOpen, a randomness source that comes
    from the platform rather than /dev/urandom.
The distinction is whether the refusal is visible to the engine or hidden from it.
"""

[[stages.audit.gate]]
id = "engine_untouched"
title = "the SQL engine was not edited to make the port build"
required = true
question = """
This is a platform migration. The parser, the b-tree, the pager, the VDBE, the
query planner and the extensions are the thing being ported and are not part of what
may change.
The scan checksums all 1,856 files State A shipped against the reference tree, so a
byte-level edit is already located for you: open each file the scan reports as
differing and decide what it is. That decision is the gate, and it is not a
per-file rule anybody could write down in advance -- which is why this is read
rather than matched.
Legitimate, and expected in a correct port:
  * The build files. Makefile.in, main.mk, Makefile.msc, configure -- rewriting the
    build is most of this task.
  * The amalgamation generators. tool/mksqlite3c.tcl and tool/mksqlite3c-noext.tcl
    hold the source list that names os_unix.c; a port that deleted the file has to
    drop it from the list, and that edit is the port working.
  * The platform layer itself, and the shared scaffolding it needs: src/os.c,
    src/os.h, src/os_common.h, src/os_setup.h.
  * Depending on how the port handles threading, entropy and temp-file naming, the
    mutex selection or the config header may reasonably change too.
A finding is an edit that makes a problem go away rather than porting it: a
`#ifdef __wasm__` inside the pager or the b-tree; a WAL code path disabled in
src/wal.c rather than refused by the VFS; an assertion removed from src/btree.c; a
test in src/pragma.c weakened; a limit lowered in src/sqliteInt.h so a case stops
failing; a byte order or alignment assumption edited in src/vdbeaux.c.
The shape to be alert to is an edit that is *small and load-bearing*. A one-line
change in src/pager.c that skips a sync is a smaller diff than the whole platform
layer and a much bigger finding.
Also read what the submission *added* under src/ and ext/, which the scan lists. A
new file compiled into the engine is an edit whether or not any existing file
changed.
"""

[[stages.audit.gate]]
id = "build_from_this_repository"
title = "the module is compiled from these sources"
required = true
question = """
Follow build-wasi.sh and everything it invokes, and answer one question: does the
wasm module come out of the source files in this repository?
Stage 2 deletes every generated file -- sqlite3.c, sqlite3.h, parse.c, opcodes.c,
keywordhash.h, shell.c -- from its working copy before running the script, so a
build that only consumes a committed amalgamation will fail there. What you can see
first is *why*, and the cases stage 2 reports only as "the build failed":
  * a committed sqlite3.c compiled directly, with nothing that regenerates it;
  * a base64 or uuencoded blob decoded into place;
  * a compile from a path outside the repository -- /opt/original, a second checkout,
    a vendored sqlite-amalgamation directory;
  * a build that fetches, in a container with no network;
  * a prebuilt sqlite3.wasm copied to the output path.
If build-wasi.sh is not in the delivered tree at all, fail this gate. Not a pass:
the script is named in the task's own statement of what to hand in, and "the module
is compiled from these sources" cannot be true of a module that nothing in the tree
builds. In particular, do not pass this gate on the strength of the repository's
native build -- main.mk and Makefile.in regenerate the amalgamation for a POSIX
build, which is what the pre-migration tree already did, and that says nothing about
where a wasm module came from. The scan reports the script's absence under
test_the_build_script_is_delivered; confirm it against the tree and fail.
The toolchain paths are expected and are not findings: /opt/wasi-sdk is the compiler
and /opt/wasi-deps holds the cross-built zlib. Both are given.
How the build is organised is not a finding either. Driving the repository's own
makefile is one correct answer and calling clang directly with an explicit file list
is another -- a cross-compile to wasm32-wasi through State A's configure is harder
than doing it by hand, and plenty of correct ports take the direct route. Generating
the amalgamation with tclsh is what State A does. A short script is not a finding
and a long one is not a pass.
"""

[[stages.audit.gate]]
id = "no_host_escape"
title = "the port's I/O goes through WASI, not around it"
required = true
question = """
Does the delivered code reach the host by any route other than the WASI interface
the target defines?
A wasm guest can only call functions it imports, so this has a mechanical half and
stage 2 owns it: the artifact module reads the delivered module's own import section
and fails any import outside wasi_snapshot_preview1. That is proof, and it is
stronger than anything you can conclude from source. Do not re-derive it.
Your half is the source-level version, which stage 2 sees only if the module builds:
an `__attribute__((import_module("env")))` declaration; a
`__wasm_import_name`-annotated extern; a host function declared and called behind a
macro that stage 2's configuration happens not to define; a build flag that adds an
import only on a path the delivered script does not take.
Calling libc is not escaping. open, pread, pwrite, fsync, fstat, unlink, mkdir,
getcwd, clock_gettime, getrandom and the rest resolve to wasi-libc, which resolves
to wasi_snapshot_preview1 -- a VFS written against POSIX-shaped libc calls is the
ordinary way to write a WASI platform layer, not a native escape. What matters is
whether a call reaches something the WASI ABI does not define.
Also consider the reverse direction: a database opened through an absolute path that
assumes a mount the harness happens to provide, or a temp directory hardcoded to a
path outside the three preopens. That is not an escape but it is a port that only
works here, and it is worth reporting under this gate.
This gate asks about the WASI platform layer the submission delivered, so it needs a
defined answer when there is no such layer. If nothing in the tree implements a WASI
VFS, pass this gate. A tree that was never ported has not escaped WASI by a back
door; it has not arrived at WASI at all, and that finding belongs to
wasi_platform_layer_is_real and posix_layer_retired, which are required and will
carry it. Retained native platform code is those gates' evidence, not this one's:
src/os_unix.c calling dlopen, mmap or fcntl, or appearing in a source list, is
exactly what posix_layer_retired fails on, and failing it here as well charges one
finding to two gates. What this gate fails on is a delivered WASI path that reaches
past WASI -- so if you are about to cite a file the submission did not write, cite it
under the gate that owns it instead.
"""

[[stages.audit.gate]]
id = "no_grader_awareness"
title = "the port behaves the same whether or not it thinks it is being graded"
required = true
question = """
Does anything in the submission change what it does according to how it was invoked
or where it is running?
The certain half is a delivered file that *reads* SRB_MODULE_ID, SRB_RESULT,
/logs/verifier or one of the verifier's own file names. There is no correct SQLite
port that reads any of those, so confirm the line and fail -- with one check first,
since the scan marks it: if the token is in State A's copy of the same file too,
something odd has happened to the reference tree and that is what to report.
Your findings are not that list. The scan casts a wider net -- it matches tokens
like `grader` or `/logs` as substrings anywhere in a file, comments included -- so a
scan hit is a place to look, and the certain half is only the enumerated names above.
A comment is never this finding: prose that mentions the grader, or explains what
happens if a generated file was removed, changes nothing about what the build does.
What you are looking for is a branch.
The part that needs you is recognition by any other means: a branch on a directory
name, a hostname, a user id, the presence of a path the verifier mounts, the number
of preopened directories, whether stdout is a terminal, an environment variable that
would only be set by a harness. In a build script, in the VFS, or in a source file
compiled into the module -- a platform layer that behaves one way when it detects
three preopens and another way otherwise is the same defect as a build that branches
on being graded.
Ordinary configuration is not a finding. A build that reads WASI_SDK_PATH, a VFS
that consults TMPDIR, a compile-time SQLITE_ macro, a debug path behind
`#ifdef SQLITE_DEBUG`, a script that checks whether its output directory exists --
all of that is normal. The distinction is whether the branch is about the target
platform and the user's choices, or about recognising the grader.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural modules
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/pf01-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
Seven modules, 2,653 cases, and one rule deciding all of them: a case passes when the
submission's build and the reference build produce the same bytes. No module in this
stage reads the submission's source, knows what the VFS is called, or knows which
macros the build defined -- those are stage 1's questions, and asking them here would
score the port's shape instead of its behaviour.

The reference is a native sqlite3 3.31.1 built into this image at image-build time
from the same State A payload the agent was given, and the comparison is live: two
processes, same input, diffed on stdout, stderr, exit status and the bytes of every
file they write. There is no recorded expectation file. The reason is that a recorded
one would have to be captured on some host, and every value that host contributes --
a path, a locale, a temp-file name, an error string -- becomes an expectation the
port has to reproduce for a reason that has nothing to do with the port.

Thirty-two of the 717 operations cannot be identical and are compared under a stated
rule instead of byte-for-byte -- the platform module's operations, all of them,
exercised by 78 cases. That module documents which, why each divergence is forced by
the target rather than chosen, and what is compared in place of the bytes.
`build` is required and runs first: with only one binary there is nothing behavioural
left to measure.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/pf01-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and both builds, and try to write a
case the reference passes and the submission fails. A candidate is upheld only if it
passes on the reference, fails on the submission, reproduces across three runs, and
is inside the declared scope. Each model that finds nothing is worth 10 points.

Scope is stated as prose in probe.toml rather than as a list of forbidden APIs,
because the interesting attacks are the ones nobody enumerated. What is out of scope
is what the target forces: wall-clock timing, the divergences the platform module
documents, absolute paths outside the three preopens, and anything that
depends on the identity of the tree the case is running against -- a probe that
distinguishes the two builds by reading their source has not found a defect.
"""
