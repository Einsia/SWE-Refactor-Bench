# =============================================================================
# SWERefactorBench -- platform rewrite
#
#   State A : SQLite 3.31.1 as released for POSIX.  1,856 files; the VFS is a
#             7,904-line src/os_unix.c built on open/pread/fcntl advisory locks,
#             mmap, dlopen and pthreads, with a 6,135-line src/os_win.c beside it
#             and a 45-slot syscall table in front of both; the amalgamation is
#             assembled by tclsh from a source list that appears in five build
#             files in three notations.
#   State B : the same engine compiled to wasm32-wasi under SQLITE_OS_OTHER=1,
#             with a VFS written against WASI preview1, both native platform
#             layers gone from the build closure, running under wasmtime with
#             three preopened directories.
#
# The agent edits /workspace/repo in place.  Harbor collects that directory as an
# artifact, destroys the agent container, and re-materialises the repository
# inside independent verifier containers that the agent never touches and whose
# tests/ tree the agent never sees.
#
# Nothing the agent built is carried over.  The artifact exclusions drop every
# build product, including sqlite3.c and sqlite3.wasm, so each stage that needs a
# module runs the submission's own ./build-wasi.sh from clean.  Generating the
# amalgamation is where the source-list edits are exercised, which is why a
# prebuilt one is worth nothing here: "os_unix.c is out of the build" has to be a
# fact about the tree, not about a file somebody left in it.
#
# Grading is the benchmark's three-stage ladder, declared in tests/evaluation.toml
# and applied by score.py:
#
#   1. an audit review, done by a model reading State A against the
#      submission, six gates, all required.  Failing one is a zero and nothing
#      after it runs.
#   2. behavioural modules, 40 points, measured against a native 3.31.1 built in
#      the same image from the same source and paid only for a submission that
#      passed every scored check in every module.  Short of that the ladder
#      stops here with nothing from this stage.
#   3. six adversaries with an hour each to write a case the native build
#      answers one way and the port another.  60 points, 10 for every adversary
#      that finds nothing.
#
# What each stage may know is as deliberate as what it measures.  Stage 1 has no
# clang, no wasi-sdk, no wasmtime, no tclsh and no sqlite3 -- it can read the two
# trees and nothing else, because the question it asks ("is there a platform layer
# here, or a POSIX one wearing a new filename") is not one a build log answers,
# and a reviewer that can build starts grading the build.  Stage 2 has the cross
# toolchain and a frozen native reference, and compares two binaries rather than
# reading either tree.  Stage 3 is the only image holding both toolchains, because
# "3.31.1 answers this differently" is a claim that has to be executed on both
# sides at grading time.
# =============================================================================

schema_version = "1.4"

# ---------------------------------------------------------------------------
# Collected from the agent container, re-materialised at the same absolute path
# inside the separate verifier container.
#
# The exclusions drop build and configure output only.  Two of them carry the
# task:
#
#   * `sqlite3.c` / `sqlite3-shell.c` / `shell.c` -- the amalgamation.  It is
#     generated by tclsh from the source list in Makefile.in, main.mk,
#     Makefile.msc, mksqlite3c.tcl and mksqlite3c-noext.tcl, so regenerating it is
#     the only thing that proves those five files agree.  Shipping one would let a
#     tree whose build files still name os_unix.c present an amalgamation that
#     does not.
#   * `*.wasm` -- the module itself.  Every stage builds its own from source with
#     the published argv.
#
# `Makefile` is excluded and `configure` is not: State A ships Makefile.in,
# Makefile.msc, Makefile.linux-gcc, autoconf/Makefile.am, main.mk and configure,
# but no bare `Makefile`, so excluding that name can only ever drop configure
# output.  Excluding `configure` would delete a delivered file.
#
# Solutions must therefore live in tracked source files, never inside these
# paths, a rule instruction.md states outright.
# ---------------------------------------------------------------------------
[[artifacts]]
source = "/workspace/repo"
exclude = [
    # configure and make output
    "Makefile",
    "config.h",
    "config.log",
    "config.status",
    "libtool",
    "sqlite3.pc",
    ".target_source",
    "tsrc",
    # the amalgamation and the tclsh-generated sources beside it, regenerated by
    # every stage that needs them.  These names are checked against the 1,856-file
    # State A inventory: none of them is a delivered file at any depth, which is
    # why `sqlite3ext.h` and `fts5.h` are absent from this list -- src/sqlite3ext.h
    # and ext/fts5/fts5.h are shipped, and an exclude matches a path component, so
    # naming either would delete source.
    "sqlite3.c",
    "sqlite3.h",
    "sqlite3-shell.c",
    "shell.c",
    "keywordhash.h",
    "opcodes.c",
    "opcodes.h",
    "parse.c",
    "parse.h",
    "parse.out",
    "fts5.c",
    # compiled output, native and wasm
    "*.o",
    "*.lo",
    "*.a",
    "*.la",
    "*.so",
    "*.so.*",
    "*.dylib",
    "*.wasm",
    "*.wat",
    ".libs",
    "sqlite3",
    "sqlite3.exe",
    "lemon",
    "mkkeywordhash",
    "mksourceid",
    # build directories and scratch
    "build",
    "_build",
    "bld",
    "out",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    # editor and interpreter debris
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "*.orig",
    "*.rej",
    "*~",
]

[task]
name = "swerefactor/pf01-sqlite-wasi-port"
description = "Port SQLite 3.31.1 from Linux/POSIX to wasm32-wasi: replace the 7,904-line os_unix.c VFS with one written against WASI preview1 under SQLITE_OS_OTHER=1, retire both native platform layers from the build closure across five source lists in three notations, and preserve the engine's behaviour under wasmtime."
authors = []
keywords = [
    "swe-refactor",
    "platform-migration",
    "c",
    "webassembly",
    "wasi",
    "sqlite",
    "vfs",
    "cross-compilation",
    "offline",
]

[metadata]
category = "platform-rewrite"
difficulty = "frontier"
# SQLite is public domain, but "public-domain" is not an SPDX identifier.  SPDX
# has one for exactly this text -- `blessing`, after the blessing SQLite prints in
# place of a legal notice, which is what repo/LICENSE.md carries.
license = "blessing"
upstream = "https://sqlite.org/"
upstream_version = "3.31.1"
upstream_release_date = "2020-01-27"
source_repository = "https://www.sqlite.org/src/"
source_version = "3.31.1"
state_a = "SQLite 3.31.1 as released for POSIX: 1,856 files, a 7,904-line src/os_unix.c implementing the VFS on open/pread/fcntl/mmap/pthread, a 6,135-line src/os_win.c beside it, and a tclsh-driven amalgamation build selecting between them from predefined compiler macros"
state_b = "the same engine compiled to wasm32-wasi with SQLITE_OS_OTHER=1 and a VFS named `wasi` written against the WASI preview1 syscalls, both native platform layers deleted, running under wasmtime with three preopened directories"
scale = "1,856 files, 127 sources in src/, a 45-slot syscall table, 5 build files carrying the source list in 3 notations"
from_platform = "linux/posix -- os_unix.c, open/pread/fcntl advisory locks, mmap, dlopen, pthreads, popen/system, gcc"
to_platform = "wasm32-wasi -- SQLITE_OS_OTHER=1 VFS over preopened directories, no locking syscalls, no mmap, no dlopen, no threads, no process spawn, wasi-sdk clang"
tags = [
    "whole-repository",
    "platform-rewrite",
    "vfs-implementation",
    "cross-compilation",
    "differential-testing",
    "offline",
    "anti-cheat-gated",
]

# ---------------------------------------------------------------------------
# Agent phase
#
# 10h wall clock: a 45-slot syscall table to replace with WASI preview1
# equivalents, five locking states to implement without any locking syscall, an
# mmap path and a dlopen path to remove rather than emulate, a source list that
# has to stop naming two files in five places and three notations, and a build
# entry point to write that regenerates the amalgamation with tclsh and links a
# module wasmtime will run.  State A stays in the image with a native reference
# build beside it, so the time goes on the port rather than on discovering what
# the POSIX layer did.
#
# no-network: the cross toolchain, the runtime, a cross-built zlib and the native
# reference are all on disk when the agent starts, so offline costs it nothing and
# removes "downloaded somebody else's WASI VFS" as a possibility.
# ---------------------------------------------------------------------------
[agent]
harness = "codex-cli 0.146.0"
timeout_sec = 36000.0
network_mode = "no-network"
user = "root"

[environment]
network_mode = "no-network"
# Unpacks State A, installs wasi-sdk and wasmtime, cross-builds zlib, asserts the
# premise, and builds the native reference from the same source.
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/workspace/repo"

[environment.env]
WASI_SDK_PATH = "/opt/wasi-sdk"
WASI_DEPS = "/opt/wasi-deps"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"

# ---------------------------------------------------------------------------
# Verifier phase
#
# environment_mode = "separate" + [verifier.environment] means tests/ becomes the
# build context of the verifier image and Harbor does not upload it to the agent
# container.  That is what keeps the suite invisible.
#
# The timeout covers the whole ladder, whose own budgets in tests/evaluation.toml
# are 5400 + 10800 + 54000 = 70200s.  The margin above that is for building three
# images and for the ladder's own overhead, and it is a ceiling rather than an
# expectation: most submissions never reach stage 3, because stage 1 zeroed them
# or stage 2 came in short of full marks.  Stage 2's own budget is generous because it
# builds twice from clean -- the submission for wasm32-wasi and the reference
# natively -- and each build regenerates the amalgamation with tclsh first.
#
# Stage 3's budget is deliberately not 6 * 3600: an adversary that concludes
# early returns early, and the hour is a limit on one round rather than a quota to
# be spent.
# ---------------------------------------------------------------------------
[verifier]
timeout_sec = 75600.0
environment_mode = "separate"
user = "root"

[verifier.environment]
network_mode = "no-network"
# The behavioural image installs both toolchains and builds the native reference
# before any submission arrives, so its build is slower than the agent
# environment's.  Stage 3's image does the same and adds a second reference.
build_timeout_sec = 7200.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
WASI_SDK_PATH = "/opt/wasi-sdk"
WASI_DEPS = "/opt/wasi-deps"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
# Where the shared grader lives inside every stage image, and where the three
# stages agree to leave their result files.  score.py reads the second from
# evaluation.toml, so this only has to hold for a stage invoked by hand.
SRB_INFRA = "/opt/swerefactor"
SRB_RESULTS = "/logs/verifier"

# There is deliberately no solution/ tree and no [solution.env].  A reference
# implementation in the task directory is a thing that has to be kept correct
# against every future change to the suite, and its only consumer would be a smoke
# test that the suite can be passed at all.  The suite's own gate answers that:
# stage 3 is asked only of a submission that scored stage 2 in full, so a tree
# that reaches it has already passed every recorded check.  What six models add is
# the other half -- an hour each spent hunting for a behaviour nobody thought to
# record.
#
# The agent is not left without an oracle -- it has State A and a native build of
# it in the image, and may diff against them as much as it likes.  What it does
# not have is an answer key.
