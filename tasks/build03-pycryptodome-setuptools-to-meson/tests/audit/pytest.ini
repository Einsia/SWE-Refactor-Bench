[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = --strict-markers --tb=short -p no:cacheprovider -q --no-header -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate

# Warnings stay visible.  A DeprecationWarning out of a scan module is usually the
# module reading something it should not, and silencing them here would hide it.
filterwarnings = default

# Deliberately no timeout plugin.  Every module already runs under the per-module
# timeout in scan.toml, which the harness enforces by killing the process; a second
# timeout inside pytest would turn a hung walk into a *reported failure* attributed
# to whichever check happened to be running, which reads as a finding about the
# submission rather than a fault in the suite.
