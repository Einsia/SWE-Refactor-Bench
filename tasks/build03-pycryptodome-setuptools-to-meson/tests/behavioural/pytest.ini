[pytest]
# One config for all eleven pytest modules, passed explicitly with `-c` so pytest
# never walks up from $SRB_REPO looking for one. The submission ships its own
# pyproject.toml, and a `[tool.pytest.ini_options]` table in it would otherwise
# configure the harness grading it.
#
# rootdir follows from this file's location; testpaths is deliberately unset,
# because run-pytest.sh always names $SRB_MODULE_DIR and collecting anything else
# would mean collecting the submission's tests.
addopts = -q -ra --strict-markers --strict-config -p no:cacheprovider
console_output_style = count
norecursedirs = .git __pycache__ build dist
xfail_strict = true
filterwarnings =
    default
    # meson-python and packaging both emit these while parsing perfectly valid
    # metadata; a warning is not a finding and should not colour the log.
    ignore::DeprecationWarning:packaging.*

markers =
    behaviour: State A's build results have to survive the migration
    migration: the new build system really replaced the old one
    slow: minutes rather than seconds, but still part of the grade
    # infra/swerefactor/pytest_module.py registers these four as well, and
    # run-pytest.sh always loads it. Declared here too so that `--collect-only`
    # without the plugin -- what the Dockerfile's self-check and `swerefactor
    # validate` do -- is not rejected by --strict-markers.
    srb_weight(value): this check's weight within its module (default 1.0)
    srb_skip_ok: a skip of this check is neutral rather than a miss
    srb_group(name): a sub-group label carried into the report's metadata

# Every check must say what failed and why in its own message, because the report
# a submission gets back is the assertion text and nothing else.
log_cli = false
