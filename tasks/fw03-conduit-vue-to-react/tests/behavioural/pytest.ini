; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be lib/tests without losing these settings.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Every test in this stage is a comparison between two dictionaries that were
; loaded before collection started -- no test here opens a socket, starts a
; browser or waits on anything. 60s is therefore generous by two orders of
; magnitude, and exists only so a pathological parametrize expansion cannot
; consume the module's whole budget in one test.
timeout = 60
timeout_method = thread

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=10

markers =
    srb_weight: 0 to report a check without scoring it; positive scores
    srb_skip_ok: a skip here is a legitimate result, not a silent pass
    srb_group: which scenario group this check belongs to

filterwarnings =
    default
