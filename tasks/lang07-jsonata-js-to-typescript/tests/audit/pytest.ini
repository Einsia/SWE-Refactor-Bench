; Shared by every scan module; passed explicitly with -c so a module's rootdir
; can be its own directory without losing these settings.
;
; No `timeout` plugin here: a scan reads files and cannot wait on a socket, so the
; module timeout in scan.toml is the only clock that matters and a per-test one
; would be a dependency for nothing.  Stage 2 of this task needs no pytest at all
; -- its driver is plain Python on the image's own interpreter -- so this is the
; only pytest configuration in the task and it has nothing to reconcile with.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate

filterwarnings =
    default
