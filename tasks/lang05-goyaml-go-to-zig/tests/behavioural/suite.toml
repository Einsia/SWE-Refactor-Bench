schema = "swerefactor.behavioural-suite/1"
task = "lang05-goyaml-go-to-zig"

# Stage 2: build both implementations and compare what they do.
#
# Twenty-two modules over one question -- given the same YAML, does the Zig
# rewrite answer what go-yaml v3.0.1 answers?  Every case is a probe request on
# stdin and a response on stdout, so nothing here reads the submission's source.
# That is the boundary between this stage and the other two: stage 1 has both
# trees and may not run anything, stage 3 has both trees and both builds, and this
# stage has two executables and no opinion about how either was written.  A module
# here that asserted a file existed or a function was named something would be
# grading the port's style, and a rewrite is free to have its own.
#
# `weight` is a share of the stage's rate, normalised by the runner.  The numbers
# are not case counts and are deliberately not proportional to them: they are the
# per-family budgets in lib/catalog.py, and `catalog.check_modules()` fails the
# image build if any module's weight stops equalling the budgets it grades.  So
# they are readable here without executing anything, and they cannot drift from
# the table that composes them.
#
# What the shares say, in one line each: `unseen-inputs` is the largest because a
# submission that memorised the frozen answers has to fail it; `upstream-tests` is
# next because every input in it is a behaviour go-yaml's own authors pinned; the
# scalar and collection styles are split rather than pooled because they fail
# independently and a single `scalars: 240/280` hides which one broke; `build` is
# small because a tree that does not compile already scores near nothing across every
# module that needed the artefact, so this weight only has to cover what the build
# module itself observes about it.
#
# Every module's run.sh is a symlink to lib/run-module.sh, which reads
# $SRB_MODULE_ID and asks lib/driver.py for that slice.  One script rather than
# twenty-two copies: the modules differ in which cases they own, not in how they
# run.  A module needing its own logic replaces its symlink with a real script and
# nothing else changes.

default_timeout_sec = 1800
lib_dir = "lib"

[env]
SWEREFACTOR_ASSETS = "/opt/assets"

[metadata]
runtime = "zig 0.14.1"
reference_version = "go-yaml v3.0.1"
reference = "a static CGO_ENABLED=0 build of the pinned release, frozen into the image"
# Floors, not counts.  The cases are generated by the reference toolchain during
# the image build, so the true totals are a property of the image rather than of
# this file; writing them here would be transcribing a number I cannot check from
# the source tree.  These are what lib/catalog.py asserts about the manifest that
# actually shipped, and the build fails if the generator produces fewer.
min_frozen_cases = 8000
min_fresh_cases = 1500
min_document_cases = 60
min_protocol_cases = 10
# At least a tenth of the graded total is generated after the submission exists.
# Asserted in freeze.py against the shipped manifest, not described.
min_fresh_share = 0.10

# --------------------------------------------------------------------------- #
# The build everything else stands on
# --------------------------------------------------------------------------- #

[[module]]
id = "build"
title = "Build and artefact"
weight = 28.0
timeout_sec = 5400
about = """
Copies the submission, discards anything it left built, and drives the two commands
the source contract declares -- the install build and the test build -- with every
Go toolchain name on PATH replaced by a tripwire that refuses and records. A tree
that still needs `go` fails here with a ledger entry naming the tool and its
arguments, rather than with a bare "command not found" that reads like a broken
container.

Publishes the built probe binary and the build ledger to $SRB_SUITE_WORK before
grading its own cases, so the twenty-one modules after it read one build. A bad
case in this module cannot strand the others.

This module was `required` -- a repository that does not compile has not been
ported, and crediting its frozen modules would be crediting nothing. Module-level
`required` is retired everywhere now, and the sentence above is what carries the
point instead: a build that publishes no state leaves the other twenty-one modules
reading a tree that is not there, so they error and keep their weight rather than
passing over an empty pool. 28 of 1688 is what this module is worth on its own; the
other 1660 is what it is worth by being first.
"""

# --------------------------------------------------------------------------- #
# Frozen behaviour: what the pinned reference answered, recorded before any
# submission existed
# --------------------------------------------------------------------------- #

[[module]]
id = "upstream-tests"
title = "go-yaml's own test inputs"
weight = 200.0
timeout_sec = 2700
about = """
The inputs go-yaml's own test suite carries, driven through the probe rather than
through Go's test runner. The largest single module for the same reason its budget
is the largest: every source in it is a behaviour the library's authors thought
worth pinning, which makes it the closest thing to a specification this library
has.
"""

[[module]]
id = "plain-scalars"
title = "Plain scalars and tag resolution"
weight = 110.0
timeout_sec = 2400
about = """
Unquoted scalars and the resolver that decides what they mean: the null spellings,
the three boolean vocabularies, integers in four bases, floats including the
infinities and the sexagesimals, timestamps, and the strings that merely look like
one of those. A rewrite that resolves `y` or `0o17` or `1:30` the way its own
language would has changed what every document means.
"""

[[module]]
id = "block-scalars"
title = "Literal and folded block scalars"
weight = 95.0
about = """
`|` and `>` with every combination of chomping indicator, explicit indentation
indicator and trailing-newline arrangement. Folding is the part rewrites get
wrong: which line breaks survive, which become spaces, and what a more-indented
line does to the block around it.
"""

[[module]]
id = "quoted-scalars"
title = "Single- and double-quoted scalars"
weight = 75.0
about = """
Both quoting styles, their escape vocabularies, and the line folding that happens
inside a quoted scalar spanning lines. Includes the escapes a Zig string literal
does not have and the ones YAML has that JSON does not.
"""

[[module]]
id = "block-collections"
title = "Block sequences and mappings"
weight = 55.0
about = """
Block sequences and mappings, nested and interleaved, including complex keys, empty
values, and the sequence-in-mapping indentation that is legal without indenting.
Split from flow because they are different code paths in every YAML implementation
including this one's reference.
"""

[[module]]
id = "flow-collections"
title = "Flow sequences and mappings"
weight = 60.0
about = """
`[...]` and `{...}`, nested in each other and in block context, with the empty
forms, trailing commas where they are and are not allowed, and the JSON-shaped
subset that has to parse as YAML.
"""

[[module]]
id = "tags"
title = "Tags, shorthands and %TAG directives"
weight = 85.0
about = """
Verbatim tags, the `!!` shorthand, custom handles declared by `%TAG`, and the
default resolution that applies when there is no tag at all. What a tag does to a
node it is attached to is not visible in most documents and is load-bearing in the
ones that use it.
"""

[[module]]
id = "anchors-aliases"
title = "Anchors and aliases"
weight = 55.0
about = """
`&anchor` and `*alias` including forward references that are errors, redefinition,
aliases to collections, and the merge key. An alias is a graph edge in a format
most rewrites treat as a tree.
"""

[[module]]
id = "comments"
title = "Comment attachment"
weight = 70.0
about = """
Which node a comment attaches to, and as which of head, line or foot. This is the
part of the v3 node API that has no analogue in most YAML libraries and the part a
config-rewriting tool depends on: a comment reattached to the next key survives a
round-trip in the wrong place, which is a silent corruption of someone's file.
"""

[[module]]
id = "document-stream"
title = "Documents, directives and streams"
weight = 50.0
about = """
`---` and `...`, `%YAML`, multi-document streams, and the empty and
whitespace-only documents at their boundaries. Includes what the decoder does at
end of stream, which is the difference between a clean stop and an error.
"""

[[module]]
id = "indentation"
title = "Indentation and the two clamps"
weight = 45.0
about = """
Indentation as the parser sees it and as the emitter produces it, including the
two places the reference clamps a requested indent rather than honouring it. A
rewrite that passes the clamp through unclamped emits documents the reference
would not.
"""

[[module]]
id = "unicode"
title = "Non-ASCII input and escaping"
weight = 50.0
about = """
Multi-byte input, astral-plane characters, the escaping the double-quoted emitter
applies to non-printables, and the byte sequences that are not valid UTF-8 at all.
Zig's strings are byte slices, so this is a place a rewrite can be accidentally
more permissive than the reference as easily as less.
"""

[[module]]
id = "whitespace"
title = "Tabs, CR, CRLF and the BOM"
weight = 40.0
about = """
Tabs where YAML forbids them and where it allows them, bare CR and CRLF line
endings, trailing spaces, and the byte-order mark at the start of a stream and at
the start of a later document. Small module, cheap to get right, and the failures
are the ones a user hits by opening a file in the wrong editor.
"""

[[module]]
id = "errors"
title = "Error messages"
weight = 70.0
about = """
The inputs the reference rejects, compared on the message text and not only on the
fact of failure. A rewrite whose diagnostics are its own has changed the contract
for every caller that matches on them, and "it errored too" is not the same
observation as "it errored the same way". The distinct-problem-text floor is
asserted against the shipped manifest rather than stated here.
"""

[[module]]
id = "limits"
title = "The depth caps"
weight = 35.0
about = """
The recursion and alias-expansion caps, at the boundary and past it. The expected
answer to several of these is a specific refusal, so a rewrite cannot pass by
being more thorough and slower than the original -- which is also the shape of the
billion-laughs class of bug this cap exists to stop.
"""

[[module]]
id = "roundtrip"
title = "Emit, then parse what was emitted"
weight = 40.0
about = """
Parse, emit, parse the emission, and compare. Independent of the emitter matching
the reference byte for byte: an emitter may legitimately differ in style and still
have to be self-consistent. A rewrite that emits something it cannot itself read
back fails here while passing every direct comparison.
"""

[[module]]
id = "composed-documents"
title = "Composed documents"
weight = 150.0
about = """
Constructs combined rather than exercised alone -- an anchor on a block scalar
inside a flow mapping inside a tagged sequence. Weighted heavily because this is
where a rewrite that handled every feature in isolation stops matching: the bugs
are in the interactions, and no single-feature module can reach them.
"""

# --------------------------------------------------------------------------- #
# Inputs the submission has never seen
# --------------------------------------------------------------------------- #

[[module]]
id = "unseen-inputs"
title = "Inputs generated at grading time"
weight = 220.0
timeout_sec = 3600
about = """
Generated from a seed drawn when the module starts and answered live by the
reference binary frozen into the image, both composed documents and mutations of
the frozen ones. The heaviest module in the suite, and the reason the reference
survives into the grading image at all.

This is the anti-memorisation term. A submission carrying the frozen answers --
however it obtained them -- scores zero here and keeps its other modules, which is
a shape that should be legible in a report rather than hidden in an aggregate.
"""

# --------------------------------------------------------------------------- #
# Files, protocol, provenance
# --------------------------------------------------------------------------- #

[[module]]
id = "real-world-files"
title = "Real-world YAML files"
weight = 90.0
about = """
Files a person might actually have on disk -- a Kubernetes deployment, a
docker-compose, two CI configurations, an OpenAPI document, an Ansible playbook
and inventory -- through every probe operation. Nothing here is a construct
exercise; the point is a document whose shape was decided by a tool rather than by
this suite.
"""

[[module]]
id = "protocol"
title = "Wire protocol and process behaviour"
weight = 35.0
about = """
The envelope rather than the YAML: the handshake, response key order, one response
per request in request order, flushing per line, an unknown operation, a line that
is not JSON, an empty line, and a negative indent. Plus how the process behaves --
that it stays up across requests, exits when stdin closes, and does not write
diagnostics onto stdout where the protocol lives.

A rewrite can be a correct YAML library and an unusable one: a probe that buffers
its output until exit answers every case and answers none of them in time.
"""

[[module]]
id = "provenance"
title = "Provenance of the built artefact"
weight = 30.0
about = """
What the build and the binary say about how they were made, each case pointing at a
file the build produced: the Go tripwire ledger, the toolchain the shipped binary
records, and whether any executable code in it came from somewhere other than the
pinned Zig compiler and the submission's own Zig sources.

The dividing line against stage 1 is not mechanical versus semantic -- it is
whether the question has a built artefact to point at. These do; every one is
answered by opening a file this stage's build wrote. The questions about the
submitted *files* -- what was deleted, what was retained, whether the README still
describes the project -- are stage 1's, where a read-only review does the reading
and a model with both trees open does the judging.
"""
