# The resolver's spelling table, in one document.
#
# Every plain scalar below is something resolve() has an opinion about.  The
# graded artefact is the tag it assigns and the value string it keeps, so this
# file is where a port's resolver is compared against go-yaml's spelling for
# spelling -- including the ones go-yaml deliberately does NOT resolve, which is
# where a port written from the YAML 1.1 spec goes wrong.

bools_true: [true, True, TRUE]
bools_false: [false, False, FALSE]

# YAML 1.1 says these are booleans.  go-yaml v3 follows 1.2 and resolves every
# one of them to !!str.  A port that reads the 1.1 spec tags them !!bool and
# fails all sixteen.
old_bools_yes: [y, Y, yes, Yes, YES]
old_bools_no: [n, N, no, No, NO]
old_bools_on: [on, On, ON]
old_bools_off: [off, Off, OFF]
# Spellings that are in neither table, so plain !!str either way.
not_bools: [tRue, TrUe, FALSe, yEs, ofF, "true ", Null_, nulll]

nulls: [~, null, Null, NULL]
# An empty value resolves to !!null with an empty Value.
null_empty:
# A trailing comma is allowed and does not add an entry; a leading one is an
# error, which the error family covers.  An empty *value* in a flow mapping is
# a null node, unlike an empty flow-sequence entry.
null_empty_trailing_comma: [1, ]
null_empty_flow_map: {a: , b: }
null_empty_block_seq:
  -
  - 1
  -

ints_decimal: [0, 1, -1, +1, 42, -42, 1000000, 9223372036854775807, -9223372036854775808]
# Above int64: resolve tries ParseInt, then ParseUint, then float.
ints_uint64: [9223372036854775808, 18446744073709551615]
ints_over_uint64: [18446744073709551616, 99999999999999999999999999]
ints_octal_new: [0o7, 0o17, 0o777]
ints_octal_old: [017, 0777, 010]
ints_hex: [0x0, 0xF, 0xff, 0xDEADBEEF, -0xff, +0x10]
ints_binary_not: [0b1010, 0B1010]
ints_underscored: [1_000, 1_000_000, 0x_ff, 0b1_010]
ints_leading_zero_str: ["007", 007, 08, 09]
ints_signs: ["+", "-", "+ 1", "- 1"]

floats_plain: [0.0, 1.0, -1.0, 0.5, -0.5, 3.14159, 100.25]
floats_no_int_part: [.5, -.5, .0]
floats_no_frac_part: [1., -1., 0.]
floats_exp: [1e3, 1E3, 1e+3, 1e-3, 1.5e10, -2.5E-8, 6.02214076e23]
floats_exp_no_dot: [1e0, 0e0]
floats_special_nan: [.nan, .NaN, .NAN]
floats_special_inf: [.inf, .Inf, .INF]
floats_special_plus_inf: [+.inf, +.Inf, +.INF]
floats_special_minus_inf: [-.inf, -.Inf, -.INF]
# Not in the special map and not parseable as a float, so !!str.
floats_special_not: [nan, NaN, inf, Inf, INF, -inf, .Nan, .INf, ".inf ", .infinity]
floats_underscored: [1_0.5, 1.0_5]

# Base 60 was dropped in YAML 1.2; go-yaml resolves these to !!str.
base60: [1:30, 12:34:56, 1:30.5, -1:30, +2:00, 0:0, 90:00]
# Not base 60 by the regex: the minutes field must be 0-59.
base60_not: [1:60, 1:99, 1:2:3:99]

timestamps_full: [2024-03-17T09:41:00Z, 2024-03-17T09:41:00.123456789Z]
timestamps_offset: [2024-03-17T09:41:00+01:00, 2024-03-17T09:41:00-05:00]
timestamps_lower_t: [2024-03-17t09:41:00Z]
timestamps_space: [2024-03-17 09:41:00, 2024-03-17 09:41:00.5]
timestamps_date_only: [2024-03-17, 2024-1-2, 0001-01-01, 9999-12-31]
timestamps_short_fields: [2024-3-7T9:4:5Z]
# The format list cannot parse these, so they stay !!str.
timestamps_not: [2024-13-01, 2024-03-17T25:00:00Z, "2024-03-17 21:59:43.10 -5", 24-03-17, 2024/03/17]

# An explicit tag overrides resolution.  A quoted scalar is always !!str, and a
# tag on top of quoting is still the tag.
explicit_str: !!str 123
explicit_str_quoted: !!str "123"
explicit_int: !!int "42"
explicit_float: !!float "1"
explicit_float_from_int: !!float 1
explicit_bool: !!bool "true"
explicit_null: !!null ""
explicit_timestamp: !!timestamp "2024-03-17"
explicit_binary: !!binary "R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs="
quoted_int_is_str: "42"
single_quoted_int_is_str: '42'
quoted_bool_is_str: "true"
quoted_null_is_str: "null"
quoted_tilde_is_str: "~"

# Tags the resolver does not know: kept verbatim, value unresolved.
unknown_short: !!unknown value
unknown_local: !local value
unknown_verbatim: !<tag:example.com,2024:thing> value
unknown_percent: !%21escaped value

# Collections carry their own tags.
seq_tagged: !!seq [1, 2]
map_tagged: !!map {a: 1}
set_tagged: !!set {a, b, c}
omap_tagged: !!omap [{a: 1}, {b: 2}]
pairs_tagged: !!pairs [{a: 1}, {a: 2}]

# The merge key is its own tag.
merge_source: &m {a: 1, b: 2}
merge_user:
  <<: *m
  b: 3
merge_key_alone: {"<<": literal}

# Block scalars are !!str regardless of content.
block_looks_like_int: |
  42
block_looks_like_bool: >
  true
block_looks_like_null: |-
  ~
