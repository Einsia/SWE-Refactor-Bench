# One anchor reused by four jobs through merges, plus the leading-dot
# "hidden key" convention and `extends` chains.
stages:
  - build
  - test
  - package
  - deploy

default:
  image: alpine:3.19
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "20"
  GIT_STRATEGY: fetch
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest
  DOCKER_TLS_CERTDIR: ""

.cache_zig: &cache_zig
  cache:
    key:
      files:
        - build.zig.zon
    paths:
      - .zig-cache/
      - zig-out/
    policy: pull-push

.rules_mr: &rules_mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

.zig_base:
  <<: [*cache_zig, *rules_mr]
  before_script:
    - apk add --no-cache curl xz
    - |
      curl -sSfL "$ZIG_URL" | tar -xJ --strip-components=1 -C /usr/local
      zig version
  tags:
    - docker
    - linux

build:
  extends: .zig_base
  stage: build
  script:
    - zig build -Doptimize=ReleaseSafe --summary all
  artifacts:
    paths:
      - zig-out/bin/
    expire_in: 1 day
    when: on_success

test:unit:
  extends: .zig_base
  stage: test
  needs: [build]
  script:
    - zig build test --summary all
  coverage: '/lines\.*: \d+\.\d+%/'
  artifacts:
    reports:
      junit: zig-out/test-results.xml

test:fuzz:
  extends: .zig_base
  stage: test
  needs: [build]
  allow_failure: true
  timeout: 20 minutes
  script:
    - zig build fuzz -- --max-total-time=600

package:
  <<: *cache_zig
  stage: package
  needs: ["build", "test:unit"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - >-
      /kaniko/executor --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: manual

deploy:staging:
  stage: deploy
  needs: [package]
  environment:
    name: staging
    url: https://staging.example.com
    on_stop: stop:staging
  script:
    - ./deploy.sh staging "$CI_COMMIT_SHORT_SHA"

stop:staging:
  stage: deploy
  environment:
    name: staging
    action: stop
  when: manual
  script:
    - ./deploy.sh --teardown staging
