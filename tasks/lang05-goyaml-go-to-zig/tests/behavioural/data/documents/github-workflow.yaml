# `on` is a key that YAML 1.1 reads as a boolean and 1.2 reads as a string.
# The shell fragments below are the block-scalar chomping cases in situ.
name: CI

on:
  push:
    branches: [main, "release/**"]
    tags:
      - v*
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      verbose:
        description: Print every command
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  YES: yes
  NO: no
  OFF: off

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ["0.14.1", master]
        exclude:
          - os: windows-latest
            zig: master
        include:
          - os: ubuntu-latest
            zig: "0.14.1"
            coverage: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        run: |
          set -euo pipefail
          curl -sSfL "https://ziglang.org/download/${{ matrix.zig }}/zig-linux-x86_64-${{ matrix.zig }}.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local
          zig version

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Test
        run: |
          zig build test 2>&1 | tee test.log
          if grep -q 'FAIL' test.log; then
            echo "::error::tests failed"
            exit 1
          fi

      - name: Report
        if: always()
        run: >-
          echo "os=${{ matrix.os }} zig=${{ matrix.zig }}
          status=${{ job.status }}"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.zig }}
          path: |
            test.log
            zig-out/**/*.log
          retention-days: 7

  publish:
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag digest
        run: |-
          git rev-parse HEAD > digest.txt
      - name: Notes
        run: |+
          echo "release ${GITHUB_REF_NAME}"

