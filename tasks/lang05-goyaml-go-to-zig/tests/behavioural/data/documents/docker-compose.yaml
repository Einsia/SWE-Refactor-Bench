# Anchors, aliases and merge keys, plus the scalars that look like
# sexagesimal numbers but resolve to strings.
version: "3.9"

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  networks:
    - backend
  environment: &common-env
    TZ: Etc/UTC
    LANG: C.UTF-8

services:
  proxy:
    <<: *common
    image: nginx:1.25-alpine
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:8080:8080
      - "9000:9000"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 2.14.0
        COMMIT: 3f786850
    environment:
      <<: *common-env
      DATABASE_URL: postgres://api:secret@db:5432/api?sslmode=disable
      WORKER_COUNT: 8
      CRON_WINDOW: 02:30
      RETRY_BACKOFF: 0:05
    expose:
      - 8000
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

  worker:
    <<: *common
    image: registry.example.com/api:2.14.0
    command: ["python", "-m", "worker", "--queue", "default"]
    environment:
      <<: *common-env
      DATABASE_URL: postgres://api:secret@db:5432/api?sslmode=disable
    deploy:
      replicas: 4

  db:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    networks: [backend]
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: api
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb

networks:
  backend:
    driver: bridge
  frontend:
    external: true
    name: shared_frontend

volumes:
  pgdata: {}
  certs:
    driver: local
    driver_opts:
      type: none
      device: /srv/certs
      o: bind
