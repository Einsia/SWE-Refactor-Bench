# =============================================================================
# SWERefactorBench -- build toolchain rewrite
#
#   State A : libsodium 1.0.20, built by autoconf 2.71 / automake 1.16 /
#             libtool 2.4.7.  119 translation units, ~40 feature probes, a
#             per-file ISA partition carried by 7 convenience libraries, 67
#             installed headers, 80 test programs, and a libsodium.so.26 whose
#             650 exported symbols and hardening flags are what consumers link
#             against.
#   State B : the same library, the same install tree, the same ABI and the same
#             flags, produced by CMake -- with Autotools gone from the source,
#             dependency and release closure.
#
# The agent edits /workspace/repo in place.  Harbor collects that directory as an
# artifact, destroys the agent container, and re-materialises the repository
# inside independent verifier containers that the agent never touches and whose
# tests/ tree the agent never sees.
#
# Nothing the agent built is carried over: every stage that needs a library
# configures and builds one from the submitted source.  That is what makes "there
# is no Autotools in this tree" a fact about the repository rather than a claim
# about a build directory somebody left behind.
#
# Grading is the benchmark's three-stage ladder, declared in tests/evaluation.toml
# and applied by score.py:
#
#   1. an audit review, done by a model reading State A against the
#      submission, six gates, all required.  Failing one is a zero and nothing
#      after it runs.
#   2. sixteen behavioural modules, 40 points, paid only for a submission that
#      passed every scored check in every one of them.  Short of that the
#      ladder stops here with nothing from this stage.
#   3. six adversaries with an hour each to write a test the Autotools build
#      passes and this one fails.  60 points, 10 for every adversary that finds
#      nothing.
#
# What each stage may know is as deliberate as what it measures.  Stage 1 has
# neither CMake nor a compiler, because a review that can build grades a build log
# instead of a build system, and the question here -- was feature detection
# rewritten or was a macro list copied -- is not one a build log answers.  Stage 2
# has CMake, and also the Autotools toolchain, so that State A can be run through
# it and score what it should score: it is the oracle every expectation in that
# stage was recorded from, and a stage its own oracle fails cannot tell a
# regression from a baseline.  Making the unmigrated repository unbuildable there
# was the earlier design and it bought nothing stage 1 does not already buy, since
# a repository that still builds with Autotools fails a required gate and scores
# zero before this image runs.  Stage 3 is the only image that can configure either build system,
# because "the Autotools build ships this and yours does not" is a claim that has
# to be executed, and executing it means having State A's toolchain present at
# grading time.
# =============================================================================

schema_version = "1.4"

# ---------------------------------------------------------------------------
# Collected from the agent container, re-materialised at the same absolute path
# inside the separate verifier container.
#
# The exclusions drop build and install debris only.  They exist so the verifier
# cannot be handed a prebuilt libsodium.so.26 and be fooled into inspecting
# something the submitted *source* no longer produces -- which for this task is
# the whole ball game, since a tree that kept its Autotools would otherwise ship
# a perfectly good shared object built from it.  Solutions must therefore live in
# tracked source files, never inside these paths, a rule instruction.md states
# outright.
#
# build-aux/ is deliberately NOT excluded and must never be: it holds ltmain.sh,
# config.guess, config.sub, install-sh, compile, depcomp and missing, all of them
# files the upstream tarball delivers rather than files a build writes.  A `build*`
# glob catches it, and a tree whose build-aux/ was dropped stops building at all.
# ---------------------------------------------------------------------------
[[artifacts]]
source = "/workspace/repo"
exclude = [
    "build",
    "_build",
    "builddir",
    "build-cmake",
    "build-release",
    "build-debug",
    "cmake-build",
    "cmake-build-debug",
    "cmake-build-release",
    "CMakeFiles",
    "CMakeCache.txt",
    "_CPack_Packages",
    "Testing",
    ".libs",
    ".deps",
    "autom4te.cache",
    "*.o",
    "*.lo",
    "*.la",
    "*.a",
    "*.so",
    "*.so.*",
    "*.dylib",
    "*.gcda",
    "*.gcno",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "install",
    "prefix",
]

[task]
name = "swerefactor/build01-libsodium-autotools-to-cmake"
description = "Migrate the whole libsodium 1.0.20 build system from GNU Autotools to CMake, preserving the 119-unit compile graph, per-file ISA dispatch, the libsodium.so.26 ABI, the installed release layout and the hardening flags -- with Autotools gone from the source, dependency and release closure."
authors = []
keywords = [
    "swe-refactor",
    "build-toolchain-migration",
    "c",
    "cmake",
    "autotools",
    "libsodium",
    "abi-compatibility",
    "offline",
]

[metadata]
category = "build-toolchain"
difficulty = "frontier"
license = "ISC"
upstream = "https://github.com/jedisct1/libsodium"
upstream_version = "1.0.20"
upstream_commit = "93a7d0d41fe2e32409b5d00386946f491750b7de"
source_repository = "https://github.com/jedisct1/libsodium"
source_version = "1.0.20"
state_a = "libsodium 1.0.20 built by autoconf 2.71 / automake 1.16 / libtool 2.4.7, 119 translation units, per-file ISA dispatch through 7 convenience libraries"
state_b = "the same libsodium.so.26, the same install tree and the same hardening flags, produced by CMake 3.20+, with Autotools gone from the source and release closure"
scale = "119 translation units, 15 ISA-elevated sources, ~40 feature probes, 67 installed headers, 80 test programs"
tags = [
    "whole-repository",
    "build-system-rewrite",
    "isa-dispatch",
    "elf-forensics",
    "hardening-flags",
    "offline",
    "anti-cheat-gated",
]

# ---------------------------------------------------------------------------
# Agent phase
#
# 6h wall clock: 119 translation units whose per-file flags have to survive, 15
# ISA-elevated sources across 7 convenience libraries, ~40 feature probes that
# have to be real probes rather than a transcribed answer sheet, 67 installed
# headers including a generated version.h, 80 test programs that have to be
# registered and pass, an exported CMake package, a pkg-config file whose paths
# stay relocatable, and a source package.  The State A tree stays in the image as
# the oracle, so the time goes on the port rather than on discovering what the old
# build did.
#
# no-network: the toolchain is already in the image, and libsodium has no
# third-party dependencies, so offline costs the agent nothing and removes
# "downloaded somebody else's CMakeLists" as a possibility.
# ---------------------------------------------------------------------------
[agent]
harness = "codex-cli 0.146.0"
timeout_sec = 21600.0
network_mode = "no-network"
user = "root"

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/workspace/repo"

[environment.env]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
# libsodium's Autotools build refreshes config.guess/config.sub from the system's
# copies unless told not to.  Pinning it keeps State A byte-stable across image
# rebuilds, so a diff against the oracle is a diff about the migration.
DO_NOT_UPDATE_CONFIG_SCRIPTS = "1"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"

# ---------------------------------------------------------------------------
# Verifier phase
#
# environment_mode = "separate" + [verifier.environment] means tests/ becomes the
# build context of the verifier image and Harbor does not upload it to the agent
# container.  That is what keeps the suite invisible.
#
# The timeout covers the whole ladder, whose own budgets in tests/evaluation.toml
# are 5400 + 10800 + 54000 = 70200s.  The margin above that is for building three
# images and for the ladder's own overhead, and it is a ceiling rather than an
# expectation: most submissions never reach stage 3, because stage 1 zeroed them
# or stage 2 came in short of full marks.  Stage 2 is budgeted generously because it
# does a configure-build-install cycle in each of the shared matrix's seven
# configurations, four more configure-only builds under compilers that lack a
# capability, and a handful of per-module one-offs including a DESTDIR stage --
# and every one of them starts from a clean tree.
#
# Stage 3's budget is deliberately not 6 * 3600: an adversary that concludes
# early returns early, and the hour is a limit on one round rather than a quota to
# be spent.
# ---------------------------------------------------------------------------
[verifier]
timeout_sec = 75600.0
environment_mode = "separate"
user = "root"

[verifier.environment]
network_mode = "no-network"
# Three images, and the stage-2 one freezes State A's ground truth at build time
# by doing a full Autotools build of the oracle, so its build is slower than the
# agent environment's.
build_timeout_sec = 7200.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
DO_NOT_UPDATE_CONFIG_SCRIPTS = "1"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
# Where the shared grader lives inside every stage image, and where the three
# stages agree to leave their result files.  score.py reads the second from
# evaluation.toml, so this only has to hold for a stage invoked by hand.
SRB_INFRA = "/opt/swerefactor"
SRB_RESULTS = "/logs/verifier"

# There is deliberately no solution/ tree and no [solution.env].  A reference
# implementation in the task directory is a thing that has to be kept correct
# against every future change to the suite, and its only consumer would be a smoke
# test that the suite can be passed at all.  The suite's own gate answers that:
# stage 3 is asked only of a submission that scored stage 2 in full, so a tree
# that reaches it has already passed every recorded check.  What six models add is
# the other half -- an hour each spent hunting for a behaviour nobody thought to
# record.
