; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be its own directory without losing these settings.
[pytest]
python_files = test_*.py
python_functions = test_*

; No blanket per-test timeout.  A check here either reads a tree the `build`
; module already produced -- microseconds -- or compiles and runs one corpus
; program, and the corpus module's own budget in suite.toml is the bound that
; matters.  A timeout large enough for the slowest of those is useless for the
; rest.

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -ra
    --durations=25

markers =
    behaviour: State A's build results must survive the migration
    migration: CMake really replaced Autotools rather than wrapping it
    slow: needs a configuration built for this check alone

filterwarnings =
    default
    ignore::DeprecationWarning
