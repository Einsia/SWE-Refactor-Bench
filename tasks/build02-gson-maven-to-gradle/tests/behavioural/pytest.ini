[pytest]
# Stage 2.  One pytest process per module, all ten pointed at this file by
# lib/run-pytest.sh, so collection behaves identically in every module and a check
# id means the same thing across the report.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `--strict-markers` is load-bearing rather than tidy.  `audit` is worth three
# times a parity check (srbfixtures.pytest_collection_modifyitems), so a typo in a
# marker name would silently reweigh a check instead of failing collection.
#
# No `-x`.  The stage pays all or nothing, so stopping at the first failure would
# still score the same -- but it would publish a rate computed from one check, and
# the rate is the whole diagnosis: "the jar is right except for one manifest header"
# and "there is no jar" both score zero and have to be told apart by the report.
#
# No timeout plugin either.  A module that hangs is hanging inside a Gradle build,
# and the ceiling for that is `timeout_sec` on the module in suite.toml, where it
# ends the module with an error the runner reports rather than killing a single
# check and continuing against a half-built tree.
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    behavioural: the artefact differs from what State A shipped in this one respect
    audit: the artefact is not the thing the project shipped -- weighed 3x
    srb_skip_ok: a skip here is licensed rather than a miss (see below)
    srb_weight(w): record this check at weight w instead of 1.0

# `srb_skip_ok` and `srb_weight` are declared here as well as by the harness
# plugin, and the duplication is deliberate: the plugin registers them at run time,
# but
# lib/collect-check.sh collects with `-p srbfixtures` alone -- deliberately, since
# the harness plugin would want an SRB_RESULT to write -- and `--strict-markers`
# would then reject at image-build time a marker that is perfectly valid at run
# time. Registering them in both places costs two duplicate lines in `--markers`
# and nothing else.
#
# `srb_weight` carries the other half of the weighting contract. `audit` weighs
# a check up; this weighs one down, and `srb_weight(0.0)` -- used in `entries` and
# `publication` -- keeps a check reported and out of the arithmetic entirely, for
# the checks that say something true about the producer rather than about the
# artefact a consumer receives.
#
# The contract it carries: everywhere else a skip is scored as a miss, because the
# environment is fixed and offline and nothing is skippable unless the artefact
# under test is absent -- which is the finding. A check wearing this marker is one
# whose subject is genuinely optional, and there are two: the ProGuard pass in
# `derive` that needs the build to have kept both copies, and the Gradle Module
# Metadata in `publication`, a file no publisher outside Gradle emits and which
# State A's release therefore does not have.

# The suite reads jars, class files and JUnit XML that a submission's build wrote.
# A DeprecationWarning from the standard library's zipfile on a malformed entry is
# information about the submission, so warnings are shown and never turned into
# errors: a warning must not fail a check whose assertion passed.
filterwarnings =
    default
