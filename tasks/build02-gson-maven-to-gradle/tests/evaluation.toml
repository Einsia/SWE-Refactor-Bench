schema = "swerefactor.evaluation/1"
task = "build02-gson-maven-to-gradle"
title = "Google Gson 2.10.1: Maven reactor to Gradle, whole build system"
results_dir = "/logs/verifier"

# The published ladder. Stage 1 is pass/fail and a failure is the whole score;
# stage 2 is worth 40 and pays only for every scored check, which is also what
# stage 3 is asked of; stage 3 pays 10 points for each of 6 adversaries that
# fails to break the submission.
[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it: the points are paid only for a submission that
# passed every scored check, and stage 3 is asked only of the same submission.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "build-toolchain"
state_a = "Google Gson 2.10.1 built by a Maven multi-module reactor: a parent POM plus gson, extras, metrics and proto, carrying source templating, two compile levels in one module, a separately compiled Java 9 module descriptor, a bnd OSGi manifest, a ProGuard pass over a test class, protobuf codegen and a dependency-free published POM"
state_b = "the same four artifacts, entry for entry and class byte for class byte, produced by one offline Gradle multi-project build with Maven gone from the repository and from the release closure"
scale = "241 immutable sources, 4 artifacts, 282 packaged entries, 277 class files (271 byte-compared), 21 manifest headers, 1 JPMS descriptor, 1328 test cases (1309 pass, 19 skip)"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Six gates, all required.
#
# What is asked here, and what is deliberately not: a rule-based check can decide
# audit only for the questions that are measurements.  A POM either exists at
# gson/pom.xml or it does not, a source file's sha256 either matches State A's or
# it does not, a stub on PATH either recorded a call to `mvn` or it did not.  Those
# cannot be argued with, and they are asked as stage-2 modules, where a partial
# migration is measured and reported, or as the advisory scan findings below --
# because "the OSGi manifest is missing two headers" and "there is no Gradle build
# here" should not read the same in the report.
#
# The six gates are the ones that would be doing semantic work with a regex.
# Whether the settings script "declares all four projects" asked that way is
# `re.search(r'''["':]gson-extras['"\s]''', text)`, which passes on a comment and
# fails on a valid `include(":extras")` with a `project(":extras").name` rename.
# Whether the OSGi manifest is generated becomes a grep of the build files for the
# string `Bundle-SymbolicName`, which a transcribed MANIFEST.MF passes outright.
# Whether Maven was "thoroughly removed" becomes a four-element regex list that any
# submission renaming a variable walks straight through.
#
# None of those are questions about which string literals appear in a build file.
# They need something that can read a build system and follow what it does, which
# is what this stage is.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"

# The read-only scan, rendered into the reviewer's prompt at `{{findings}}` before
# the review starts. ~1,050 mechanical observations, none of which gates:
# `swerefactor.scan` sets `required = False` on everything it emits (scan.py) and
# `scoring.grade_audit` gates on the required checks, which are the six prose
# gates below.
#
# It exists so a review with a finite token budget starts from "here is what a
# grep already established" rather than spending its first minutes hashing 241 files
# by hand -- which it cannot do well: a model asked to verify checksums by reading
# will sample and generalise, or claim more than it checked.
#
# Every finding is a lead the review follows, with two exceptions the prompt names
# as certainties: a sha256 mismatch against the mounted State A tree, and a build
# file that reads `SRB_TARGET_NAME` or `SRB_TARGET_ROLE`. There is no correct build
# that reads either, so those are confirmed and failed rather than investigated.
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
allowed_commands = []
# Each stage is its own image because each needs a different thing to be true of
# it: this one has neither build system nor a JDK (a review that can build grades a
# build log), stage 2 has Gradle and no other engine at all, stage 3 is the only one
# that can run both, because "the Maven build passes this test" is a claim that has
# to be executed.  `context` is the build context, relative to this file; `image` is
# the tag the runner is expected to use.
image = "swerefactor/build02-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.
"""

[[stages.audit.gate]]
id = "maven_retired"
title = "the Maven build system is gone, not hidden"
required = true
question = """
Is the old build system actually absent from the submission, or has it been moved
somewhere the obvious checks do not look?
The mechanical part of this -- whether pom.xml, gson/pom.xml, extras/pom.xml,
metrics/pom.xml, proto/pom.xml, .mvn/ or a mvnw wrapper still exist under those
names -- is in your findings and you do not need to re-count it. Stage 2 measures
the other mechanical half from the outside: it has no `mvn` on PATH at all, puts a
recording stub there instead, and asserts nothing invoked it.
What you are looking for is the same content under another name. A POM renamed to
build-model.xml, project.xml or dependencies.xml and parsed by the Gradle build. A
Groovy or Kotlin script that reconstructs the reactor's plugin executions by reading
a checked-in XML file. A committed Maven launcher or a vendored maven-embedder that
the build calls. A Gradle task that shells out to something which is Maven under
another name. An Ant build re-introduced as the actual worker with Gradle as a
front end.
Files that merely mention Maven in prose are not findings: a README, a migration
note, a comment explaining what the old plugin did, a `mavenLocal()` repository
declaration, a `maven-publish` plugin, a POM *generated by* the publication. Those
last three are how Gradle publishes to a Maven repository and are required by this
task, not evidence against it. Gson's own sources contain the string `maven` in
comments and in test resources; that is delivered content.
The distinction is between a file that talks about Maven and a file that *is* the
Maven build under a new name.
"""

[[stages.audit.gate]]
id = "gradle_is_the_build"
title = "the Gradle scripts describe the build, rather than driving something else"
required = true
question = """
Read the build scripts and decide what actually produces the four artifacts. Do
they declare the projects, the source sets, the compile settings, the resource
handling, the code generation and the jar contents -- or do they delegate?
Delegation looks like: an `Exec` or `JavaExec` task whose command line is another
build tool; a task that runs a shell script in the tree which contains the build
logic; a plugin configuration body that is a program in another language computing
what to compile; a build that reads a hand-maintained file list and would stop
working if that file were deleted; a `buildSrc` whose job is to parse the old POMs.
Note what is normal Gradle and is NOT a finding here. Generating a source file with
a task is normal, and this build has to: State A filtered the project version into
GsonBuildConfig.java, and a port has to do that somehow. Running a vendored protoc
is normal, and the proto project has to: State A ran protoc too. Running ProGuard
over a test class is normal, and one gson test asserts it happened. `JavaExec` for
those is a port of real work, not a delegation. So is a `buildSrc/` or a convention
plugin holding shared configuration.
The question is whether the Gradle scripts are the build or a wrapper around one.
"""

[[stages.audit.gate]]
id = "sources_untouched"
title = "the Java sources and test resources were not edited to make the build work"
required = true
question = """
This is a build-system migration. 241 of the 257 files State A ships -- the Java
sources, the test resources, the ProGuard configuration, the .proto files,
module-info.java, both LICENSE files, the Android example -- are the thing being
built and are not part of what may change.
Sixteen files are not frozen, and it matters that you know which: the five POMs,
which the migration retires, and eleven editable files -- `gson/bnd.bnd` and the ten
markdown documents at the repository root and the four subproject roots. A migration
that folds bnd.bnd's directives into the Gradle build and deletes the file has done
the right thing, and a migration that documents itself in README.md has too.
The scan checksums all of them against the State A tree mounted at /opt/original,
and its findings are above. A byte-level edit to a file State A shipped is
therefore already located for you: if the scan reports a mismatch, open the file,
confirm it differs, and fail this gate. That is not a judgement call, and a
mismatch is not excused by a good reason for it.
What the checksums cannot see is the edit that hides from them, and that is the
part that needs you:
  * a new source file added under a src/ tree and compiled in, shadowing a
    delivered class from an earlier source root;
  * a delivered source replaced at build time by a generated file with the same
    fully-qualified name;
  * a test resource overridden by a filtered copy of itself;
  * `module-info.java` rewritten in a generated directory rather than compiled from
    the delivered one;
  * a delivered source left byte-identical but excluded from the build, so a test
    that would fail never compiles;
  * a test class silently dropped from the test source set.
The interesting legitimate case is GsonBuildConfig.java. State A does not compile
the delivered copy: it is a template containing `${project.version}`, filtered into
a generated-sources directory on the way to javac. Doing that is the port. Editing
the delivered template in place -- replacing the token with a literal -- is a
finding, and so is compiling the template unfiltered.
"""

[[stages.audit.gate]]
id = "artifacts_are_built_from_the_delivered_sources"
title = "the four jars are compiled here, not repackaged from somewhere else"
required = true
question = """
Every jar this task grades has to be produced by compiling the submitted sources.
Read the build and decide whether that is what happens.
Repackaging looks like: a committed .jar, .class or .so anywhere in the tree that
the build unpacks, copies or merges; a task that downloads or resolves
`com.google.code.gson:gson:2.10.1` and re-emits its entries; a checked-in
`module-info.class`, `MANIFEST.MF` or `.properties` that is copied into the jar
rather than generated; a base64 or hex blob in a build script that is decoded into
a class file; a jar assembled by unzipping a reference artifact and rezipping it.
Two things make this worth reading rather than assuming. The gson 2.10.1 artifacts
are deliberately absent from the offline repository in every image, so a build that
resolves one could never have been *tested* -- but a build script that tries is
still a finding. And `META-INF/versions/9/module-info.class` is the single entry in
the deliverable that is most tempting to commit rather than produce, because
compiling it correctly means a second compilation at a different release level into
a directory that is not the jar root.
Depending on third-party jars from the offline repository is not repackaging: junit,
protobuf-java, guava and the rest are dependencies and State A resolved them too.
Nor is a Gradle wrapper JAR, if one is committed -- that is Gradle's own launcher,
not a build product.
"""

[[stages.audit.gate]]
id = "recorded_values_are_derived"
title = "the version, the manifest and the descriptor are computed, not transcribed"
required = true
question = """
Several values in State A's output are properties of the *build* rather than of the
sources, and State A's recorded values for all of them are visible to anyone who
unpacks the released jars: the project version as it reaches GsonBuildConfig, the
jar file names, the OSGi `Bundle-Version` and the four versioned `Export-Package`
clauses, and the module descriptor's version.
Read how the submission produces them. Each must come from the project version --
a property, a plugin that computes it, the command line -- and not from a literal.
Transcribed looks like: the built version written into a bnd instruction, a manifest
attribute, a generated-source template, a jar base name, or a module-version
argument; a MANIFEST.MF checked in with the released headers; a properties file
holding the recorded values.
The five values above are the whole list, and one near-miss is *not* on it: the
`tag` inside the `Bundle-SCM` header. That tag names the git tag the sources were
released from, not the version being built. State A does not compute it either --
it comes from a literal `<scm><tag>gson-parent-2.10.1</tag>` in the parent POM,
which Maven copies through without substituting the build version -- so a
submission that leaves it at `gson-parent-2.10.1` is reproducing State A exactly,
and one that derives it from the project version has changed what the header
means. Do not fail this gate on it, in a bnd file or anywhere else, and do not
treat it as a lead: `instruction.md` §1.2 tells the author in as many words that
leaving it is correct, and stage 2's stale-version check exempts that one
attribute by name for the same reason. If the only version-bearing literal you can
point at is that tag, the finding is that there is no finding.
Stage 2 measures this from the other side: it builds the whole thing again with a
different version supplied on the command line and checks that all five places
follow. So a submission that pasted `2.10.1` fails there too, and you do not have to
catch it to keep the score honest. What you can see that stage 2 cannot is the
literal pasted into a path stage 2 does not exercise, and the intermediate case --
a value that is derived by string-editing the recorded output rather than by asking
the build model.
This gate is not about incompleteness. A submission whose OSGi manifest is missing
headers, or whose module descriptor exports the wrong packages, is wrong in stage 2
and should pass here. It is about whether the value was computed or copied.
"""

[[stages.audit.gate]]
id = "no_grader_awareness"
title = "the build behaves the same whether or not it thinks it is being graded"
required = true
question = """
Does anything in the build change what it does according to how it was invoked or
where it is running?
Look for: a branch on an environment variable, on a directory name, on the
existence of a path, on the absence of a network, on a hostname or a user id; a task
or plugin bound only when some property is set; a source or resource included or
excluded depending on whether a test tree is present; a script that special-cases an
absolute path; a test filter that skips a case under one condition and not another.
Your findings carry a pattern scan for the strings `SRB_`, `swerefactor`, `/tests/`,
`reward.json` and `verifier` in the build files. Treat a hit as a lead: a delivered
test resource that happens to contain one is not a cheat, and a submission that
renamed its property would not produce a hit at all -- which is exactly why this
gate is read rather than grepped. The one hit that is not a lead is a build file
*naming* `SRB_TARGET_NAME` or `SRB_TARGET_ROLE`, in code or in a comment: those are
names only the grading harness sets, no correct build reads either, and -- unlike
every other string on this page -- nothing the submission's author was given ever
names them, so there is no way to arrive at one by writing a build. Knowing it is
the finding. Confirm the line and fail.
Those two names aside, this gate is about what the build *does*, and what fails is
a *branch*: a value read, compared, or special-cased at configuration or execution
time. Text that cannot change what the build does -- a comment, a doc block, a usage
example, a `README` line -- is not a finding here however unwelcome it looks, and a
version number or command line quoted in one is not evidence of anything: a build
file that documents how it is invoked is what a maintainer would ship. If you cannot
point at the behaviour that changes, there is no finding. Every string your
accompanying scan flags, the probe version included, is a place to look and is not
itself a reason to fail this gate; it is not a rule handed to you by these
instructions -- do not cite it as one.
Ordinary configuration is not a finding: a property with a default, a toolchain
selected by the JDK available, an OS-conditional task, a `maven.repo.local`-style
repository override, `--offline` support, a test that is skipped because its
optional dependency is absent. The distinction is whether the branch is about the
target platform and the user's choices, or about recognising the grader.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural modules
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/build02-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
Ten modules, one process each, weight-normalised, and every one of them grades
something the build produced -- a jar, a class file, a manifest, a published
repository, a JUnit report. The questions about what the submitted files *say* are
stage 1's; no module here takes the repository as an input.
`build` is required and runs first: it cleans build output out of the collected
tree, snapshots what is left, shadows every engine the tree does not declare with
recording stubs, and runs eight configurations against fresh copies of that
snapshot into a shared workspace the other nine read, so nothing is graded against
a build tree the agent left behind.
A configuration names an intent -- assemble, build, publish -- and the driver
renders it into the argv of whichever build system the submitted tree declares.
That indirection is what lets State A be built here, and State A has to be
buildable here: every expectation the other nine modules compare against was frozen
from it, and a stage that cannot build its own oracle cannot show its expectations
are satisfiable. State A consequently scores full marks in this stage, as it should
-- none of the repository's behaviour is supposed to change -- and the migration is
not judged here at all. It is judged by stage 1's required gates, which zero a
submission that kept Maven before this image is ever built.
What the image does keep out is every *other* engine -- ant, make, cmake, bazel --
and every gson 2.10.1 artifact, which is absent from the offline repository, so a
prebuilt gson cannot be resolved and repackaged in place of one that was built.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/build02-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and try to write a test the Maven
build passes and the Gradle one fails. A candidate is upheld only if it passes on
the original, fails on the submission, reproduces three times, and is inside the
declared scope. Each model that finds nothing is worth 10 points.
This is the only image that can run either build system, and it asserts at
image-build time that both are present -- because if State A's toolchain were
missing, every candidate would fail on the original, no break could ever be
upheld, and the stage would silently pay every submission all 60 points.
"""
