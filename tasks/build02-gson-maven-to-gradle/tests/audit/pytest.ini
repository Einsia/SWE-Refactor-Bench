[pytest]
# Stage 1 only. The scan reads two trees and reports; it never builds, and there is
# no toolchain in this image to build with.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# No timeout plugin: a scan that hangs is hanging on a filesystem walk, and the
# module's own timeout_sec in scan.toml is the right place for that ceiling.
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate

filterwarnings =
    default
