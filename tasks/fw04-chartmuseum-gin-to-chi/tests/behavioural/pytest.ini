; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be its own directory without losing these settings.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Per-test, thread-based.  A submission that hangs on one request must lose that
; case, not the module: the default (signal) method cannot interrupt a blocking
; socket read inside the launcher.  300s is generous for a single request and
; still far below any module's own timeout.
timeout = 300
timeout_method = thread

; `--maxfail` is deliberately absent.  A module's score is a pass ratio, so
; stopping early would truncate the denominator and hand a badly broken
; submission a better score than a nearly-correct one.
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=15

; No family markers: the module boundary is what splits one score from another,
; and a marker that decides a weight is a marker that can be forgotten on a new
; test.
markers =
    slow: deliberately waits on something slow
    srb_skip_ok: a skip here is licensed rather than a miss (see below)

; `srb_skip_ok` is declared here as well as by the harness plugin, and the
; duplication is deliberate: the plugin registers it at run time, but the
; Dockerfile's collection check runs with `-p srbfixtures` alone -- deliberately,
; since the harness plugin would want an SRB_RESULT to write -- and
; `--strict-markers` would then reject at image-build time a marker that is
; perfectly valid at run time.  Measured: five collection errors, before a rebuild.
;
; The contract it carries: everywhere else a skip is scored as a miss, because the
; environment is fixed and offline and nothing is skippable unless the artifact
; under test is absent -- which is itself the finding.  A check wearing this marker
; skips on a property of the RECORDING instead: `body_mode=ignore`, a field the two
; capture runs of State A disagreed about, or a corpus that declares no case of
; that kind.  A submission cannot reach any of those.  What it can reach -- a
; server that did not launch, a case with no response -- fails inside the `pair`
; fixture and is not skippable, and the one skip that is submission-conditioned
; (`test_profile_answered_every_case`) is deliberately left unlicensed.

; A DeprecationWarning from the grader's own code is a grader bug and should stop
; the run rather than scroll past.
filterwarnings =
    error::DeprecationWarning
    default
