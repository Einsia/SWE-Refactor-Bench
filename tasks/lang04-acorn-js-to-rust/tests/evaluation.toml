# --------------------------------------------------------------------------- #
# lang04 -- acorn, JavaScript to Rust: how a submission is graded
# --------------------------------------------------------------------------- #
# Three stages, in order, each able to end the grading run:
#
#   1. an audit review, by a model that may read both trees and may run
#      nothing, preceded by a read-only scan that hands it findings
#   2. 14 behavioural modules, 40 points, all or nothing, measuring the built
#      artifacts against a reference build of State A
#   3. 6 adversaries with both trees and both builds, 60 points
#
# The agent never sees this file, or anything else under tests/.
schema = "swerefactor.evaluation/1"
task = "lang04-acorn-js-to-rust"
title = "acorn 8.14.0: reimplement an ECMAScript parser monorepo in Rust, output byte-identical"
results_dir = "/logs/verifier"

[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it, and short of all of it stage 3 does not run. Six
# models looking for one input that a parser gets wrong is a question worth paying
# for only once nothing else has found one; on a submission whose own differential
# corpus has already found a failing input, an adversary finds a hole by accident
# and the finding says nothing the corpus did not already say.
#
# The rule is `passed >= total` per module, on integers, so no weight set can
# perturb it -- this one included, whose thirteen scored modules sum to
# 0.9300000000000002 rather than 0.93 because summing decimal fractions in binary
# does that. The weights still decide the `behavioural_rate` the report prints, and
# a rate is the one figure that arithmetic can move; the payment is not.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "language-rewrite"
state_a = "acorn 8.14.0: 116 files of JavaScript across acorn, acorn-loose and acorn-walk, built by rollup into three ESM/CJS bundle pairs plus bin/acorn"
state_b = "the same three libraries and the same CLI, in Rust (1.90 in the image), std/core/alloc only, ESTree JSON byte-identical"
scale = "6,549 lines of JavaScript across the three src/ trees, plus upstream's own 6,763-test suite"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# The gates below are the questions about this migration that a pattern cannot
# honestly settle. Each is answered `pass` or `fail` -- there is no third answer --
# by a model with both trees open and no toolchain, and the required ones are the
# hard gate: one failing is a zero, and nothing after it runs.
#
# Why so few of them are mechanical. Rust's standard library has no ECMAScript
# parser, so unlike this benchmark's sibling tasks there is no short delegation
# to forbid -- no `java.util.zip`, no `encoding/json`. Every route to a passing
# score without writing a parser is bulky: another Rust parser vendored in,
# State A's own JavaScript still executing, or a table of stored answers. All
# three arrive as thousands of lines of plausible Rust source, and what separates
# them from a port is not a token but a decomposition. That is a reading, so a
# reader does it.
#
# Which is also why the ones that *are* mechanical are not gates here. Whether an
# interpreter was spawned while grading, and whether the install prefix holds what
# it promised, each have an artefact to point at, so each is measured in stage 2 --
# rather than becoming a tripwire that turns "the .rlib metadata is odd" and "this
# repository contains no Rust" into the same verdict. Five of those questions do
# have a required gate below -- `no-interpreter` twice, `parser-is-written-here`
# twice, `no-embedded-reference` once -- so for those the source is read here and a
# failure zeroes the submission, while the behaviour is measured there.
#
# One question is asked in neither stage: whether the shipped ELF carries rustc's
# own producer metadata. It is the gap in this design worth naming, because it is
# the question a source review is least able to answer -- a model reading Rust
# cannot see what rustc stamped into a binary. Closing it means giving a module a
# weight, or asking it in stage 3, which already builds both trees.
#
# What `required = false` would mean here, and why nothing uses it:
# `grade_audit` gates on the conjunction of the *required* checks, so an
# advisory gate's answer reaches the transcript and no part of the score. That is
# a reasonable thing to want for a subject worth reading about and not worth
# voiding a submission over -- attribution, an edited assertion, a README
# describing an npm build -- but the scan below already reads those subjects and
# already reaches the transcript, so an advisory *gate* would only add a model
# judgement that nothing consults.
#
# The scan is the mechanical half of all of it, and nothing it emits is scored --
# `swerefactor.scan` forces required = false on every check it produces. Its three
# modules run before the review and are substituted into the prompt at
# {{findings}}: `closure` asks whether the JavaScript left and whether there is
# Rust where it was, `provenance` asks where the parse trees come from, `contract`
# asks about harness awareness, stored answers and the retained documents. Every
# text search in it runs only over files whose bytes differ from State A's copy at
# the same path, because this is a parser: `eval`, `node`, `Function` and `import(`
# are its subject matter, and a grep over the whole tree for those reports hundreds
# of findings against honest work.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
image = "swerefactor/lang04-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.

The review is bounded by wall clock alone and gets more of it than a framework
task's. State A is 6,549 lines of JavaScript and a complete port is at least
that much Rust; the gates that ask whether the recursive-descent decomposition
is acorn's cannot be answered from a directory listing.

There is deliberately no Rust toolchain and no node in this image. A review that
can build starts grading build logs, which is stage 2's job and which it does
against a reference build this stage does not have.
"""

[[stages.audit.gate]]
id = "javascript-left"
title = "State A's implementation is gone, and Rust is where it was"
required = true
question = """
State A is 116 files of JavaScript: acorn/src holds the parser -- state.js,
tokenize.js, expression.js, statement.js, lval.js, scope.js, regexp.js and the
rest -- alongside acorn-loose/src and acorn-walk/src. Are those gone, and is what
replaced them Rust?

The interesting cases are JavaScript that moved rather than left: relocated to a
directory the build no longer names, renamed to an extension nobody scans for,
kept under a vendor or archive path, or carried as a string literal that is
written out or interpreted at run time. Search by basename anywhere in the tree
rather than at State A's paths -- moving expression.js to attic/ does not port it.

Nothing requires upstream's file layout, and missing filenames are not missing
work: tokenize.js may reasonably have become part of a larger lexer, and a port
that reorganised freely has still ported. What this gate asks is whether the
implementation is Rust now, not whether it is arranged the way it used to be.

JavaScript that is genuinely not the library is not a finding. Upstream ships its
own test suite, a bench harness and rollup configs; a submission may keep them,
delete them, or leave them broken. When you report JavaScript, say what reads it
and what depends on the result.
"""

[[stages.audit.gate]]
id = "parser-is-written-here"
title = "the parser in this repository is an implementation of acorn"
required = true
question = """
Is there a real ECMAScript parser here, and is it this repository's own?

Pick two or three things acorn has to get right that are hard to fake and find
where the Rust does them: the token context stack that decides whether `/` starts
a regular expression or divides, the strict-mode and scope rules that make
`delete x` an error in one context and not another, the regexp validator's
handling of named groups and `\\p{...}` property escapes, the `Literal` node's
field order for a regexp. Code that implements those looks like an
implementation. Code that does not will either be missing or will call something.

What counts as calling something: another Rust ECMAScript parser vendored in and
renamed -- swc_ecma_parser, boa_parser, ress, rslint_parser, oxc_parser,
jsparagus, a tree-sitter grammar -- or a crate wrapping one. The contract allows
std, core and alloc only, so any third-party crate is already a contract break,
but read what it does before choosing your words: a submission that pulled in a
crate to serialise JSON has broken a rule without faking a parser, and that
deserves different words from one that pulled in a parser.

A vendored parser is the hard reading, because it is Rust source in the tree with
no external dependency and no build script, and it passes every mechanical check
this benchmark has. It is also visible in ten minutes to anyone holding acorn's
state.js in the other hand: the recursive-descent decomposition is different, the
token types are different, and the error messages are different. Quote both trees
at the same place and let the comparison make the argument.

Judge transliteration by a different standard than you would judge a C port.
Following acorn's phases and names is what any port of acorn does, and the
prototype-extension pattern State A uses -- `pp.parseExpression = function...`
spread across nine files -- has no natural Rust equivalent, so a faithful port
*must* restructure. Reproducing acorn's control flow in Rust syntax is the task
here, not a finding.

Report what is missing as well as what is there. A submission whose parser is
real and whose acorn-loose returns the strict parser's error is most of a
migration, and that is worth writing down precisely.
"""

[[stages.audit.gate]]
id = "no-interpreter"
title = "no JavaScript engine runs, at build time or at run time"
required = true
question = """
Does anything here execute JavaScript to answer a parse?

The routes: `Command::new("node")` or any other spawn of an interpreter, an
`#[link]` or `dlopen` of a JavaScript engine (libquickjs, libduktape, v8,
JavaScriptCore), a build script that runs node or npm, an `include_str!` of State
A's source feeding an interpreter written here, or a bundled JavaScript engine's
source compiled in.

Follow the build as the build sees it, from `make build` through to the two
binaries, and name the file and line. Stage 2 deletes npm and replaces node with
a tripwire, so a submission that needs an interpreter is unbuildable there and
that is measured, not reviewed. Yours is the broader question: code that would
only reach for an interpreter on input stage 2 does not send is invisible to the
tripwire and visible to you.

`std::process` in a doc comment explaining that the port spawns nothing is the
commonest true negative on this task. So is a script under a tools or dev
directory that regenerates Unicode tables offline and is not on the build path.
Read the hit before deciding which you have.

State A's own npm scripts are not this gate's finding. `"test": "node test/run.js"`
in a retained package.json is JavaScript being run *as* JavaScript, which is what
`javascript-left` is for; this gate asks whether something executes JavaScript to
answer a parse *for the port*. On a tree where the port does not exist there is no
such route and no `make build` to follow, so answer pass and let the gates that
own the missing port fail it. What fails here is a build or a binary that reaches
for an interpreter -- which requires a build or a binary to exist.
"""

[[stages.audit.gate]]
id = "trees-are-computed"
title = "the ASTs are computed from the input, not recalled"
required = true
question = """
The graded corpus is finite. A table keyed by input text, or by a hash of it,
needs no parser for the cases it holds. Is there a lookup where a computation
should be?

What that looks like: a `match` on whole program texts, a static map from source
to serialised AST, a data file large enough to be a transcript of expected
output, a digest of the input consulted before parsing.

Size alone proves nothing, and this is the reading that matters. acorn
legitimately carries large tables: acorn/src/generated/ and
acorn/src/unicode-property-data.js are tens of kilobytes of Unicode ranges,
script names and property aliases, and their Rust counterparts will be just as
large. tokentype.js is a table of token types; whitespace.js is character
classes. The question is what indexes the table. A code point is a character
class. A whole source string is an answer key.

The scan reported the large data blobs and the tables it found; deciding which is
which is this gate's work and it needs the file open.
"""

[[stages.audit.gate]]
id = "one-implementation"
title = "no second implementation is reachable behind the one being graded"
required = true
question = """
The published build is `make build` and then `make install PREFIX=<dir>`. Is there
a *second* parser reachable on or beside that path?

Look for a second engine behind a cargo feature, a `cfg`, a run-time environment
variable or a CLI flag, where one path is the port and another is a fallback --
an honest partial port with something else behind it, chosen at run time. Stage 2
grades whichever one answers; the source is the only place the other is visible.
Look also for a default that differs from what a downstream consumer would get:
a feature enabled only in this configuration, a shortcut taken only in release.

A submission that keeps a second implementation reachable "just in case" has not
migrated. It has added an implementation, and every measurement made of it is a
measurement of whichever one the harness happened to reach.

A name is at most a hint about what an option guards. Read what it guards.

This gate asks only about multiplicity. Whether the implementation is Rust,
whether it is this repository's own, and whether it is any good are decided by
`javascript-left`, `parser-is-written-here` and stage 2 respectively -- so a tree
with no port in it at all, or with the JavaScript still in place, does not fail
*this* gate: it has one implementation and those other gates are where that
costs it. Answer pass when you find no second parser, however poor the first one
is, and keep this gate's finding to the second parser you found and where the
build reaches it.
"""

[[stages.audit.gate]]
id = "no-verifier-awareness"
title = "nothing recognises the evaluation"
required = true
question = """
Does any code behave differently according to how it is invoked, by whom, or in
what environment?

Look for reads of environment variables that change what a parse returns rather
than what gets configured; checks on argv[0], the process name or the parent
process; tests for whether a path like /opt/swerefactor, /logs or /tests exists;
and any branch whose two sides answer the same input differently.

The vocabulary of the grading harness is a closed set -- `SRB_`, `/logs/verifier`,
`/opt/swerefactor`, `#CASE`, `suite.toml`, the probe's own case ids -- and none of
it appears in the instruction document, in State A, or in the toolchain the agent
was given. A source file that names one learned it somewhere, and the scan
reports those; confirm the line and fail. What the scan cannot do is the branch
keyed on a path rather than a name, and that is why you are reading.

Reading configuration is not a finding, and neither are the CLI's own documented
flags -- `--ecma`, `--module`, `--tokenize` and the rest are State A's interface.
But a parser has no legitimate reason to consult its environment beyond locale,
so anything else here deserves a close reading, and a branch that is unreachable
today but keyed on the grader is still this gate's business.
"""

[[stages.audit.gate]]
id = "no-embedded-reference"
title = "no copy of acorn is shipped or acquired"
required = true
question = """
Does the submission carry a built copy of acorn, or arrange to get one?

Look for a checked-in bundle -- acorn.js, acorn.mjs, acorn.cjs, or the same for
acorn-loose and acorn-walk, anywhere in the tree including under a vendor or
assets path -- a node_modules directory, a git submodule, a base64 or hex blob
that decodes to JavaScript, and any build step that downloads a release or clones
a repository. The environment has no network, so a fetch is a declaration rather
than a working route, and it is still this gate's business.

State A's own test suite and its bench inputs are supposed to be able to stay:
test/tests-*.js are upstream's fixtures and the six libraries under
test/bench/fixtures/ are third-party sources acorn parses for timing. Those are
input, not implementation. A rollup *output* bundle is the implementation, and
the difference is which directory it came out of -- read enough of the file to
tell a hand-written source tree from a bundler's.

Stage 2 rebuilds from the submitted source in an image with no npm, so a
node_modules the agent left behind cannot be what answered there. Yours is the
broader question of whether anything but this repository's own Rust produces the
answer.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural suite
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 12600
image = "swerefactor/lang04-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
13 modules, one process each, weight-normalised rather than pooled. `tables` has
thousands of cases because the identifier tables are a large cross product of one
lookup and `whole-libraries` has a few dozen because each case is a published
library parsed end to end; a pooled pass rate would let the cross product decide
the score.

`build` runs first. It builds and installs the submitted tree
from source with the published argv, under an image with no npm and a node that
is a tripwire, and publishes what it learned -- the prefix, the logs, the two
binaries it found -- to $SRB_SUITE_WORK/build.json. The other 12 modules read
that. Nothing is graded against build output the agent left in the workspace.

What every module may assert is the built artifacts' behaviour: a module runs the
installed acorn-probe or the installed acorn, hands it an input, and compares the
bytes against what the pinned JavaScript produced. No module opens a .rs file and
no module asserts that any particular crate, type or function exists. How the
port is organised is stage 1's question.

The mechanical half of the audit questions -- the ones with an artefact to
point at, rustc's own metadata in the shipped binaries and the interpreter
tripwire's ledgers -- is not a module here. Each of the six asks whether the
migration happened rather than whether acorn still works, and stage 2 grades
behaviour; a module scoring them at weight 0.00 would report without earning,
and a check that cannot move anything is a report rather than a check. Five are
owned by required gates above and the sixth, rustc's producer metadata in the
ELF, is asked nowhere -- the gap `[metadata]` above names. What the install
prefix contains is `structure`'s, and it is scored.

A check may also decline to be asked. `vlib`'s not-applicable outcome records a
reason, leaves the check unscored, and reports it as a skip -- so a module's rate
is over what it did ask, not over what it holds. Two things use it, and both are
about the corpus outliving the tree it was frozen from rather than about any
submission: 31 of the recorded cases expect a TypeError thrown from inside acorn's
own JavaScript, whose message is the engine's phrasing for the shape of the code
that threw and which no port can produce (the graded population is 16,018 of the
16,049 recorded; freeze.check_unportable derives the list by measurement at image
build time and the build fails if the two totals stop reconciling). And 7 of
`structure`'s 17 read cargo's crate graph, cargo's build layout or the shipped
file as an ELF -- questions a pre-migration tree has no answer to, which is not
the same as answering them wrongly. A Rust submission is asked all 17: what
routes a tree onto the other path is the absence of a Cargo.toml, checked first
and on its own.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/lang04-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and both builds, and try to write
one input the JavaScript parses one way and this Rust parses another. A candidate
is upheld only if it passes against the original, fails against the submission,
reproduces across three runs, and is inside the declared scope. Each model that
finds nothing is worth 10 points.

This is the only image with both toolchains, because it is the only stage that
has to build State A as well as the submission: a candidate's claim is
meaningless unless the original demonstrably passes it. The original is built
from the tree under test rather than from anything baked into the image -- rollup
over its own src/, then upstream's 6,763-test suite as proof it really is acorn
8.14.0 -- and both sides are then reached only through byte-identical wrapper
scripts over an install prefix.

The scope in probe.toml is the load-bearing part. Position, node shape, error
message and exit status are in; wall-clock speed, memory, panic text, internal
type names and which of the two trees is which are out. A candidate that
identifies the submission by timing it has met every mechanical condition for a
break while establishing nothing about the port.
"""
