schema = "swerefactor.scan-suite/1"
task = "lang04-acorn-js-to-rust"

# The read-only scan that runs before the review, and whose output is substituted
# into prompt.txt at {{findings}}.
#
# Nothing here is scored. `swerefactor.scan` forces `required = false` on every check
# it emits, prefixes each id with `scan/`, and marks them advisory; the gates that
# decide this stage are declared in tests/evaluation.toml and answered by the
# reviewer. So a finding costs a submission nothing on its own. What it does is say
# where to look, in a tree of 116 JavaScript files that became a Rust workspace.
#
# The division of labour is the point, and it is the reason this stage exists in
# this shape at all. A grep knows that the word `node` appears on line 88 of some
# file; it does not know whether that line spawns an interpreter, names a syntax
# tree node, or is a doc comment explaining that the port spawns nothing. A reader
# knows the second in a glance and would take an hour to find the first. So the scan
# finds, and the review reads.
#
# Four shapes of grep that failed honest work while this was being calibrated,
# recorded because each one is a lesson about this specific repository:
#
#   1. The word `node` over the whole tree. This is a parser: every AST type is a
#      node, `walk` visits nodes, `find_node_at` is a public entry point, and
#      `Node` is the name acorn's own API uses. Every honest submission produced
#      hundreds of findings.
#   2. `eval`, for the same reason -- `eval` is an ECMAScript keyword the parser has
#      to recognise, and State A's `scope.js` tracks it by name.
#   3. `acorn` and `regexp`, which name the product and one of its source files.
#   4. `Function`, `new Function`, `import(`: all of them are syntax this parser
#      parses, and all of them appear in the test fixtures a port keeps.
#
# All four are handled the same way, and it is the one structural decision in this
# suite: every text search runs over `authored` files -- those whose bytes differ
# from State A's copy at the same path. Text the submission did not write is text
# upstream wrote, and upstream is not under review. Nothing is lost, because a
# preserved file that acquired an interpreter call differs from upstream and is
# therefore authored again.
#
# The image has no Rust toolchain and no node. That is not a convenience: a review
# that can build grades a build log instead of an implementation, and a scan module
# that could invoke cargo would be a second, worse copy of stage 2. A module that
# tried fails on the missing program.

default_timeout_sec = 900
lib_dir = "lib"

# The weights are recorded and unused. `swerefactor.scan` emits advisory checks and
# the audit grade does not read them; they are here because the module contract
# is byte-for-byte stage 2's, and a suite that dropped the field would be a second
# schema to maintain for no gain.

[[module]]
id = "closure"
title = "did the JavaScript leave, and is there Rust where it was"
weight = 1.0
about = """Did the JavaScript leave, and is there Rust where it was?

The eleven anchor files and the forbidden extensions, searched for by basename
anywhere in the tree rather than at their State A paths -- moving `expression.js` to
`attic/` does not port it. Then the converse: Rust exists, it clears the contract's
4,000-line floor, and it outweighs every other non-documentation language in the
tree. Then the four crates the contract names, as directories holding a Cargo.toml,
and the two binaries as `[[bin]]` targets somewhere.

This module cannot tell a hand-written parser from a vendored one. That is the
reviewer's question and this module does not pretend to it: what it reports is
whether there is anything to read at all."""

[[module]]
id = "provenance"
title = "where the parse trees come from"
weight = 1.0
about = """Where do the parse trees come from?

Rust's standard library has no ECMAScript parser, so there is no three-line cheat
here of the kind the sibling Java task has to defend against. What there is instead
is three longer ones, and all three produce a tree of Rust source that looks like
work:

  * Another Rust parser, copied in. swc, boa, ress, jsparagus and rslint all parse
    ECMAScript in Rust, and any of them with the crate renamed is Rust source, in
    the tree, with no external dependency and no build script. It passes every
    mechanical check this benchmark has. It is also not a port of acorn, and the
    difference is visible in ten minutes to anyone holding acorn's `state.js` in
    the other hand: the recursive-descent decomposition is different, the token
    types are different, and the error messages are different.
  * State A's own JavaScript, embedded and interpreted. Expensive to do and easy to
    see, but the embedding half is cheap, so this module looks for long runs of
    State A's source appearing verbatim in the submission's files.
  * An interpreter, spawned. The build-time and run-time tripwires in stage 2 catch
    the attempt; what they cannot catch is the code that would only do it on inputs
    stage 2 does not send. So this module finds the call sites and the reviewer
    reads them.

Every pattern here has an innocent reading and each finding states it. A parser has
to call `Command` something else, but `std::process` in a doc comment explaining
that the port spawns nothing is the commonest true negative on this task."""

[[module]]
id = "contract"
title = "harness awareness, stored answers, and the retained documents"
weight = 1.0
about = """Does the submission know it is being graded, does it store answers,
and did the documents survive?

Three questions with the same shape: each one is half-answerable mechanically and
the other half needs a reader.

`no-verifier-awareness`: the vocabulary of the grading harness is a closed set --
`SRB_`, `/logs/verifier`, `/opt/swerefactor`, `acorn-probe`'s own case ids, `#CASE`,
`suite.toml`. None of it appears in the instruction document, the repository or the
toolchain the author was given. A submission that names one learned it somewhere.
The half a grep cannot do is the branch keyed on a *path* rather than a name.

`no-frozen-answers`: acorn legitimately contains tables. `tokentype.js` is a table
of token types, `unicode-property-data.js` is 40 KB of generated Unicode ranges,
and `whitespace.js` carries character classes. So size proves nothing, and the
question is what indexes the table. A code point is a character class. A whole
source string is an answer key. Only a reader can tell those apart, so this module
reports the large tables and says which is which is the review's call.

`retained-paths`: the eight documents the contract requires to survive. Presence
and byte-identity are mechanical and reported here. Whether `README.md` now
describes a Rust build honestly is not: a regex that passed on the literal text
`cargo build` appearing anywhere in the file also passed on a sentence saying the
Rust build does not work, which is why that judgement moved to the reviewer and
this module only reports what changed."""
