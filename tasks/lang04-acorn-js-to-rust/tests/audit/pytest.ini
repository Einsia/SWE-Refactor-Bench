; Shared by every scan module; passed explicitly with -c so a module's rootdir can
; be its own directory without losing these settings.
;
; No `timeout` plugin here, unlike stage 2's: a scan reads files and cannot wait on a
; socket, so the module timeout in scan.toml is the only clock that matters and a
; per-test one would be a dependency for nothing.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate
    srb_skip_ok: a skip of this check is licensed rather than a miss (see below)

; `srb_skip_ok` is declared here as well as by `swerefactor.pytest_module`, which
; registers it at pytest_configure time.  The duplicate is deliberate: with
; `--strict-markers` above, any invocation that does *not* load the harness plugin
; treats the marker as unknown and errors out at collection.  lib/collect-check.sh
; is exactly such an invocation -- it collects with `-p srbscan` alone -- so without
; this line the marker would turn a passing collect check into a failure.
;
; Measured on this image's pytest 8.3.4: deleting the line above takes
; lib/collect-check.sh from `ok, 155 checks collected` to `'srb_skip_ok' not found in
; markers configuration` and `the scan does not collect`, rc 1.  Note the failure is
; version-dependent -- pytest 9.0.3 honours `--strict-markers` from the command line
; but only warns for it from `addopts`, so the same deletion there collects 155 and
; exits 0.  A pytest bump can therefore retire this guard without any test going red,
; which is the reason to keep the line rather than rely on the strictness.

filterwarnings =
    default
