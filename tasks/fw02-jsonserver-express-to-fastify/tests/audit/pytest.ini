; Shared by every scan module; passed explicitly with -c so a module's rootdir
; can be its own directory without losing these settings.
;
; No timeout plugin here, unlike stage 2's: a scan opens files and cannot wait on
; a socket, so the module timeout in scan.toml is the only clock that matters and
; a per-test one would be a dependency bought for nothing.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate
    ; Applied to every `scan` item by srbscan's collection hook, and declared here
    ; because --strict-markers is on and this suite is collected in two different
    ; contexts.  `swerefactor.pytest_module` registers it too, for the run where the
    ; recorder is loaded; lib/collect-check.sh deliberately runs without the
    ; recorder, and the marker has to exist there as well or the build self-check
    ; dies on a marker it can see being applied.
    srb_skip_ok: a skip of this check is neutral -- it did not apply, it did not miss

filterwarnings =
    default
