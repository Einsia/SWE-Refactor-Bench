; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be its own directory without losing these settings.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Individual comparisons are a socket round-trip and a dict diff, but a few tests
; wait on the server rather than on themselves: the `--delay 150` session pauses
; before every response, the concurrency proof fires overlapping requests, and a
; module that boots its own server pays the startup cost inside the first test.
; 300s per test leaves room for those without letting one hung request consume a
; module's whole budget.
timeout = 300
timeout_method = thread

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=15

markers =
    behaviour: State A behaviour must survive the migration
    migration: the new stack really replaced the old one
    slow: deliberately waits on the server

filterwarnings =
    default
