schema = "swerefactor.scan-suite/1"
task = "fw06-uploadserver-gorillamux-to-nethttp"

# The read-only scan that runs before the review and hands it its findings.
#
# The gate for this task is the six prose questions in evaluation.toml, answered
# by a model that has both trees mounted and no toolchain to build either.  This
# suite exists to spend that model's turns well: it answers, mechanically, the
# sub-questions a text search can answer, so the reviewer can spend its budget on
# the ones it cannot -- above all "is this ServeMux dispatching, or is it a
# hand-written matcher behind one pattern", which no token scan will ever settle.
#
# Every check is recorded with required = false.  `scoring.grade_audit` gates
# on required checks only, and the required checks are the prose gates.  So a scan
# finding costs a submission nothing by itself; what it does is put a file and a
# line number in front of a reviewer that has the file open.  A clean scan is not
# a pass, and the prompt says so in those words.
#
# The asymmetry is deliberate and it is the reason these checks are here rather
# than in stage 2.  Stage 2 builds the submission and compares what it answers
# against a recording of the original; a check in stage 2 that opens a .go file
# and looks for `PathPrefix` is asserting on the implementation with points
# attached, and it is wrong in both directions
# -- it fires on a comment explaining what PathPrefix did upstream, and it stays
# silent on a hand-copied route table that imports nothing.  Same observation, no
# verdict, no points: that is what this stage is for.
#
# This task's own reason for insisting on it.  Score a regex for commented-out
# `mux.NewRouter|\.HandleFunc\(|\.PathPrefix\(` as a gate called "no stale router
# scaffolding left behind", and it fails in both directions at once.  It fails an
# honest submission that left a comment saying `// upstream used
# PathPrefix("/files") here, which is a string prefix -- see the fallback below`,
# which is exactly the comment a careful port should write.  And it passes a
# submission that reimplemented the router, because a reimplementation has no
# reason to mention the name it replaced.  The observation is worth having;
# scoring on it is not.
#
# Weights are recorded and unused: nothing here is scored.  They are kept so a
# module could move to a scored stage without a rewrite, which is also why the
# module contract is byte-for-byte stage 2's -- same env vars, same result schema,
# same runner.

default_timeout_sec = 600
lib_dir = "lib"

[metadata]
runtime = "python3.11"
about = """
Advisory.  No check in this suite can fail the audit gate.  The three modules
read `SRB_REPO` and `SRB_ORIGINAL`, parse text, and write findings; there is no Go
toolchain in this image and no module mirror, so nothing here can resolve, build,
link or run either tree.  Anything that needs a running program is stage 2's, and
anything that needs both programs running at once is stage 3's.

Calibrated against the pre-migration tree.  `dispatch` and `provenance` are silent
on State A end to end, and every one of `closure`'s retired-router checks fires on
it.  A check that reports something on an unmodified repository is a check that
teaches the reviewer to skim, so the three that did were narrowed until they went
quiet: a bare `router` token sweep, which matched upstream's own `r := mux.
NewRouter()` line and its README; a "handler count" heuristic, which counted
State A's five `PathPrefix` registrations as five handlers; and a `/files` literal
sweep, which fired 40-odd times on the original's own tests and would fire on any
correct port for the same reason -- the string is in the contract.
"""

[[module]]
id = "closure"
title = "the retired router in the tree and in what the tree declares"
weight = 1.0
about = """
Ordered by how much of the answer each observation can carry.  First the import
blocks, parsed rather than grepped, split into delivered source and test files
because a stale test and a live dependency are different findings.  Then the
module graph: require lines with their direct/indirect kind, go.sum pins, vendored
copies, replace directives, and the whole banned-router list rather than only the
one module State A used -- this task retires the category.  Then two derived
comparisons against the original: did the dependency set change at all, and is the
module path still the same.  Then the structural check, which looks for the
retired router's shape rebuilt under new names, because a router that was renamed
rather than retired imports nothing.  The token sweep is last and weakest on
purpose: it reads text the compiler may never see.
"""

[[module]]
id = "dispatch"
title = "where routing is registered, and what does the registering"
weight = 1.0
about = """
The module that reads the thirteen lines the task is about.  It locates every
plausible dispatch registration -- ServeMux construction, `Handle`/`HandleFunc`
calls with their pattern literals, `http.Handle` on the default mux, a
`Handler:` field on an `http.Server` -- and reports the patterns as written, with
line numbers, without judging them.  It counts how many distinct patterns exist
and how many carry a method prefix, because "one pattern and a `switch r.Method`
inside it" and "eight patterns" are the two shapes the `dispatch_is_rehosted`
gate has to tell apart, and the count is the fact the reviewer would otherwise
spend turns assembling by hand.

Then the prefix question, reported as evidence and never as a verdict: which
files contain a string-prefix test against a `/files`-like literal, which contain
a path literal the corpus also contains, and whether any file holds three or more
distinct request-path literals in one collection -- the shape a lookup table has.
A correct port trips the first of those by construction, which is why the module
description says so and the prompt repeats it.
"""

[[module]]
id = "provenance"
title = "code addressed to the grader, and the repository's own suite"
weight = 1.0
about = """
Whether the submission knows it is being measured.  The harness's own vocabulary
and paths; Go's idioms for detecting a test binary; environment lookups the
original did not make, which matter here because this server is configured by
flags and a JSON file, so a bare `os.Getenv` on the request path is a setting
nobody declared.  Then whether the program answers or delegates -- outbound HTTP
clients, reverse proxies, shelling out -- and whether it computes or recites:
status-code literals paired with path literals, and embedded data shaped like
recorded traffic.  Last, two checks on the repository's own suite, which stage 2
runs: test functions deleted, and test functions kept but skipped or emptied.
"""
