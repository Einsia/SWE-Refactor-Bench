schema = "swerefactor.verification-probe/1"
task = "fw06-uploadserver-gorillamux-to-nethttp"
prompt = "prompt.txt"

# One candidate is a pytest file speaking raw HTTP to a server this script built
# and booted from the tree under test.  Both trees are built the same way, from
# their own `go.mod` against their own module mirror, and served on loopback with
# the same four flag profiles; a candidate is a black-box HTTP test and has no way
# to tell the trees apart except by the bytes they answer with.
candidate_command = ["bash", "/tests/verification/run-candidate.sh"]

# --------------------------------------------------------------------------- #
# What a candidate may attack
# --------------------------------------------------------------------------- #
# Without this the round is unwinnable and therefore says nothing: any two HTTP
# servers differ somewhere.  The allow list is this server's public contract as
# instruction.md states it; the deny list is what instruction.md says is not
# compared.  The two documents have to agree.  A scope forbidding what the
# instruction promised makes the task unwinnable; a scope permitting what the
# instruction excluded makes it unlosable.
[scope]
allow = [
  "the status code, headers and body of any request to any path, including paths that match no route",
  "the exact 404 body, and that it differs depending on whether the router or the files handler produced it",
  "how the /files prefix is matched: this server's prefix is a STRING prefix, not a path-segment prefix, so /filesabc reaches the files handler and /file does not",
  "the 405 surface: which method/path pairs answer 405 rather than 404, and what headers accompany it",
  "path cleaning: the 301 redirect for a path that is not already clean, its Location, and that its body is empty",
  "percent-encoding in paths: %2F, %00, unicode, and whether a target resolves to the file its decoded form names",
  "authentication under -enable_auth: 401 versus 404 versus 405, the read-only and read-write token split, where the credential may be presented, and that auth runs AFTER route matching so an unmatched path is never a 401",
  "CORS under -enable_cors and -enable_cors=false, including which headers the OPTIONS handler writes unconditionally",
  "GET and HEAD on files: Content-Type, Content-Length, Last-Modified, Accept-Ranges, ETag if present, and the body byte for byte",
  "conditional requests: If-Modified-Since, If-None-Match, and the 304 body and header set",
  "range requests: single, suffix, open-ended, unsatisfiable, and multi-range multipart/byteranges responses including the part headers",
  "directory handling: a GET of a directory, of the docroot itself, and of a path with and without a trailing slash",
  "uploads: PUT and POST multipart, the 201 and its Location, the filename actually written to disk, collision behaviour, and the 409",
  "upload rejection under -max_upload_size, including the state of the file on disk after a rejected upload and what a retry answers",
  "the read-only versus read-write token split: which methods each token class may use, and the status a read-only token gets for a write",
  "the flag surface itself: that a documented flag is accepted, and that its absence and presence produce the two behaviours the original produced",
]
deny = [
  "the Date header, and any header the Go runtime emits without the application asking",
  "HTTP reason phrases",
  "header name casing",
  "the order of distinct header names, unless the original's order is itself the thing being asserted and the case says so",
  "wall-clock timing, request duration, and the value of any Last-Modified belonging to a file the run itself created",
  "the exact bytes of a multipart/byteranges boundary, which Go generates randomly per response",
  "log output, on stdout or stderr, in any format",
  "anything requiring the retired router to be installed, importable or nameable in the submission",
  "the internal structure of the submission: file layout, package names, type and function names, how dispatch is implemented",
  "behaviour under a request the original also mishandles -- a candidate must pass on the original",
  "the identity of the tree under test, however it is learned: the harness environment, the paths a candidate is handed, the presence of a file only one of the two trees can have, or anything else that answers 'am I on the original?' without asking the artifact a question. Such a candidate meets every mechanical condition for a break -- it passes on the original, fails on the submission and reproduces exactly -- while establishing nothing about the migration, and it is rejected on sight rather than weighed.",
]

# Three reruns.  Nothing in this server's graded surface is timing-dependent, but
# uploads mutate a docroot and a candidate that assumed a clean one would pass or
# fail depending on what ran before it.  A flake that costs a submission five
# points is a bug in the benchmark, not a finding.
reruns = 3
require_deterministic = true
network_allowed = false

[metadata]
# Build + boot four servers + pytest, for one candidate, on one tree.  The build
# is cached per tree, so only the first candidate of a round pays for it; the
# servers are not cached, because uploads mutate state.
candidate_timeout_sec = 600.0
run_timeout_sec = 240.0
# The adversary reads code with the same read-only toolbox the stage-1 reviewer
# gets.  It does not get a shell: `try_test` is how it runs things, and a
# candidate that has to be executed differently is out of scope by construction.
allowed_commands = []
about = """
Six rounds, each an independent attempt to find one request the original
answers correctly and the submission does not. A round that finds nothing pays
the submission 10 points; a round that errors pays nothing and is reported as an
error rather than as either verdict.

Every round gets four servers, one per flag profile, because this server's
behaviour is flag-dependent and a candidate confined to the default configuration
could not attack -enable_auth or -max_upload_size at all.
"""

# --------------------------------------------------------------------------- #
# The six adversaries
# --------------------------------------------------------------------------- #
# Six *rounds*, not necessarily six distinct vendors: what stage 3 measures
# is how much scrutiny the submission survives, and an independent attempt is an
# independent attempt whether or not it shares a model with another.  Ids name the
# round, so two rounds on one model with different briefs stay distinguishable.
#
# `focus` is metadata, appended to the round's opening.  Six unguided rounds
# converge on the same two or three obvious requests; six pointed ones cover
# the surface.  It is a hint about where to look, never a list of tests to write.
#
# The assignments are drawn from where this migration can actually go wrong, which
# is not evenly spread.  Four rounds are pointed at dispatch, because replacing a
# string-prefix router with a segment-based one is the whole task and every one of
# its consequences is a separate way to be wrong.

[[adversary]]
id = "a01-prefix-matching-and-not-found"
model = "gpt-5.6-sol"
driver = "openai"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "high"
[adversary.metadata]
focus = """
how the /files prefix is matched. The original's prefix is a string prefix, so
a path that merely starts with those six characters reaches the files handler.
Find the paths where a segment-based router would disagree, in both directions
-- ones it would reject that the original accepts, and ones it would accept
that the original rejects.

Then the two different 404s. A request that matched no route and a request
that matched the files handler but named nothing produce different bodies and
different header sets. Find paths that swap which one you get.
"""

[[adversary]]
id = "a02-method-not-allowed-and-path-cleaning"
model = "gpt-5.6-terra"
driver = "openai"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "high"
[adversary.metadata]
focus = """
the 405 surface: which method and path combinations answer 405 rather than 404
or 200, on /files, on /upload, on the bare prefix, on the root, and on paths
that match a route by prefix but not by method.

Then path cleaning and redirects: double slashes, dot and dot-dot segments,
trailing slashes, the docroot itself, and what the redirect's status, Location
and body are. Check whether cleaning happens before or after route matching,
and before or after authentication.
"""

[[adversary]]
id = "a03-percent-encoding-and-auth-ordering"
model = "gpt-5.6-luna"
driver = "openai"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "max"
[adversary.metadata]
focus = """
percent-encoding: %2F inside a filename, %00, encoded dot-dot, unicode, and
mixed case escapes. Whether the router matched on the raw or the decoded path
is observable, and the two answers differ.

Then authentication under -enable_auth: the ordering against route matching
and against path cleaning, the read-only versus read-write token split, every
place a credential may be presented, and which unmatched or wrong-method paths
answer 401 rather than 404 or 405.
"""

[[adversary]]
id = "a04-conditional-range-and-uploads"
model = "claude-sonnet-5"
driver = "anthropic"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "high"
[adversary.metadata]
focus = """
conditional and range requests on the fixture files: If-Modified-Since and If-
None-Match, the 304's header set and empty body, suffix and open-ended and
unsatisfiable ranges, and multi-range responses including the part headers
inside the multipart body.

Then uploads: PUT versus POST, what the multipart part's filename does versus
the target path, the 201 and its Location, collisions and the 409, odd
filenames, empty bodies, and a body that is not multipart at all.
"""

[[adversary]]
id = "a05-upload-limits-and-cors"
model = "claude-opus-5"
driver = "anthropic"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "medium"
[adversary.metadata]
focus = """
-max_upload_size: what a rejected upload leaves on disk, what a retry of it
answers, whether the limit is applied before or during the copy, and how it
interacts with authentication and with a target that already exists.

Then CORS with the flag on and off, and the OPTIONS handler: which headers it
writes in each configuration, on which paths, and whether any of them are
written outside the flag's control. Check OPTIONS on paths that match no route
as well as on ones that do.
"""

[[adversary]]
id = "a06-file-serving-and-open"
model = "claude-opus-5"
driver = "anthropic"
budget_sec = 3600.0
[adversary.driver_options]
reasoning_effort = "high"
[adversary.metadata]
focus = """
serving the fixture files themselves: Content-Type for each extension
including the ones with no extension and the binary one, HEAD versus GET,
directories with and without a trailing slash, a file whose name contains a
space or a plus, and the exact bytes of each body.

Then, with whatever budget remains, nothing in particular -- read the original
and follow what looks weakest. The other five rounds were told where to look,
so this tail is where anything they were not told about has to be found.
"""
