; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be its own directory without losing these settings.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Per-test, thread-based.  A submission that hangs on one request must lose that
; case, not the module: the default (signal) method cannot interrupt a blocking
; socket read, and every request in this suite is a blocking read on a raw socket
; because `harness.wire` writes the request line by hand.  300s is generous for a
; single request and still far below any module's own timeout.
timeout = 300
timeout_method = thread

; `--maxfail` is deliberately absent.  A module's score is a pass ratio, so
; stopping early would truncate the denominator and hand a badly broken
; submission a better score than a nearly-correct one.
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=15

; No family markers.  A marker that decides a weight is a marker that can be
; forgotten on a new test; the module boundary carries the weight instead.
markers =
    slow: deliberately waits on something slow

; A DeprecationWarning from the grader's own code is a grader bug and should stop
; the run rather than scroll past.
filterwarnings =
    error::DeprecationWarning
    default
