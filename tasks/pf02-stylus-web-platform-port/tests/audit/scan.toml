schema = "swerefactor.scan-suite/1"
task = "pf02-stylus-web-platform-port"

# The read-only scan that runs before the review and hands it its findings.
#
# Everything here reads and nothing here scores.  `swerefactor.scan` records every
# check with required = false, and `grade_audit` gates on the required
# checks -- the seven prose gates in evaluation.toml and nothing else.  A scan
# finding costs a submission nothing on its own.  What it does is tell the reviewer
# where to look, and the reviewer has both trees open.
#
# That is the reason a string match belongs here rather than in the stage that
# scores.  `readFileSync` in a doc comment explaining what the capability object
# replaced is not Node creeping back in; a POSIX path module named `path.js` is not
# Node's `path`.  Both are worth having in front of a reviewer.  Neither is a
# verdict, and only reading tells you which one you have.
#
# The division with stage 2 runs the other way: nothing here can be answered by
# running something.  Withdrawing the mount the built-in library lives at and
# seeing whether `abs(-5px)` still compiles is a question about behaviour, and it
# is `tests/behavioural/modules/platform/`.
#
# Weights are recorded and unused: nothing here is scored.  They are kept so a
# module could move to a scored stage without a rewrite, which is the same reason
# the module contract is byte-for-byte stage 2's.

default_timeout_sec = 600
lib_dir = "lib"

[metadata]
runtime = "python3.11"
about = """
Advisory. No check in this suite can fail the audit gate; the gate is the
seven prose questions in evaluation.toml, answered by a model that reads both
trees. These modules answer the sub-questions a string can answer, so that the
reviewer spends its turns on the ones a string cannot -- above all the one that
defeats every check here: a core that imports nothing and receives `fs` through a
module-level singleton the adapter assigns on startup.
"""

[[module]]
id = "closure"
title = "where the core's dependency graph ends up"
weight = 1.0
about = """
Built-in specifiers, bare package specifiers, Node globals one row at a time,
fs-shaped `*Sync` names, computed dynamic imports, the module system, and which
way the arrow between core and adapter points. Reads `SRB_REPO`; loads nothing.
Every check here passes most easily on an empty directory, which is why the last
one asks whether the adapter names any Node facility at all.
"""

[[module]]
id = "entrypoint"
title = "what the package publishes, and how many implementations are behind it"
weight = 1.0
about = """
The retired `lib/` tree, who still imports it, the root `index.js`, the exports
map, `bin/stylus` and its mode bit, and near-duplicate file pairs within `src/`
and across `src/` and `lib/`. Stage 2 measures that the compiler answers
correctly; which copy of the code answered is read here.
"""

[[module]]
id = "frozen"
title = "the things §3 freezes, by digest"
weight = 1.0
about = """
Byte equality against State A for the seven upstream subtrees under `test/` and
for every upstream file in it, plus package identity, the five dependencies and
the top-level documents. `test/run.js` is the one file a legal port may rewrite,
so it is counted rather than digested: assertions, directory listing, option
rules, declared suites, and the ways to return early it did not have before.
"""

[[module]]
id = "provenance"
title = "code addressed to the grader"
weight = 1.0
about = """
Test and CI state, this benchmark's own identifiers, the verifier's paths,
corpus-shaped files under the core, 4000-character lines, and the two shim shapes
§2.3 names by hand. The behavioural half of this question -- a nonce selector no
table can hold, and the same import mounted at two paths -- is stage 2's, because
no amount of reading tells you what a function will return.
"""
