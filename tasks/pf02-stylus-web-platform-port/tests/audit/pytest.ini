; Shared by every scan module; passed explicitly with -c so a module's rootdir
; can be its own directory without losing these settings.
;
; No `timeout` plugin here, unlike stage 2's: a scan reads files and cannot wait
; on a socket or a compile, so the module timeout in scan.toml is the only clock
; that matters and a per-test one would be a dependency for nothing.
;
; Nor is there an `srb_weight` marker.  Stage 2 has one because its checks are
; scored and the weights normalise across modules of very different sizes; nothing
; in this suite is scored, so a weight here would be a number with no reader.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf

; `srb_skip_ok` is declared here as well as by `swerefactor.pytest_module`, which
; registers it when it is loaded.  Both, because `srbscan` applies it to every
; collected item and `--strict-markers` is on: running a module by hand without
; `-p swerefactor.pytest_module` would otherwise fail collection on an unknown
; marker, and the whole reason this suite is runnable outside its image is that
; every check in it was swept for false positives that way.
markers =
    scan: a mechanical observation, advisory -- evidence for the review, not a gate
    srb_skip_ok: applied to everything here; see srbscan.pytest_collection_modifyitems

filterwarnings =
    default
