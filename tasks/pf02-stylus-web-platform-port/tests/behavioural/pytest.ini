[pytest]
# One config for every module in the suite: run-pytest.sh passes it explicitly
# with -c, so a module directory does not need its own and cannot drift from the
# others.  Markers are strict because a typo in `srb_requird` is otherwise a
# check that silently stops being required.
#
# `-m "not harness"` is the important line.  A `harness` test asks State A about a
# premise the checks around it depend on -- "compress really does change this
# output", "these two option rows really do differ" -- and consults the submission
# not at all.  Left in the graded run they would pay the same credit to every
# submission alike, including one that compiled nothing: fifteen free passes in a
# module of sixty is a floor of a quarter for turning up.  So they are deselected
# here, which keeps them out of the report and out of the denominator, and the
# image build runs them on their own with `-m harness`.  A broken premise fails to
# build the image rather than quietly scoring every submission a little higher.
timeout = 900
timeout_method = thread
addopts = -m "not harness" --strict-markers --tb=short -p no:cacheprovider -q --no-header -rf --durations=15

markers =
    srb_weight(value): 0 to report a check without scoring it, default 1.0
    srb_skip_ok: a skip here is licensed by the suite contract
    srb_group(name): a sub-group label carried into the report
    harness: a premise this suite depends on, asked of State A alone -- deselected
        from the graded run, checked at image build time
