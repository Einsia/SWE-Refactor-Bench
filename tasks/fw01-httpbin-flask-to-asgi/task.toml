# =============================================================================
# SWERefactorBench -- framework rewrite (flagship)
#
#   State A : httpbin 0.10.2 on Flask 2.2.5 / Werkzeug 2.2.3 / flasgger,
#             served by gunicorn -k gevent (WSGI, synchronous).
#   State B : the same product on Starlette 0.41.3 served by uvicorn
#             (ASGI3, natively asynchronous), with the Swagger 2.0 document
#             generated by first-party code.
#
# The agent edits /workspace/repo in place.  Harbor collects that directory as
# an artifact, destroys the agent container, and re-materialises the repository
# inside independent verifier containers that the agent never touches and whose
# tests/ tree the agent never sees.
#
# Anything the agent installed is deliberately NOT carried over: stage 2
# reinstalls the project offline from its own wheelhouse -- a wheelhouse that
# contains no flask, werkzeug, flasgger, gunicorn, gevent, asgiref or a2wsgi.
# A submission that did not really migrate cannot even be installed there.
#
# Grading is the benchmark's three-stage ladder, declared in tests/evaluation.toml
# and applied by score.py:
#
#   1. an audit review, done by a model reading State A against the
#      submission, five gates, all required.  Failing one is a zero and nothing
#      after it runs.
#   2. twelve behavioural modules, 40 points, paid only for a submission that
#      passed every scored check in every one of them.  Short of that the
#      ladder stops here with nothing from this stage.
#   3. six adversaries with an hour each to write a test the old service passes
#      and this one fails.  60 points, 10 for every adversary that finds nothing.
#
# What each stage may know is as deliberate as what it measures.  Stage 1 has no
# build toolchain, because a review that can build grades a build log instead of
# an implementation.  Stage 2 has one wheelhouse, the target one, so installing
# is itself evidence.  Stage 3 is the only image that can build either stack,
# because "the original passes this test" is a claim that has to be executed.
# =============================================================================

schema_version = "1.4"

# ---------------------------------------------------------------------------
# Collected from the agent container, re-materialised at the same absolute path
# inside the separate verifier container.
#
# The exclusions drop build/install debris only.  They exist so the verifier
# cannot be handed a pre-built environment or stale bytecode and be fooled into
# importing something the submitted *source* no longer contains.  Solutions must
# therefore live in tracked source files, never inside these paths -- a rule
# instruction.md states explicitly.
# ---------------------------------------------------------------------------
[[artifacts]]
source = "/workspace/repo"
exclude = [
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.egg-info",
    ".venv",
    "venv",
    "env",
    ".tox",
    ".nox",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "wheelhouse",
    "*.whl",
]

[task]
name = "swerefactor/fw01-httpbin-flask-to-asgi"
description = "Migrate httpbin 0.10.2 off Flask/Werkzeug/flasgger/gunicorn-gevent onto a native ASGI stack (Starlette + uvicorn), repository-wide, preserving byte-exact HTTP behaviour and the official release artifacts."
authors = []
keywords = [
    "swe-refactor",
    "framework-migration",
    "python",
    "flask",
    "werkzeug",
    "starlette",
    "asgi",
    "wsgi",
    "httpbin",
    "offline",
]

[metadata]
category = "framework-rewrite"
difficulty = "frontier"
# httpbin ships LICENSE as a pointer to two full texts beside it, LICENSE.ISC and
# LICENSE.MIT, and lets the recipient pick.  OR, not AND.
license = "ISC OR MIT"
source_repository = "https://github.com/psf/httpbin"
source_commit = "888754822b81c9d8f1202a079c207ce8d9b8c037"
source_version = "0.10.2"
state_a = "flask-2.2.5 + werkzeug-2.2.3 + flasgger-0.9.7.1 + gunicorn-21.2.0/gevent (WSGI)"
state_b = "starlette-0.41.3 + uvicorn-0.32.1 (ASGI3)"
tags = [
    "whole-repository",
    "framework-rewrite",
    "sync-to-async",
    "wsgi-to-asgi",
    "http-contract",
    "release-closure",
    "anti-cheat-gated",
]

# ---------------------------------------------------------------------------
# Agent phase
#
# 9h wall clock: ~80 endpoints have to be reproduced to the byte, the whole
# Werkzeug authentication-header surface has to be reimplemented, flasgger has
# to be replaced by a first-party Swagger 2.0 generator, and the release
# closure (pyproject/requirements/Dockerfile/Procfile/httpbin.bash/tox/CI) has
# to follow.  The State A oracle is available locally for differential
# testing, so the time is spent on engineering rather than on guessing.
#
# no-network: every dependency the target stack is allowed to use is already
# in /opt/wheelhouse.  Offline is what makes "the old stack left the dependency
# closure" a mechanical fact instead of a code-review opinion.
# ---------------------------------------------------------------------------
[agent]
harness = "codex-cli 0.146.0"
timeout_sec = 32400.0
network_mode = "no-network"

[environment]
build_timeout_sec = 5400.0
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/workspace/repo"

[environment.env]
TZ = "UTC"
LC_ALL = "C.UTF-8"
PYTHONUNBUFFERED = "1"
PIP_NO_INDEX = "1"
PIP_FIND_LINKS = "/opt/wheelhouse"
HTTPBIN_ORACLE_URL = "http://127.0.0.1:8899"

# ---------------------------------------------------------------------------
# Verifier phase
#
# environment_mode = "separate" + [verifier.environment] means tests/ becomes
# the build context of the verifier image and Harbor does not upload it to the
# agent container.  That is what keeps the suite invisible.
#
# The timeout covers the whole ladder, whose own budgets in tests/evaluation.toml
# are 5400 + 10800 + 54000 = 70200s.  The margin above that is for building three
# images and for the ladder's own overhead, and it is a ceiling rather than an
# expectation: most submissions never reach stage 3, because stage 1 zeroed them
# or stage 2 came in short of full marks.  A run that does reach it is spending most
# of its day there -- six adversaries with an hour each, sequentially, so a
# candidate cannot be broken by whatever the previous one did to the server.
#
# Stage 3's budget is deliberately not 6 * 3600: an adversary that concludes
# early returns early, and the hour is a limit on one round rather than a quota
# to be spent.
# ---------------------------------------------------------------------------
[verifier]
timeout_sec = 75600.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 5400.0
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
TZ = "UTC"
LC_ALL = "C.UTF-8"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PIP_NO_INDEX = "1"
PIP_FIND_LINKS = "/opt/wheelhouse"
# Where the shared grader lives inside every stage image, and where the three
# stages agree to leave their result files.  score.py reads the second from
# evaluation.toml, so this only has to hold for a stage invoked by hand.
SRB_INFRA = "/opt/swerefactor"
SRB_RESULTS = "/logs/verifier"

# There is deliberately no solution/ tree and no [solution.env].  A reference
# implementation in the task directory is a thing that has to be kept correct
# against every future change to the suite, and its only consumer would be a
# smoke test that the suite can be passed at all.  The suite's own gate answers
# that: stage 3 is asked only of a submission that scored stage 2 in full, so a
# tree that reaches it has already passed every recorded check.  What six models
# add is the other half -- an hour each spent hunting for a behaviour nobody
# thought to record.
