schema = "swerefactor.evaluation/1"
task = "fw01-httpbin-flask-to-asgi"
title = "httpbin: Flask/WSGI to native ASGI"
results_dir = "/logs/verifier"

# The published ladder. Stage 1 is pass/fail and a failure is the whole score;
# stage 2 is worth 40 and pays only for every scored check, which is also what
# stage 3 is asked of; stage 3 pays 10 points for each of 6 adversaries that
# fails to break the submission.
[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it: the points are paid only for a submission that
# passed every scored check, and stage 3 is asked only of the same submission.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "framework-rewrite"
state_a = "flask 2.2.5 + werkzeug 2.2.3 + flasgger 0.9.7.1 + gunicorn 21.2.0/gevent"
state_b = "starlette 0.41.3 + uvicorn 0.32.1, no adapter layer"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Five gates, all required. Each is a question about how the code works, which
# is why the review is done by a model reading both trees rather than by a list
# of forbidden tokens: "does not contain the string 'flask'" is satisfiable
# without migrating anything, and the list of strings doubles as a map of what to
# rename.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"
# A read-only scan runs before the review and its output is substituted into
# {{findings}} in the prompt. 106 mechanical observations -- imports by AST,
# vendored source markers, WSGI tokens, manifest contents, entry-point text,
# code addressed to the grader -- none of them scored. `swerefactor.scan` records
# every check with required = false, and `grade_audit` gates on the required
# checks, which are the five gates below and nothing else.
#
# Scoring them is what the arrangement is against, and two shapes say why: a
# submission that names `PATH_INFO` in a comment, and one that serves Swagger
# assets from a directory whose name contains "flasgger". Both are worth looking
# at. Neither is a verdict, because the same string means "the protocol came back"
# in one file and "here is why this is gone" in another, and only reading tells you
# which. So the scan says where to look and the reviewer, who has both trees open,
# says what it means.
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
allowed_commands = []
# Each stage is its own image because each needs a different thing to be true of
# it: this one has no build toolchain at all (a review that can build grades a
# build log), stage 2 has one wheelhouse in which the old stack is uninstallable,
# stage 3 is the only one that can install either stack. `context` is the build
# context, relative to this file; `image` is the tag the runner is expected to use.
image = "swerefactor/fw01-audit:1"
context = "audit"

# Reasoning effort is named here rather than in the runner because it is part of
# the published policy: stage 1 is one model at medium effort, three times, and a
# review run at a different effort is not the same measurement.  Where the model
# is reached from -- base URL, and any headers the endpoint demands -- is not
# here on purpose; that belongs to whoever holds the key.
[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.
"""

[[stages.audit.gate]]
id = "old_stack_retired"
title = "Flask and Werkzeug are gone, not renamed or vendored"
required = true
question = """
Did the old framework's *code* survive in the submission, under a new name or in a
new place? One standard, about provenance and shape -- not about behaviour.

A finding is: the package copied into the tree under a different directory or
module name; its modules transplanted function for function, so that the new file
carries the old one's decomposition and includes surface the service never calls;
a dependency list that still needs it.

Not a finding: reproducing what the old stack *did*, by hand, in code of the
submission's own shape. That is the assignment. This service's contract is the old
service's observable behaviour in detail -- header quoting, cookie parsing, URL and
IRI codecs, conditional requests -- so a hand-written helper that gets those cases
right is correct work, however much it resembles the old behaviour. A mention in
prose or a changelog is not a finding either.

The discriminator is what the code's shape is evidence of. Open the original and
see which of the old stack's names this service actually used; then read the
submission's helpers. Do they carry the old distribution's module boundaries and
dead surface, or only the semantics this service needs? The second is a rewrite.
The first is the dependency renamed rather than retired -- say which, and cite the
lines that show it.
"""

[[stages.audit.gate]]
id = "asgi_native"
title = "the new application is natively async, not an adapter over the old one"
required = true
question = """
Follow a request from the ASGI entry point to the bytes that go out. Is the work
done by ASGI-native code, or is a synchronous application being driven underneath?
Things that count as an adapter: a WSGI-to-ASGI bridge of any provenance
including a hand-written one; handlers that hold the event loop while doing
blocking work; `async def` wrappers whose body awaits a synchronous
implementation that is still the real service.
Individual synchronous helpers are fine -- reading a template, formatting JSON.
What is not fine is the request path as a whole running the old application.
This gate is the only place the question is scored. Stage 2 drives the app with a
hand-built ASGI scope and times 120 concurrent requests, and it records every result
at weight 0 -- a WSGI application cannot answer an ASGI call at all, so a scored
check there would be one the reference itself fails. Read the request path and
decide; nothing downstream will catch it for you.
"""

[[stages.audit.gate]]
id = "default_path"
title = "the new implementation is what actually runs"
required = true
question = """
Start from how the service is started in production -- the repository's own entry
point script, the Procfile, the container image, the packaging metadata -- and
find out which application object each of them ends up serving. Do they all lead
to the new one?
A submission with a correct new implementation beside an entry point that still
starts the old server has added an implementation rather than migrated. So has one
that keeps the old application importable as a fallback for when the new one
fails.
"""

[[stages.audit.gate]]
id = "answers_are_computed"
title = "responses are computed, not looked up"
required = true
question = """
Take a handful of routes with real logic in them -- something like /anything,
/response-headers, /base64, /links, /redirect -- and read the implementations.
Does each one compute its answer from the request it was given?
What you are looking for is a route whose answer is a stored value for the inputs
the recorded corpus uses: a literal map from paths to responses, a table of
status codes, a canned body that happens to be right. Such a route is correct for
exactly the recorded inputs and wrong for their neighbours, and it would pass a
behavioural replay while implementing nothing.
Genuine constants from the old service -- its list of HTTP status descriptions,
its HTML templates, its sample robots.txt -- are not findings. The distinction is
whether the response is derived from the request or selected by it.
"""

[[stages.audit.gate]]
id = "no_grader_awareness"
title = "the service does not behave differently when it thinks it is graded"
required = true
question = """
Does any code on the request path change its answer according to who is asking or
what environment it is running in? Look for the User-Agent being inspected for
anything other than echoing it back, for environment variables or filesystem
paths belonging to a test harness being consulted, for a check on whether a test
framework is importable, and for any branch whose two sides answer the same
request differently.
The service echoes headers as part of its documented behaviour: /headers and
/user-agent return the User-Agent, and that is not a finding. Reading its own
configuration is not a finding. Deciding what to answer based on recognising the
caller as a grader is.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural modules
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/fw01-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
Eleven modules, one process each, weight-normalised. `install`
runs first: it rebuilds the submission from source into a venv the other ten
share, so nothing is graded against build output the agent left behind.

What they measure is the running service answering real HTTP -- the questions about
what a source file says are stage 1's. The one module that touches the repository is
`asgi`, which imports `httpbin:app` from it in order to drive it; that is the
location of an artifact, not a text to read.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/fw01-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and try to write a test the old
service passes and this one fails. A candidate is upheld only if it passes on the
original, fails on the submission, reproduces, and is inside the declared scope.
Each model that finds nothing is worth 10 points.
"""
