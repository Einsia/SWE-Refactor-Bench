; Shared by every pytest module in this suite; passed explicitly with -c so a
; module's rootdir can be its own directory without losing these settings.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Individual tests are small, but a few deliberately wait on slow endpoints:
; /delay/999 clamps to ten seconds, /drip pauses between chunks, and the
; concurrency proof fires 120 requests at once. 300s per test leaves room for
; those without letting a hung server consume a module's whole budget.
timeout = 300
timeout_method = thread

addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -q
    --no-header
    -rf
    --durations=15

markers =
    behaviour: State A behaviour must survive the migration
    migration: the new stack really replaced the old one
    slow: deliberately waits on a slow endpoint

filterwarnings =
    default
