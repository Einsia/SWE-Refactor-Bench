# The `base` profile: the road network, three vehicles, two speedups.
#
# This file is the QUESTION, not part of either answer.  Both sides are handed a
# copy of it with the same substitutions and different ports, and neither tree's
# own config-example.yml is read — a submission is free to rewrite that file, and
# a grader that took its configuration from the tree being graded would be handing
# the submission the exam paper.
#
# It is upstream's own shape, not an invention.  The structure, the key names, the
# two-connector server block and the profile lists are config-example.yml's, which
# is the file the repository documents and the file an operator has.  That is what
# makes "the same YAML still configures the service" a contract worth grading: the
# submission has to accept THIS, not something convenient.
#
# Placeholders, substituted by modules/build/run.py:
#   @APP_PORT@    the application connector's port for this side
#   @ADMIN_PORT@  the admin connector's port for this side
#   @GRAPH_DIR@   a per-side, per-profile graph cache directory
#   @REPO_ROOT@   the side's tree root, so the OSM fixture resolves to the copy
#                 that side was built from rather than to a shared one
#
# Why three vehicles: car carries contraction hierarchies, bike carries landmarks,
# foot carries neither.  Those are three different search implementations reaching
# the same response schema, so a submission that bound only the profiles it needed
# to make /route answer at all fails visibly rather than subtly.
#
# `bind_host: 0.0.0.0` deviates from upstream's `localhost` deliberately: the
# harness and the server may be in different network namespaces, and a service
# bound to loopback would be unreachable for reasons that have nothing to do with
# the migration.
#
# `max_request_header_size: 50k` is upstream's value and is load-bearing here —
# one corpus case sends a header large enough to matter, and the limit is part of
# what this file configures.

graphhopper:
  datareader.file: @REPO_ROOT@/core/files/andorra.osm.pbf
  graph.location: @GRAPH_DIR@
  profiles:
    - name: car
      custom_model_files: [car.json]
    - name: foot
      custom_model_files: [foot.json]
    - name: bike
      custom_model_files: [bike.json]
  profiles_ch:
    - profile: car
  profiles_lm:
    - profile: bike
  graph.encoded_values: car_access, car_average_speed, foot_access, foot_priority, foot_average_speed, bike_priority, bike_access, roundabout, bike_average_speed, average_slope, max_slope, road_class, road_environment, road_access, hike_rating, mtb_rating, foot_network, bike_network, get_off_bike, smoothness, surface, track_type, country, max_speed, road_class_link, lanes, toll, hazmat, hazmat_tunnel, hazmat_water, max_height, max_weight, max_width, max_length, max_axle_load, urban_density, foot_road_access, bike_road_access
  graph.urban_density.threads: 1
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: ""
  # RAM_STORE rather than the mmap default: two full builds and four launches per
  # grading run, and a memory-mapped graph leaves files whose contents depend on
  # when they were flushed.
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: @APP_PORT@
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  # No request log.  It writes a line per request with a timestamp in it, which is
  # noise in the container log the harness reads a launch failure out of.
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: @ADMIN_PORT@
      bind_host: 0.0.0.0

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
