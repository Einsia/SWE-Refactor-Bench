schema = "swerefactor.evaluation/1"
task = "fw07-graphhopper-dropwizard-to-springboot"
title = "GraphHopper: Dropwizard 4 to Spring Boot 3"
results_dir = "/logs/verifier"

# The published ladder.  Stage 1 is pass/fail and a failure is the whole score;
# stage 2 is worth 40 and pays only for every scored check, which is also what
# stage 3 is asked of; stage 3 pays 10 points for each of 6 adversaries that
# fails to break the submission.
[scoring]
max_score = 100.0
behavioural_points = 40.0
# All of stage 2 or none of it: the points are paid only for a submission that
# passed every scored check, and stage 3 is asked only of the same submission.
verification_points = 60.0
verification_models = 6
points_per_survived_model = 10.0

[metadata]
category = "framework-rewrite"
state_a = "GraphHopper 11.0 on Dropwizard 4.0.16: Jersey/JAX-RS resources, an HK2 object graph assembled by a Dropwizard Bundle, a YAML-bound Configuration, codahale metrics on a second connector, an argparse4j command line, and an AssetsBundle serving the bundled map UI"
state_b = "The same HTTP and CLI surface on Spring Boot 3.5, with no Dropwizard, Jersey, HK2 or JAX-RS artifact anywhere in the module graph"

# --------------------------------------------------------------------------- #
# Stage 1 -- the audit review
# --------------------------------------------------------------------------- #
# Seven gates, all required.  Every one of them is a question about how the code
# is put together, which is why the review is a model reading both trees rather
# than a list of forbidden tokens -- and on this task a token list is actively
# misleading in both directions.
#
# It over-fires: a correct port still mentions Dropwizard in the CHANGELOG, still
# has a `config-example.yml` documenting a `server:` block whose shape it must
# keep, and may well leave a comment saying what the file used to be.
#
# It under-fires, which is worse.  The retired stack's shape is annotations and a
# registration call.  `@Path`/`@GET`/`@Produces` on a class, an `AbstractBinder`
# wiring it, `environment.jersey().register(...)` at the bootstrap.  A submission
# can define its own annotations with those names in its own package, write a
# servlet that scans for them, and satisfy every string check while the dispatch
# is still JAX-RS-shaped and none of Spring's is doing anything.  Reading the
# bootstrap and one request's path through it is the only way to tell.
#
# The reason this matters more here than on a smaller task: the migration touches
# 4 of the 11 poms and 58 source files -- 33 in main (27 in web-bundle, 5 in web, 1
# in navigation) and 25 in test, all of the latter under web -- and leaves the
# other seven modules -- core, web-api, reader-gtfs, map-matching, client-hc,
# tools, example -- unchanged, because none of them names the retired stack.  So
# the diff is large, mostly mechanical, and a reviewer who greps will drown in the
# mechanical part and miss the three or four places where the port is either real
# or faked.
#
# reader-gtfs is the one that looks like an exception and is not: three of its
# classes carry `@Inject` on a constructor, which is JSR-330 rather than the
# retired framework, is version-managed independently of the Dropwizard BOM, and
# is honoured by the target framework as it stands.  A submission that left those
# three files alone did the right thing, and the review should not read them as a
# leftover.
[stages.audit]
runner = "audit"
result = "audit.json"
prompt = "audit/prompt.txt"
scan = "audit/scan.toml"
timeout_sec = 5400
model = "gpt-5.6-sol"
driver = "openai"
samples = 3
allowed_commands = []
# This image has no JDK and no Maven.  On a task whose subject is which framework
# assembles the application, that omission is the point: it removes the only way
# a scan could become an execution, and it means a reviewer answering "is Spring
# doing the dispatching" has to read the bootstrap rather than read a build log.
# Stages 2 and 3 do have the toolchain, and both keep the COMPLETE Maven closure
# rather than the agent's pruned one, because both have to build State A -- whose
# entire web layer is the retired stack -- and a stage that cannot build its own
# oracle cannot show its expectations are reachable.
image = "swerefactor/fw07-audit:1"
context = "audit"

[stages.audit.driver_options]
reasoning_effort = "medium"

[stages.audit.metadata]
about = """
Three independent reviews vote per gate. A fail must cite path, line and quote;
citations are re-opened and checked. There is no abstention: a fail whose
evidence does not check out, and a gate the review could not settle, are both
counted as a pass, because a fail is the verdict that has to be earned. A tie
needs a dead review and resolves to pass as well, recorded as such.
"""

[[stages.audit.gate]]
id = "framework_retired"
title = "no Dropwizard, Jersey, HK2 or JAX-RS artifact remains, and none was transplanted"
required = true
question = """
Is the retired stack actually gone from the submission, or has it been moved?

State A declares it in exactly four of its eleven poms: the root imports
`io.dropwizard:dropwizard-dependencies` as a BOM; `web`, `web-bundle` and
`navigation` depend on `dropwizard-core`; `web` adds `dropwizard-assets`;
`web-bundle` adds `dropwizard-client` and
`com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-xml-provider`; and `web` and
`web-bundle` each carry a test-scoped `dropwizard-testing`, which is the extension
their integration tests boot the application with.  Read the submission's poms and
say whether any of that family is still declared, including transitively through a
BOM.

Then look for the harder case: the framework reproduced by hand.  What that looks
like concretely on this repository -- an annotation named `@Path`, `@GET`,
`@QueryParam` or `@Produces` defined in the submission's own package; a servlet or
filter that reflects over classes looking for such annotations and dispatches
accordingly; a hand-written `Application`/`Configuration`/`Environment` trio with
Dropwizard's lifecycle reimplemented under new names; a service locator with
`bind(X).to(Y)` semantics standing in for the HK2 binder.  A submission that wrote
its own JAX-RS has renamed the dependency, not retired it.

This task bans a category, not one library.  A migration to Spring Boot means
Spring is the framework: swapping Dropwizard for Quarkus, Micronaut, Helidon, or
for Jersey standalone on a bare Jetty, is not this task.  Note also that the
agent's Maven repository carries no jar for the retired groups at all, so a tree
that still compiles against them is a tree the agent could not have built.

Not findings: CHANGELOG, README or comments naming what was replaced; a
`config-example.yml` that still documents a `server:` block, since the
configuration shape is part of the graded surface and has to survive; the seven
modules that do not name the retired stack (`core`, `web-api`, `reader-gtfs`,
`map-matching`, `client-hc`, `tools`, `example`) being unchanged, which is correct
rather than lazy -- the retired stack reaches only `web-bundle` (27 files), `web`
(5 in main, 25 in test) and `navigation` (1); three `reader-gtfs` classes keeping
`@Inject` on a constructor, which is JSR-330, is version-managed independently of
the retired BOM, and is honoured by Spring as it stands; `org.eclipse.jetty`
appearing as an embedded container, which is a container and not the framework,
and which Spring Boot supports as a first-class choice.
"""

[[stages.audit.gate]]
id = "spring_does_the_dispatching"
title = "Spring MVC routes requests, rather than fronting a JAX-RS-shaped dispatcher"
required = true
question = """
Follow one request -- say `GET /route?point=...&profile=car` -- from the process
entry point to the code that computes the answer.  What decides which method runs?

In State A the answer is: `GraphHopperApplication.initialize` adds a
`GraphHopperBundle`, and `environment.jersey().register(...)` is called 25 times
across those two classes -- fourteen resource classes, two filters, three exception
mappers, one message-body writer, four binders, and the health-check registry --
after which Jersey matches each request against the resources' `@Path` annotations.  In a
port the answer should be: Spring's `DispatcherServlet` matches a handler method by
its request mapping.

Things that count as fronting.  A single Spring controller mapped to `/**` whose
body inspects the path and calls one of several old resource objects.  A
`ServletRegistrationBean` that mounts a hand-written dispatcher.  A Spring bean
that holds a table of (path, method, target) and walks it per request while
exactly one mapping is registered with Spring.  All of these start, serve traffic,
and would satisfy any check for "is Spring wired up" -- counting the registered
mappings and reading the dispatch site is what distinguishes them.

The judgement to make, since some code behind a mapping is unavoidable: is Spring
choosing between many registered handler methods, with per-handler code doing the
work -- or is there one mapping, with the choosing done inside it?  A useful
check is the endpoints that differ only by method or by media type on the same
path, and the two `/isochrone` variants, and `/mvt/{z}/{x}/{y}.mvt` with its path
variables: are those distinctions Spring's doing, or a `switch` statement's?

Not a finding: handlers keeping their old method signatures, parameter names or
internal helpers behind a Spring annotation.  If Spring matched the mapping, what
happens on the far side is a style choice.  Also not a finding: the CORS filter or
the GPX media-type filter remaining filters -- Spring has filters too.
"""

[[stages.audit.gate]]
id = "wiring_is_the_frameworks"
title = "the object graph is built by Spring's container, not by a hand-rolled locator"
required = true
question = """
State A assembles thirteen collaborators in one HK2 `AbstractBinder` inside
`GraphHopperBundle.run`: `bind(graphHopper).to(GraphHopper.class)`, a series of
`bindFactory(...)` calls for the pieces that must be produced lazily
(`TranslationMap`, `EncodingManager`, `BaseGraph`, `LocationIndex`, `GtfsStorage`,
`ProfileResolver`, ...), and a named binding for `hasElevation`.  Three further
binders are registered conditionally, bringing the distinct bound types to sixteen:
when public transport is enabled, three competing `PtRouter` implementations of
which one is bound unnamed and all three are bound under names, plus a
`RealtimeFeed` and an `HttpClient`.

Read how the submission gets those same collaborators into the code that answers
requests.  The question is whether the framework's container does it -- beans,
constructor or parameter injection, conditional registration, qualifiers -- or
whether the submission kept the graph and replaced the container with something
of its own: a static registry, a singleton holder, a map from `Class` to instance
consulted at request time, a manual `new` chain threaded through constructors from
a single god object.

Two specific places worth reading, because both are where a shortcut is tempting
and both are observable at run time.  The elevation flag is a named binding of a
`Boolean` in State A, and `/route` responses differ by whether elevation is on.
The `PtRouter` choice depends on configuration, and `/route-pt` answers
differently for each implementation -- so a submission that hard-wired one of the
three has changed behaviour that the configuration is supposed to select.

Not a finding: a `@Configuration` class full of `@Bean` methods that reads much
like the old binder, including keeping the factory classes as-is and calling them
from `@Bean` methods.  Translating a binder into bean definitions is the port.
The distinction is whether the container resolves and injects, or whether the
application looks things up itself.
"""

[[stages.audit.gate]]
id = "configuration_is_bound"
title = "the YAML configuration is bound by the framework, to a typed shape, not re-parsed by hand"
required = true
question = """
State A's configuration is a `GraphHopperServerConfiguration` extending
Dropwizard's `Configuration`: the YAML file's `server:`, `logging:` and `metrics:`
blocks are Dropwizard's own, the `graphhopper:` block is a map bound into a
`GraphHopperConfig`, and Bean Validation annotations on the configuration objects
turn a bad file into a startup error naming the field.

The graded surface keeps that file's shape -- the same keys mean the same things,
and `config-example.yml` continues to describe a working configuration.  So the
question is not whether the shape survived; stage 2 measures that.  The question
is how it survived.

Read for where the map stops.  Any port of this file has to parse it with
something, once, at the boundary, because the two frameworks do not spell every
key alike; what decides this gate is whether that parse ends in a typed object the
framework binds and validates, or whether the parsed map itself survives as the
thing the application consults.

A finding: YAML read with a raw parser at each use site and poked at by key path;
a `Map<String, Object>` held as state and read by key from the code that needs a
value, so the map is the configuration rather than a step on the way to it;
validation replaced by scattered `if (x == null) throw` at first use, so that a
malformed file is reported by whatever happens to touch it first rather than at
startup.  Also a finding: the shape kept only for the keys the corpus exercises,
with the rest silently ignored.

On unknown keys, State A's own behaviour is split, and the split is the standard
to hold a port to rather than a blanket "unknown keys are rejected".  At the top
level and inside `server:`, Dropwizard binds typed objects and refuses an
unrecognised key at startup, naming the field and offering the near misses: a file
whose `server:` is spelled `serverr:` does not start.  Inside `graphhopper:` an
unknown key is accepted and carried in the map, because that block is a flat map
the engine parses itself.  So a port that accepts anything under `graphhopper:` is
matching State A and is not a finding; a port that has made the *typed* blocks
permissive -- a class-level `@JsonIgnoreProperties(ignoreUnknown = true)` over the
root or the connector classes, or a binder told not to fail on unknown properties
-- has dropped a startup error the operator had, and that is.  Ask the oracle
rather than assuming either half.

Bean Validation is the same question one step on: constraint annotations carried
over onto the configuration class but never run against the parsed object are
inert, and a file that violates them is then reported by whatever touches the
field first.  Read whether something actually validates, not whether the
annotations are present.

Whether the `server:` block's connector settings still configure the connectors is
a separate question, and stage 2 measures it directly by moving the ports; a
reviewer who reads it here is confirming, not deciding.

Not a finding: using Spring's own binding rather than Dropwizard's, which is the
point; renaming the configuration classes; an adapter that reads the retired
framework's YAML layout once at startup and contributes it to the target's own
binding -- a Spring `EnvironmentPostProcessor` or `PropertySource` that loads the
file and flattens it to properties is exactly that, and the flattening walk over a
`Map<String, Object>` inside it is the adapter working, not a hand-rolled
configuration object.  Judge such an adapter on what happens after it: what this
gate asks for is a typed object, populated once at startup, with a malformed file
rejected there rather than at first use.  `@ConfigurationProperties` is one way;
so is a mapper invoked once against a configuration class, which is what State A
itself does -- Dropwizard binds this file with Jackson -- so do not treat a
hand-invoked binder as a finding when the oracle's own binder is one.  Note that
Dropwizard's `graphhopper:` block was
itself bound as a map into `GraphHopperConfig`, which holds it as a map -- a port
that keeps doing that for that block is matching State A, not departing from it.
"""

[[stages.audit.gate]]
id = "answers_are_computed"
title = "responses are computed from the request and the routing engine, not looked up"
required = true
question = """
Take a handful of endpoints with real work behind them -- `/route` for a car and
for a bike, `/isochrone`, `/nearest`, `/mvt/{z}/{x}/{y}.mvt`, `/match`, a
`/route-pt` query, and two or three of the error responses -- and read the
implementations.  Does each derive its answer from the request and from the graph
the server loaded?

What you are looking for is a handler whose answer is a stored value for the
inputs a recorded corpus would use: a map from query strings to response bodies; a
JSON document returned verbatim without consulting the routing engine; a hard-coded
distance, time or geometry; a table of status codes keyed by parameter shape; an
exception mapper that recognises a particular message rather than a type.  Such a
handler is right for exactly the recorded inputs and wrong for their neighbours,
and it would pass a behavioural replay while implementing nothing.

Genuine constants are not findings.  This application really does have fixed error
message strings, a fixed set of translation keys for instructions, a small set of
supported media types, and a `/tasks` listing whose content is a fixed list of
registered task names.  The distinction is whether the response is DERIVED FROM
the request or SELECTED BY it -- whether a route's distance comes from a routing
computation or from a literal.

Two places on this repository worth checking specifically, because both are cheap
to fake and both are exercised heavily: the `info.took` field and any other timing
or version field (is it measured, or written down?), and the error bodies for a
request whose points are outside the imported area, which should come from the
routing engine reporting that it cannot connect them rather than from a check that
recognises particular coordinates.
"""

[[stages.audit.gate]]
id = "no_grader_awareness"
title = "the application does not behave differently when it thinks it is graded"
required = true
question = """
Does any code on the request path, on the startup path, or in the command line
change its behaviour according to who is asking or what environment it is running
in?  Look for request headers inspected for anything other than their documented
purpose, for environment variables or filesystem paths belonging to a test harness
being consulted, for a check on whether the process was started by a test, and for
any branch whose two sides answer the same request differently.

Reading configuration is not a finding: this application is configured by a YAML
file and a small set of command-line arguments, and every documented key is fair
game.  Reading `graphhopper.*` system properties is how the upstream code already
allows overrides, so that is not a finding either.  What is a finding is a value
consulted on the request path from outside that configuration, or any code that
reaches for the original tree, a second server, or a recorded transcript at run
time, or a branch whose condition is the shape of a grading harness rather than
the shape of a request.
"""

[[stages.audit.gate]]
id = "own_tests_were_ported"
title = "the repository's own web tests were carried across, not emptied"
required = true
question = """
State A ships 6547 lines of test code across the three modules that are being
migrated: 31 files under `web` (5194 lines, 25 of which name the retired
framework, most by extending its JUnit extension to boot the application), 3 under
`web-bundle`, and 5 under `navigation`.  These are integration tests: they start
the whole application on a real port with a real graph and assert on responses.

That means, unlike the seven untouched modules, this suite CANNOT survive
unchanged -- the class that boots the application is the framework's, so every
test that used it has to be rewritten against the target framework's equivalent.
Judge whether it was rewritten or discarded.

What counts as a finding: test files deleted; a test method body replaced by a
return; an assertion turned into a print or a comment; `@Disabled` or an
`assumeTrue(false)` added at the top; the `@Test` or `@ParameterizedTest`
ANNOTATION REMOVED from a method whose body and assertions are otherwise intact,
so it is no longer collected and no longer runs; a parametrised case list
emptied; an assertion loosened until it cannot fail -- asserting a status is
non-zero, that a body is non-null, that a response equals itself; a test that
boots nothing and asserts on a constructed object where it previously drove HTTP.

Do this mechanically rather than by impression, because the annotation case is
invisible to reading: search for `@Test` and `@ParameterizedTest` in each root and
compare the counts. Search ONE MODULE'S TEST DIRECTORY AT A TIME -- `web/src/test`,
then `web-bundle/src/test`, then `navigation/src/test` -- and not all three at once,
and not a whole root. The search tool returns at most 200 hits and says so when it
truncates; these three modules together hold about two hundred of these
annotations, and a whole root holds well over a thousand, so a single wide search
comes back capped on BOTH sides, at the same number, and a real difference of one
or two reads as no difference at all. Per module the counts are small enough to be
exact. If any result says it was capped, that count is not evidence of anything:
narrow the path and ask again.

Then compare per module, and where a module's count went down, narrow to the file.
A file whose annotation count fell while its method count did not is the finding
above. A count a rewrite legitimately changed -- several `@Test` methods folded
into one `@ParameterizedTest`, or the reverse -- is not, but say which you are
looking at, and `diff` on that one path settles it. Do not settle for a census: the
number of files, their sizes, and the total line count can all be unchanged while a
method has silently stopped running, and this gate is not about any of those.

What does not count: the boot mechanism changing, which is required; helper
methods being rewritten; a test that asserted on a framework-specific exception
type now asserting on the observable response instead; `@ParameterizedTest`
plumbing changing shape; tests being added.  Also not a finding: a test whose
subject was a Dropwizard-specific detail with no counterpart in the target
framework being removed, PROVIDED the observable behaviour it covered is still
covered somewhere.  Say which case you think you are looking at, and cite it.

The question is whether the suite would still fail if the behaviour it covers
broke -- not whether it is byte-identical, and not how many lines it has.
"""

# --------------------------------------------------------------------------- #
# Stage 2 -- the behavioural modules
# --------------------------------------------------------------------------- #
[stages.behavioural]
runner = "behavioural"
result = "behavioural.json"
suite = "behavioural/suite.toml"
timeout_sec = 10800
image = "swerefactor/fw07-behavioural:1"
context = "behavioural"

[stages.behavioural.metadata]
about = """
Eleven modules, one process each, weight-normalised, and every one of them on one
axis: does the rewritten repository still answer what the original answered.  A
twelfth, `provenance`, reported and scored nothing; it is deleted, because a module
that earns no weight and blocks nothing is a module whose findings no reader could
act on.  Nothing here asks
whether the rewrite happened -- that is stage 1's question, its gates are required,
and a failure there scores the submission zero before this image runs.

HOW THE COMPARISON IS MADE.  This stage is a live differential.  State A's source
ships in the stage image, and BOTH sides are compiled at grade time by the same
function with the same offline command -- a comparison in which the two sides were
built differently is not a comparison of the two sides.  Then both jars are
started, on different ports, and every case in the corpus is sent to both.

What the image build pays for is not a jar but the ability to produce one: the
complete Maven closure, warmed by building State A while there is still a network,
plus the npm cache its map UI is packed from.  Nothing is compared against a
recorded transcript, which matters because a recording would have to be re-taken
whenever a case was added, and a stale recording grades the recording.

`build` is required and runs first, and it is scored rather than treated as setup:
a submission that does not build has failed the most basic thing the task asked
for, and that belongs on a weighted module instead of surfacing as an
infrastructure error that reads like the grader broke.  It compiles the submission
from source, and it removes every `target/` directory on BOTH sides first, so a jar
the agent committed into the tree cannot be discovered and graded in place of the
sources it was supposed to have been built from.  Then it publishes a ledger the
ten modules after it restore from rather than rebuilding.

WHAT IS COMPARED, AND WHAT IS DELIBERATELY NOT.  Status, headers as a name-to-
values map, and body -- per case, one of byte-exact, JSON-structural, or ignored.
Header ORDER is not compared, because Jetty and Tomcat do not agree on it and the
order is not the contract.  Charset parameters are not compared, only media types,
so the choice of embedded container stays the submission's.  Fields that a server
does not reproduce between two calls to itself are dropped before A is compared to
B: every request is sent twice to each side, and anything that differs within one
side's own pair -- `info.took`, `X-GH-Took`, `Date`, a log id in a 500 body, a GPX
`<time>`, a healthcheck `timestamp` -- is masked rather than listed by hand, so
the mask cannot silently go stale.

Also excluded, and stage 3's declared scope mirrors these: errors the container
generates before the application is reached (`//route` is answered by Jetty's URI
parser, not by any code either side wrote), the byte-exactness of argparse4j's
usage text, the bodies of `/metrics` and `/threads`, and container error-page
bodies.  Those are properties of the retired container, not of the application, and
grading them would be grading against Jetty rather than against GraphHopper.

The consequence, stated plainly because a reader of the scores will meet it: a
submission that changed nothing at all passes this stage completely.  That is
correct for a stage that only asks about behaviour, it is what makes State A a
usable oracle for the agent, and it is caught by stage 1 -- whose gates are
required and whose failure is the whole score.  It is also not a tree the agent
could have produced: its Maven repository carries no jar for the retired stack, so
the untouched tree does not compile while the work is being done.
"""

# --------------------------------------------------------------------------- #
# Stage 3 -- the verification probe
# --------------------------------------------------------------------------- #
[stages.verification]
runner = "verification"
result = "verification.json"
probe = "verification/probe.toml"
timeout_sec = 54000
image = "swerefactor/fw07-verification:1"
context = "verification"

[stages.verification.adjudicator]
model = "claude-opus-5"
driver = "anthropic"

[stages.verification.adjudicator.driver_options]
reasoning_effort = "high"

[stages.verification.metadata]
about = """
Six models each get an hour with both trees and both running servers, and try to
construct a request -- in the same shape as the corpus stage 2 replays -- on which
the two disagree.  A candidate is upheld only if the two sides genuinely differ,
the difference survives the same volatility masking stage 2 applies, it reproduces
across three runs, and it is inside the declared scope.  Each model that finds
nothing is worth 10 points.

The scope declaration is the load-bearing part of this stage, because on a
framework migration the easiest disagreements to find are the ones that are not
the submission's fault: two embedded containers differ on header order, on the
error page for a malformed request line, on how they answer a path with an empty
segment, and on the exact wording of a 400 produced before any application code
runs.  A probe that returned those would be measuring Jetty against Tomcat.  So
probe.toml declares the same exclusions stage 2 applies, and a candidate outside
them is rejected rather than scored -- which is also why this stage, like stage 2,
compares headers as a map and media types without charset.

Both sides are built here, both from source, against the COMPLETE Maven closure --
this image keeps the retired stack, because State A's whole web layer is written
against it and a stage that cannot build its own reference cannot run a
differential.  That is safe at this point in the ladder in a way it would not be
earlier: anything reaching this stage has already passed stage 1's gates, so the
tree being compiled is one whose retirement has already been judged.
"""
